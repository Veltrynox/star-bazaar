<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Bazaar Task Board</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--ink:#1b1d21;--mute:#6b7078;--line:#dcdcd6;--acc:#2b5fd9;--ok:#1f8a4c;--warn:#b7791f;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1d2026;--ink:#e8e9ec;--mute:#9097a3;--line:#323741;--acc:#6b9bff;--ok:#4cc27f;--warn:#e0a84a;--bad:#ef6a5b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:16px;margin:0 8px 0 0}
button,select,input,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 9px}
button{cursor:pointer}button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button.danger:hover{border-color:var(--bad);color:var(--bad)}
#stat{color:var(--mute);margin-left:auto}
#dirty{color:var(--warn);font-weight:600}
main{padding:12px 16px 60px;max-width:1100px;margin:0 auto}
.task{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.row{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.id{font-weight:700;min-width:44px}
.title{flex:1;min-width:200px;font-weight:600}
.tag{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.s-done{color:var(--ok);border-color:var(--ok)}.s-queued{color:var(--acc);border-color:var(--acc)}
.s-partial,.s-blocked{color:var(--warn);border-color:var(--warn)}.s-stopped{color:var(--bad);border-color:var(--bad)}
.meta{color:var(--mute);font-size:12px;margin-top:4px}
.brief{margin-top:6px;white-space:pre-wrap;display:none;color:var(--mute);font-size:13px}
.task.open .brief{display:block}
.act{display:flex;gap:6px}
.act button{padding:2px 8px;font-size:12px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:min(720px,94vw);padding:16px}
dialog::backdrop{background:#0008}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 2px}
dialog input,dialog select,dialog textarea{width:100%}
textarea{min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{color:var(--mute);padding:30px;text-align:center}
@media(max-width:600px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Task board</h1>
  <input type="file" id="pick" accept=".json,application/json" hidden><button id="open">Open schedule.json</button>
  <button id="save" class="primary" disabled>Save</button>
  <button id="add" disabled>+ New task</button>
  <input id="q" placeholder="Search" size="16">
  <select id="fs"><option value="">All statuses</option><option value="active">Not done</option></select>
  <select id="fa"><option value="">All agents</option></select>
  <span id="dirty"></span><span id="stat">No file loaded</span>
</header>
<main id="list"><div class="empty">Click "Open schedule.json" and pick the file from the project root.<br>Save writes back to that same file (Chrome, Edge or Arc). Other browsers download a copy.</div></main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <div class="two">
      <div><label>Task id</label><input id="f_id" required></div>
      <div><label>Status</label><select id="f_status"></select></div>
    </div>
    <label>Title</label><input id="f_title" required>
    <div class="two">
      <div><label>Owner agent</label><input id="f_agent" list="agents"></div>
      <div><label>Turn cap</label><input id="f_cap" type="number" min="0"></div>
    </div>
    <label>Depends on (comma separated ids)</label><input id="f_dep">
    <label>Window</label><input id="f_win">
    <label>Brief</label><textarea id="f_brief"></textarea>
    <label>Owner note</label><input id="f_note">
    <div class="row" style="margin-top:12px;justify-content:flex-end">
      <button type="button" id="cancel">Cancel</button>
      <button type="submit" class="primary" id="ok">Apply</button>
    </div>
  </form>
  <datalist id="agents"></datalist>
</dialog>

<script>
const STATUSES=["queued","partial","blocked","stopped","done"];
let data=null,handle=null,dirty=false,editing=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function setDirty(v){dirty=v;$("dirty").textContent=v?"Unsaved changes":"";}
function load(obj){
  data=obj;data.done_task_ids=data.done_task_ids||[];
  $("save").disabled=false;$("add").disabled=false;setDirty(false);
  const ags=[...new Set(data.tasks.map(t=>t.owner_agent).filter(Boolean).concat("owner"))].sort();
  $("fa").innerHTML='<option value="">All agents</option>'+ags.map(a=>`<option>${esc(a)}</option>`).join("");
  $("agents").innerHTML=ags.map(a=>`<option value="${esc(a)}">`).join("");
  render();
}
function render(){
  if(!data)return;
  const q=$("q").value.toLowerCase(),fs=$("fs").value,fa=$("fa").value;
  const order={queued:0,partial:1,blocked:2,stopped:3,done:4};
  const rows=data.tasks.filter(t=>{
    if(fs==="active"&&t.status==="done")return false;
    if(fs&&fs!=="active"&&t.status!==fs)return false;
    if(fa&&t.owner_agent!==fa)return false;
    if(q&&!JSON.stringify(t).toLowerCase().includes(q))return false;
    return true;
  }).sort((a,b)=>(order[a.status]??9)-(order[b.status]??9));
  const c={};data.tasks.forEach(t=>c[t.status]=(c[t.status]||0)+1);
  $("stat").textContent=data.tasks.length+" tasks · "+STATUSES.map(s=>(c[s]||0)+" "+s).join(" · ");
  $("list").innerHTML=rows.length?rows.map(t=>{
    const i=data.tasks.indexOf(t);
    return `<div class="task" data-i="${i}">
      <div class="row">
        <span class="id">${esc(t.task_id)}</span>
        <span class="title">${esc(t.title)}</span>
        <span class="tag s-${esc(t.status)}">${esc(t.status)}</span>
        <span class="tag">${esc(t.owner_agent)}</span>
        <span class="act">
          ${t.status==="done"?`<button data-a="undone">Reopen</button>`:`<button data-a="done">Done</button>`}
          <button data-a="edit">Edit</button>
          <button data-a="del" class="danger">Delete</button>
        </span>
      </div>
      <div class="meta">${(t.depends_on||[]).length?"depends on "+esc(t.depends_on.join(", "))+" · ":""}cap ${esc(t.turn_cap??"-")}${t.window?" · "+esc(t.window):""}</div>
      <div class="brief">${esc(t.brief)}${t.owner_note?"\n\nOwner note: "+esc(t.owner_note):""}</div>
    </div>`}).join(""):'<div class="empty">No tasks match.</div>';
}
function markDone(t,on){
  t.status=on?"done":"queued";
  const s=new Set(data.done_task_ids);on?s.add(t.task_id):s.delete(t.task_id);data.done_task_ids=[...s];
}
$("list").addEventListener("click",e=>{
  const card=e.target.closest(".task");if(!card)return;
  const t=data.tasks[+card.dataset.i],a=e.target.dataset.a;
  if(!a){card.classList.toggle("open");return;}
  if(a==="done")markDone(t,true);
  else if(a==="undone")markDone(t,false);
  else if(a==="del"){
    const users=data.tasks.filter(x=>(x.depends_on||[]).includes(t.task_id)).map(x=>x.task_id);
    if(!confirm(`Delete ${t.task_id} "${t.title}"?`+(users.length?`\n\nStill listed as a dependency of: ${users.join(", ")}`:"")))return;
    data.tasks.splice(+card.dataset.i,1);data.done_task_ids=data.done_task_ids.filter(x=>x!==t.task_id);
  }else if(a==="edit"){openDlg(t);return;}
  setDirty(true);render();
});
["q","fs","fa"].forEach(id=>$(id).addEventListener("input",render));

$("f_status").innerHTML=STATUSES.map(s=>`<option>${s}</option>`).join("");
function nextId(){
  const n=data.tasks.map(t=>/^T(\d+)/.exec(t.task_id)).filter(Boolean).map(m=>+m[1]);
  return "T"+(Math.max(0,...n)+1);
}
function openDlg(t){
  editing=t;const n=t||{task_id:nextId(),status:"queued",owner_agent:"",turn_cap:30,depends_on:[],window:"",brief:"",owner_note:"",title:""};
  $("f_id").value=n.task_id;$("f_status").value=n.status;$("f_title").value=n.title;
  $("f_agent").value=n.owner_agent||"";$("f_cap").value=n.turn_cap??"";
  $("f_dep").value=(n.depends_on||[]).join(", ");$("f_win").value=n.window||"";
  $("f_brief").value=n.brief||"";$("f_note").value=n.owner_note||"";
  $("dlg").showModal();
}
$("add").onclick=()=>openDlg(null);
$("cancel").onclick=()=>$("dlg").close();
$("form").addEventListener("submit",e=>{
  e.preventDefault();
  const id=$("f_id").value.trim();
  if(data.tasks.some(x=>x.task_id===id&&x!==editing)){alert("Id "+id+" already exists.");return;}
  const old=editing?editing.task_id:null;
  const t=editing||{};
  Object.assign(t,{task_id:id,title:$("f_title").value.trim(),owner_agent:$("f_agent").value.trim(),
    depends_on:$("f_dep").value.split(",").map(s=>s.trim()).filter(Boolean),status:$("f_status").value,
    turn_cap:$("f_cap").value===""?undefined:+$("f_cap").value,window:$("f_win").value,brief:$("f_brief").value});
  if($("f_note").value)t.owner_note=$("f_note").value;else delete t.owner_note;
  if(t.turn_cap===undefined)delete t.turn_cap;
  if(!editing)data.tasks.push(t);
  if(old&&old!==id)data.tasks.forEach(x=>x.depends_on=(x.depends_on||[]).map(d=>d===old?id:d));
  const s=new Set(data.done_task_ids);s.delete(old);t.status==="done"?s.add(id):s.delete(id);data.done_task_ids=[...s];
  setDirty(true);load2();$("dlg").close();
});
function load2(){const d=dirty;load(data);setDirty(d);}

async function loadFile(f){
  try{load(JSON.parse(await f.text()));}
  catch(e){alert("Could not read "+(f.name||"file")+": "+e.message);}
}
$("pick").addEventListener("change",()=>{const f=$("pick").files[0];handle=null;if(f)loadFile(f);$("pick").value="";});
$("open").onclick=async()=>{
  if(window.showOpenFilePicker){
    try{
      [handle]=await showOpenFilePicker({types:[{description:"JSON",accept:{"application/json":[".json"]}}]});
      await loadFile(await handle.getFile());return;
    }catch(e){if(e.name==="AbortError")return;handle=null;}
  }
  $("pick").click();
};
document.addEventListener("dragover",e=>e.preventDefault());
document.addEventListener("drop",async e=>{
  e.preventDefault();const it=e.dataTransfer.items[0];
  handle=(it&&it.getAsFileSystemHandle)?await it.getAsFileSystemHandle().catch(()=>null):null;
  const f=e.dataTransfer.files[0];if(f)loadFile(f);
});
$("save").onclick=async()=>{
  const text=JSON.stringify(data,null,2)+"\n";
  try{
    if(handle){const w=await handle.createWritable();await w.write(text);await w.close();setDirty(false);}
    else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.download="schedule.json";a.click();setDirty(false);}
  }catch(e){alert("Could not save: "+e.message);}
};
window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue="";}});
</script>
</body>
</html>
