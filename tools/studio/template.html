<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Bazaar Studio</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--ink:#1b1d21;--mute:#6b7078;--line:#dcdcd6;--acc:#2b5fd9;--ok:#1f8a4c;--warn:#b7791f;--bad:#c0392b;
--mil:#c0563b;--lux:#9a4fc0;--min:#9a7a2b;--bio:#2f9150;--fnd:#3b6fc4}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1d2026;--ink:#e8e9ec;--mute:#9097a3;--line:#323741;--acc:#6b9bff;--ok:#4cc27f;--warn:#e0a84a;--bad:#ef6a5b;
--mil:#ef8a6e;--lux:#c79af0;--min:#d9b65a;--bio:#52c27a;--fnd:#6c9eef}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
nav{display:flex;gap:4px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
nav b{margin-right:12px}
nav button.tab{border:0;background:none;padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--mute);font:inherit}
nav button.tab.on{background:var(--card);color:var(--ink);border:1px solid var(--line)}
section.pane{display:none;flex:1;min-height:0}
section.pane.on{display:flex}
iframe{border:0;width:100%;height:100%;flex:1;background:var(--bg)}
button,select,input,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
button{cursor:pointer}button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
#sk{flex-direction:column;overflow:hidden}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--line)}
.bar .note{color:var(--warn);font-weight:600}
.bar .sp{margin-left:auto;color:var(--mute)}
.body{flex:1;display:flex;min-height:0}
#treewrap{flex:1;overflow:auto;padding:12px}
#side{width:380px;max-width:42vw;border-left:1px solid var(--line);overflow:auto;padding:12px 14px}
.btabs{display:flex;gap:6px;flex-wrap:wrap}
.btabs button.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
svg text{font:12px system-ui,sans-serif;fill:var(--ink)}
.node rect{fill:var(--card);stroke-width:2;cursor:pointer}
.node.sel rect{stroke-width:4}
.node.tech rect{stroke-dasharray:5 3}
.node.changed .nm{font-style:italic}
.node text.sub{fill:var(--mute);font-size:10.5px}
.edge{fill:none;stroke:var(--mute);stroke-width:1.6;opacity:.75}
.edge.long{stroke-dasharray:4 4}
.badge{font-size:10px;fill:var(--mute)}
h3{margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 2px}
#side input,#side select,#side textarea{width:100%}
#side textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
td,th{padding:3px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mute);font-weight:600}
.bad{color:var(--bad);font-weight:600}.ok{color:var(--ok)}.warn{color:var(--warn)}
.chip{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:99px;padding:0 7px;margin:1px 2px 1px 0;color:var(--mute)}
.empty-slot{font-size:12px;color:var(--mute)}
@media(max-width:800px){.body{flex-direction:column}#side{width:auto;max-width:none;border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<nav>
  <b>Star Bazaar Studio</b>
  <button class="tab on" data-p="tasks">Task board</button>
  <button class="tab" data-p="flow">Project workflow</button>
  <button class="tab" data-p="sk">Final skills (draft)</button>
  <button class="tab" data-p="ev">Event texts (draft)</button>
</nav>
<section class="pane on" id="tasks"><iframe id="f_tasks" title="Task board"></iframe></section>
<section class="pane" id="flow"><iframe id="f_flow" title="Project workflow"></iframe></section>
<section class="pane" id="sk">
  <div class="bar">
    <div class="btabs" id="btabs"></div>
    <button id="add">+ Node</button>
    <button id="open">Open draft…</button>
    <button id="save" class="primary">Save draft</button>
    <button id="reset">Reset to consensus</button>
    <span class="note" id="dirty"></span>
    <span class="sp" id="where">Draft only: never written to data/ or the game.</span>
  </div>
  <div class="body">
    <div id="treewrap"></div>
    <aside id="side"></aside>
  </div>
  <input type="file" id="pick" accept=".json,application/json" hidden>
</section>

<section class="pane" id="ev" style="flex-direction:column;overflow:hidden">
  <div class="bar">
    <select id="evview"><option value="main">Main text (title + body)</option><option value="all">All lines (with ids)</option></select>
    <input id="evq" placeholder="Search events" size="22">
    <label style="display:inline;margin:0"><input type="checkbox" id="evonly"> edited only</label>
    <button id="evopen">Open draft…</button>
    <button id="evsave" class="primary">Save draft</button>
    <button id="evreset">Reset</button>
    <span class="note" id="evdirty"></span>
    <span class="chip warn" title="Owner rule">English only: we ignore localisation (Russian) until the owner asks for a translation.</span>
    <span class="sp" id="evwhere">Draft only: the story agent reads the saved file; data/story_text.json is generated from story/*.md.</span>
  </div>
  <div class="body">
    <div id="evlist" style="width:300px;max-width:40vw;overflow:auto;border-right:1px solid var(--line);padding:8px"></div>
    <div id="evmain" style="flex:1;overflow:auto;padding:12px 16px"></div>
  </div>
  <input type="file" id="evpick" accept=".json,application/json" hidden>
</section>
<script id="evseed" type="application/json">/*EVSEED*/</script>
<script id="seed" type="application/json">/*SEED*/</script>
<script>
const SRC_TASKS=/*TASKS_SRCDOC*/"";
const SRC_FLOW=/*FLOW_SRCDOC*/"";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("f_tasks").srcdoc=SRC_TASKS; $("f_flow").srcdoc=SRC_FLOW;
document.querySelectorAll("nav .tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav .tab").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll("section.pane").forEach(p=>p.classList.toggle("on",p.id===b.dataset.p));
  if(b.dataset.p==="sk")drawAll();
  if(b.dataset.p==="ev")evDraw();
});


/* ---------------- optional autosave server (tools/studio/server.py) ---------------- */
let SRV=false;const pend={};
function srvQueue(name,get,statusId){
  if(!SRV)return;clearTimeout(pend[name]);
  pend[name]=setTimeout(async()=>{try{const r=await fetch("/save/"+name,{method:"POST",body:get()});
    if(r.ok&&statusId)$(statusId).textContent="Autosaved to design/drafts/"+name+".json at "+new Date().toLocaleTimeString()+" (not the game).";}
    catch(e){SRV=false;}},500);
}
/* ---------------- skills ---------------- */
const SEED=JSON.parse($("seed").textContent);
const MK={fnd:"Foundations",mil:"Military",lux:"Luxury",min:"Minerals",bio:"Biotech"};
const KEY="starBazaarSkillsDraft";
let D=null,branch="mil",sel=null,dirty=false,handle=null;
function clone(o){return JSON.parse(JSON.stringify(o));}
function lsGet(){try{return JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){return null;}}
function lsSet(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){}}
D=lsGet()||clone(SEED);
if(!D.nodes)D=clone(SEED);
function setDirty(v){dirty=v;$("dirty").textContent=v?"Unsaved":"";if(v){lsSet();srvQueue("skills-draft",payload,"where");}}
const byId=()=>Object.fromEntries(D.nodes.map(n=>[n.id,n]));
const orig=Object.fromEntries(SEED.nodes.map(n=>[n.id,JSON.stringify(n)]));
const changed=n=>orig[n.id]!==JSON.stringify(n);

$("btabs").innerHTML=Object.keys(MK).map(k=>`<button data-b="${k}" style="border-left:4px solid var(--${k})">${MK[k]}</button>`).join("")+`<button data-b="all">Stats</button>`;
$("btabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;branch=b.dataset.b;sel=null;drawAll();};

function layout(m){
  const ns=D.nodes.filter(n=>n.market===m),ids=new Set(ns.map(n=>n.id)),by=Object.fromEntries(ns.map(n=>[n.id,n]));
  const depth={};
  const dep=n=>{if(depth[n.id]!=null)return depth[n.id];depth[n.id]=0;
    const ps=(n.prereqs||[]).filter(p=>ids.has(p));
    return depth[n.id]=ps.length?1+Math.max(...ps.map(p=>dep(by[p]))):0;};
  ns.forEach(dep);
  const cols=[];ns.forEach(n=>{(cols[depth[n.id]]=cols[depth[n.id]]||[]).push(n);});
  const row={};
  cols.forEach((c,ci)=>{
    if(!c)return;
    c.forEach(n=>{const ps=(n.prereqs||[]).filter(p=>ids.has(p)&&row[p]!=null);
      n._bc=ps.length?ps.reduce((a,p)=>a+row[p],0)/ps.length:1e3+ns.indexOf(n);});
    c.sort((a,b)=>a._bc-b._bc);
    let last=-1;c.forEach(n=>{let r=Math.max(last+1,Math.round(n._bc>=1e3?last+1:n._bc));row[n.id]=r;last=r;});
  });
  return {ns,depth,row,ids};
}
const W=168,H=58,GX=78,GY=16;
function drawTree(){
  const L=layout(branch),pos={};
  L.ns.forEach(n=>pos[n.id]={x:16+L.depth[n.id]*(W+GX),y:16+L.row[n.id]*(H+GY)});
  const maxx=Math.max(...Object.values(pos).map(p=>p.x))+W+20,maxy=Math.max(...Object.values(pos).map(p=>p.y))+H+20;
  const col=`var(--${branch})`;
  let edges="",nodes="";
  L.ns.forEach(n=>{(n.prereqs||[]).forEach(p=>{
    if(!pos[p])return;
    const a=pos[p],b=pos[n.id],x1=a.x+W,y1=a.y+H/2,x2=b.x,y2=b.y+H/2,mx=(x1+x2)/2;
    const longE=L.depth[n.id]-L.depth[p]>1;
    edges+=`<path class="edge${longE?" long":""}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`;
  });});
  L.ns.forEach(n=>{
    const p=pos[n.id],ext=(n.prereqs||[]).filter(x=>!pos[x]);
    const nm=n.name.length>22?n.name.slice(0,21)+"…":n.name;
    nodes+=`<g class="node ${n.kind==="tech"?"tech":""} ${sel===n.id?"sel":""} ${changed(n)?"changed":""}" data-id="${esc(n.id)}" transform="translate(${p.x},${p.y})">
      <rect width="${W}" height="${H}" rx="8" style="stroke:${col}"/>
      <text class="nm" x="10" y="20">${esc(nm)}</text>
      <text class="sub" x="10" y="36">${esc(n.id)} · ${n.kind==="tech"?"tech "+(n.values&&Object.entries(n.values).find(([k])=>k.startsWith("tech_goal"))?.[1]||""):n.cost+" pt"}</text>
      <text class="badge" x="10" y="50">${n.origin&&n.origin.startsWith("new")?"NEW":""}${changed(n)?" · edited":""}${ext.length?" · needs "+esc(ext.join(", ")).slice(0,26):""}</text>
    </g>`;
  });
  const empties=(D.empty_slots||[]).filter(s=>s.toLowerCase().startsWith(branch));
  $("treewrap").innerHTML=`<svg width="${maxx}" height="${maxy}" viewBox="0 0 ${maxx} ${maxy}">${edges}${nodes}</svg>
    <p class="empty-slot">Empty slots (agreed to stay empty): ${empties.length?empties.map(s=>`<span class="chip">${esc(s)}</span>`).join(""):"none"}</p>`;
  $("treewrap").querySelectorAll(".node").forEach(g=>g.onclick=()=>{sel=g.dataset.id;drawAll();});
}

function effs(n){return [n.effect,...(n.extra||[])].filter(Boolean);}
function val(n,e){return e.key&&n.values?n.values[e.key]:undefined;}
function stats(){
  const out={};
  Object.keys(MK).forEach(m=>out[m]={n:0,skills:0,techs:0,pts:0,vol:0,price:0,cut:0,goal:0});
  D.nodes.forEach(n=>{const s=out[n.market];if(!s)return;
    s.n++;n.kind==="tech"?s.techs++:s.skills++;s.pts+=n.kind==="tech"?0:Number(n.cost)||0;
    Object.entries(n.values||{}).forEach(([k,v])=>{if(k.startsWith("tech_goal"))s.goal+=Number(v)||0;});
    effs(n).forEach(e=>{const v=val(n,e);if(typeof v!=="number")return;const mk=e.target;const t=out[mk];
      if(!t)return;
      if(e.type==="volume_pct"&&!e.condition)t.vol+=v;
      if(e.type==="sale_price_pct")t.price+=v;
      if(e.type==="event_cut_pct")t.cut+=v;});
  });
  return out;
}
function drawStats(){
  const st=stats(),caps=D.balance_caps||{},budget=D.skill_point_budget||21;
  const total=Object.values(st).reduce((a,s)=>a+s.pts,0);
  const rows=Object.entries(st).map(([m,s])=>`<tr><td style="color:var(--${m});font-weight:600">${MK[m]}</td><td>${s.n}</td><td>${s.skills}/${s.techs}</td><td>${s.pts}</td><td>${s.goal}</td>
   <td class="${s.vol>caps.volume+1e-9?"bad":""}">${s.vol.toFixed(2)}</td><td class="${s.price>caps.price+1e-9?"bad":""}">${s.price.toFixed(2)}</td><td class="${s.cut>caps.event_cut+1e-9?"bad":""}">${s.cut.toFixed(2)}</td></tr>`).join("");
  $("treewrap").innerHTML=`<h3>Whole tree</h3>
   <table><tr><th>Branch</th><th>Nodes</th><th>Skill/Tech</th><th>Points to take all</th><th>Tech goal units</th><th>Free volume (cap ${caps.volume})</th><th>Sale price (cap ${caps.price})</th><th>Event cut (cap ${caps.event_cut})</th></tr>${rows}</table>
   <p>Total points to take every skill: <b>${total}</b> against about <b>${budget}</b> earned in a run, so a player takes roughly ${Math.round(budget/Math.max(total,1)*100)}% of the tree. Techs cost crafting, not points.</p>
   <p class="empty-slot">Slots left empty: ${(D.empty_slots||[]).map(s=>`<span class="chip">${esc(s)}</span>`).join("")||"none"}</p>
   <p class="empty-slot">Caps are the consensus guards (economy and QA). Red = over the cap. Only effects whose value is in the draft are counted; conditional volume is ignored.</p>`;
}

function fld(label,html){return `<label>${label}</label>${html}`;}
function drawSide(){
  const n=sel&&byId()[sel];
  if(!n){$("side").innerHTML=`<h3>Select a node</h3><p style="color:var(--mute)">Click a node in the tree to see its effect, numbers and prerequisites, and to edit them. Edits stay in this draft (saved in your browser and in the file you choose with Save draft). The game is never touched.</p>`;return;}
  const st=stats()[n.market];
  const used=D.nodes.filter(x=>(x.prereqs||[]).includes(n.id)).map(x=>x.id);
  const vals=Object.entries(n.values||{}).map(([k,v])=>fld(esc(k),`<input data-v="${esc(k)}" type="number" step="any" value="${esc(v)}">`)).join("");
  $("side").innerHTML=`
   <h3 style="margin-top:0">${esc(n.id)} ${n.origin&&n.origin.startsWith("new")?'<span class="chip">new (consensus)</span>':'<span class="chip">existing</span>'}${changed(n)?'<span class="chip warn">edited</span>':""}</h3>
   ${fld("Name",`<input data-f="name" value="${esc(n.name)}">`)}
   ${fld("Plain line (what it does)",`<textarea data-f="plain">${esc(n.plain)}</textarea>`)}
   ${fld("Flavour line",`<textarea data-f="flavour">${esc(n.flavour)}</textarea>`)}
   <div class="two">${fld("Kind",`<select data-f="kind"><option ${n.kind==="skill"?"selected":""}>skill</option><option ${n.kind==="tech"?"selected":""}>tech</option></select>`)}
   ${fld("Cost (points; 0 for tech)",`<input data-f="cost" type="number" value="${esc(n.cost)}">`)}</div>
   ${fld("Prerequisites (ids, comma separated)",`<input data-f="prereqs" value="${esc((n.prereqs||[]).join(", "))}">`)}
   <h3>Effect</h3>
   <div class="two">${fld("Type",`<input data-e="type" value="${esc(n.effect&&n.effect.type)}">`)}${fld("Target",`<input data-e="target" value="${esc(n.effect&&n.effect.target)}">`)}</div>
   ${effs(n).slice(1).map(e=>`<div class="chip">+ also ${esc(e.type)} ${esc(e.target||"")} ${esc(e.id||"")}</div>`).join("")}
   <h3>Numbers (placeholders for balance.json)</h3>${vals||'<span class="chip">no numbers</span>'}
   <h3>Stats</h3>
   <table><tr><td>Branch</td><td>${MK[n.market]}: ${st.n} nodes, ${st.pts} points to take all</td></tr>
   <tr><td>Needed by</td><td>${used.map(x=>`<span class="chip">${esc(x)}</span>`).join("")||"nothing (leaf)"}</td></tr>
   <tr><td>Free volume / price / cut in ${MK[n.market]}</td><td>${st.vol.toFixed(2)} / ${st.price.toFixed(2)} / ${st.cut.toFixed(2)}</td></tr></table>
   <p style="margin-top:12px"><button id="del" style="color:var(--bad)">Delete node</button></p>`;
  const touch=()=>{setDirty(true);drawTree();};
  $("side").querySelectorAll("[data-f]").forEach(i=>i.oninput=()=>{const f=i.dataset.f;
    n[f]=f==="cost"?Number(i.value):f==="prereqs"?i.value.split(",").map(s=>s.trim()).filter(Boolean):i.value;touch();});
  $("side").querySelectorAll("[data-e]").forEach(i=>i.oninput=()=>{n.effect=n.effect||{};n.effect[i.dataset.e]=i.value;touch();});
  $("side").querySelectorAll("[data-v]").forEach(i=>i.oninput=()=>{n.values[i.dataset.v]=Number(i.value);setDirty(true);});
  $("del").onclick=()=>{if(!confirm("Delete "+n.id+" from the draft?"))return;
    D.nodes=D.nodes.filter(x=>x!==n);D.nodes.forEach(x=>x.prereqs=(x.prereqs||[]).filter(p=>p!==n.id));
    D.empty_slots=[...new Set([...(D.empty_slots||[]),n.id])];sel=null;setDirty(true);drawAll();};
}
function drawAll(){
  document.querySelectorAll("#btabs button").forEach(b=>b.classList.toggle("on",b.dataset.b===branch));
  branch==="all"?drawStats():drawTree();drawSide();
}
$("add").onclick=()=>{
  const m=branch==="all"?"mil":branch,id=prompt("New node id (e.g. MIL_10)");if(!id)return;
  if(byId()[id]){alert("Id exists");return;}
  D.nodes.push({id,market:m,kind:"skill",tier:1,prereqs:[],cost:1,effect:{type:"",target:m},extra:[],values:{},name:id,plain:"",flavour:"",origin:"draft"});
  D.empty_slots=(D.empty_slots||[]).filter(s=>s!==id);sel=id;branch=m;setDirty(true);drawAll();
};
$("reset").onclick=()=>{if(!confirm("Throw away all edits and go back to the consensus draft?"))return;D=clone(SEED);sel=null;setDirty(false);try{localStorage.removeItem(KEY);}catch(e){}drawAll();};
function payload(){return JSON.stringify(D,null,1)+"\n";}
$("save").onclick=async()=>{
  const text=payload();
  try{
    if(window.showSaveFilePicker){
      if(!handle)handle=await showSaveFilePicker({suggestedName:"skills-draft.json",types:[{description:"JSON",accept:{"application/json":[".json"]}}]});
      const w=await handle.createWritable();await w.write(text);await w.close();
      $("where").textContent="Saved draft: "+handle.name+" (not the game).";setDirty(false);lsSet();return;
    }
  }catch(e){if(e.name==="AbortError")return;handle=null;}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.download="skills-draft.json";a.click();
  setDirty(false);lsSet();$("where").textContent="Downloaded skills-draft.json (not the game).";
};
async function loadObj(o){if(!o||!o.nodes)throw new Error("not a skills draft");D=o;sel=null;setDirty(false);lsSet();drawAll();}
$("open").onclick=async()=>{
  try{
    if(window.showOpenFilePicker){[handle]=await showOpenFilePicker({types:[{description:"JSON",accept:{"application/json":[".json"]}}]});
      await loadObj(JSON.parse(await (await handle.getFile()).text()));$("where").textContent="Opened draft: "+handle.name;return;}
  }catch(e){if(e.name==="AbortError")return;handle=null;}
  $("pick").click();
};
$("pick").onchange=async()=>{const f=$("pick").files[0];if(!f)return;try{await loadObj(JSON.parse(await f.text()));}catch(e){alert(e.message);}$("pick").value="";};

/* ---------------- event texts: one free-text document per event ---------------- */
const EVSEED=JSON.parse($("evseed").textContent);
const EVKEY="starBazaarEventsDraft3";
const EVBY=Object.fromEntries(EVSEED.entries.map(x=>[x.id,x]));
const EVGROUPS={};EVSEED.entries.forEach(x=>{(EVGROUPS[x.group]=EVGROUPS[x.group]||[]).push(x);});
const isMain=(g,x)=>x.id===g+"_TITLE"||x.id.startsWith(g+"_BODY");
const mainOf=g=>EVGROUPS[g].filter(x=>isMain(g,x));
const labelOf=(g,x)=>x.id===g+"_TITLE"?"Title":("Body"+x.id.slice((g+"_BODY").length).replace("_"," ").replace(/^ /," "));
let E={groups:{}},evSel=null,evDirty=false,evHandle=null,evAll=false;
try{const o=JSON.parse(localStorage.getItem(EVKEY)||"null");if(o&&o.groups)E=o;}catch(e){}
const evText=(g,x)=>{const t=E.groups[g]&&E.groups[g].texts&&E.groups[g].texts[x.id];return t===undefined?x.text:t;};
const evNotes=g=>(E.groups[g]&&E.groups[g].notes)||"";
const evChanged=g=>EVGROUPS[g].filter(x=>evText(g,x)!==x.text);
const evEdited=g=>evChanged(g).length>0||!!evNotes(g).trim();
function evStore(g,texts,notes){
  const cur=E.groups[g]||{texts:{},notes:""};
  if(texts)Object.entries(texts).forEach(([id,v])=>{if(v===EVBY[id].text)delete cur.texts[id];else cur.texts[id]=v;});
  if(notes!==undefined)cur.notes=notes;
  E.groups[g]=cur;if(!evEdited(g))delete E.groups[g];evSetDirty(true);
}
function evSetDirty(v){evDirty=v;$("evdirty").textContent=v?"Unsaved":"";if(v){try{localStorage.setItem(EVKEY,JSON.stringify(E));}catch(e){}srvQueue("events-draft",evPayload,"evwhere");}}
function evDoc(g){
  if(!evAll)return mainOf(g).map(x=>`${labelOf(g,x)} (max ${x.max}):\n${evText(g,x)}`).join("\n\n");
  return EVGROUPS[g].map(x=>`[[${x.id}]] ${x.place||""} (max ${x.max})\n${evText(g,x)}`).join("\n\n");
}
function evParse(g,doc){ /* -> {id:text} */
  const out={};
  if(evAll){const p=doc.split(/^\[\[([A-Za-z0-9_]+)\]\].*$/m);for(let i=1;i<p.length;i+=2)if(EVBY[p[i]])out[p[i]]=(p[i+1]||"").trim();return out;}
  const byLabel=Object.fromEntries(mainOf(g).map(x=>[labelOf(g,x),x.id]));
  const p=doc.split(/^(Title|Body(?: [AB])?) \(max \d+\):[ \t]*$/m);
  for(let i=1;i<p.length;i+=2)if(byLabel[p[i]])out[byLabel[p[i]]]=(p[i+1]||"").trim();
  return out;
}
function evOver(g,texts){return Object.entries(texts).filter(([id,v])=>EVBY[id].max&&v.length>EVBY[id].max).map(([id,v])=>(evAll?id:labelOf(g,EVBY[id]))+" "+v.length+"/"+EVBY[id].max);}
function evList(){
  const q=$("evq").value.toLowerCase(),only=$("evonly").checked;
  return Object.keys(EVGROUPS).filter(g=>{
    if(!evAll&&!mainOf(g).length)return false;
    if(only&&!evEdited(g))return false;
    if(q&&!(g+" "+EVGROUPS[g].map(x=>evText(g,x)).join(" ")).toLowerCase().includes(q))return false;return true;});
}
function evDraw(){
  evAll=$("evview").value==="all";
  const keys=evList();
  $("evlist").innerHTML=keys.map(k=>{const m=mainOf(k)[0]||EVGROUPS[k][0];return `<div data-g="${esc(k)}" style="padding:5px 8px;border-radius:6px;cursor:pointer;${evSel===k?"background:var(--card);border:1px solid var(--acc)":"border:1px solid transparent"}">
    <b>${esc(k)}</b>${evEdited(k)?' <span class="chip warn">edited</span>':""}<div style="color:var(--mute);font-size:12px">${esc(evText(k,m).slice(0,44))}</div></div>`;}).join("")||'<p class="empty-slot">No match.</p>';
  $("evlist").querySelectorAll("[data-g]").forEach(d=>d.onclick=()=>{evSel=d.dataset.g;evDraw();});
  if(!evSel||!EVGROUPS[evSel]){$("evmain").innerHTML='<p style="color:var(--mute)">Pick an event on the left. In "Main text" view you see only the title and the body, the text the player reads, as plain writing. Edit it freely and add instructions in the notes box; an agent then adapts it to the game. "All lines" shows every text of the event (buttons, effect lines, results) with its text id.</p>';return;}
  const g=evSel,h=EVGROUPS[g][0];
  $("evmain").innerHTML=`<h3 style="margin-top:0">${esc(g)} ${h.tag?`<span class="chip">${esc(h.tag)}</span>`:""}${h.kind?`<span class="chip">kind ${esc(h.kind)}</span>`:""}<button id="evrevert" style="float:right">Revert this event</button></h3>
   <textarea id="evdoc" style="width:100%;min-height:${evAll?58:30}vh;resize:vertical;line-height:1.55;padding:10px;font-size:15px" spellcheck="true">${esc(evDoc(g))}</textarea>
   <div id="evover" style="font-size:12px;min-height:18px"></div>
   <label>Notes for the agent (what you want changed, tone, ideas)</label>
   <textarea id="evnotes" style="width:100%;min-height:80px">${esc(evNotes(g))}</textarea>`;
  const over=()=>{const o=evOver(g,evParse(g,$("evdoc").value));$("evover").innerHTML=o.length?'<span class="bad">Over the length limit: '+esc(o.join(", "))+'</span> <span style="color:var(--mute)">(the agent will shorten it if you leave it)</span>':'<span class="ok">Within the length limits.</span>';};
  over();
  $("evdoc").oninput=()=>{evStore(g,evParse(g,$("evdoc").value),undefined);over();};
  $("evnotes").oninput=()=>evStore(g,undefined,$("evnotes").value);
  $("evrevert").onclick=()=>{if(!confirm("Revert "+g+" to the game's current text and clear its notes?"))return;delete E.groups[g];evSetDirty(true);evDraw();};
}
["evq","evonly","evview"].forEach(i=>$(i).addEventListener("input",evDraw));
function evPayload(){
  const groups=Object.keys(E.groups).filter(evEdited).map(g=>({group:g,title:(EVBY[g+"_TITLE"]||{}).text||"",notes:evNotes(g),
    lines:evChanged(g).map(x=>({id:x.id,place:x.place,max:x.max,original:x.text,text:evText(g,x)}))}));
  return JSON.stringify({_note:"DRAFT event text edits from the owner (English only; localisation is ignored until the owner asks for a translation). For each group: 'lines' are the text ids the owner rewrote ('original' is the current game text, 'text' is the owner's version, 'max' is the length limit) and 'notes' are instructions for the whole event. Adapt them to the game: keep mechanics and placeholders like {bot1}, {cash_out}, respect max, write the result into story/*.md (never edit the generated data/story_text.json or data/events.json), then run python3 tools/build_story.py.",groups},null,1)+"\n";
}
async function evSave(){
  const text=evPayload();
  try{
    if(window.showSaveFilePicker){
      if(!evHandle)evHandle=await showSaveFilePicker({suggestedName:"events-draft.json",types:[{description:"JSON",accept:{"application/json":[".json"]}}]});
      const w=await evHandle.createWritable();await w.write(text);await w.close();$("evwhere").textContent="Saved "+evHandle.name+" (not the game).";evSetDirty(false);return;
    }
  }catch(e){if(e.name==="AbortError")return;evHandle=null;}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.download="events-draft.json";a.click();
  evSetDirty(false);$("evwhere").textContent="Downloaded events-draft.json (not the game).";
}
$("evsave").onclick=evSave;
$("evreset").onclick=()=>{if(!confirm("Throw away all event edits and notes?"))return;E={groups:{}};evSetDirty(false);try{localStorage.removeItem(EVKEY);}catch(e){}evDraw();};
function evMerge(o){if(!o||!o.groups)throw new Error("not an events draft");
  o.groups.forEach(x=>{if(!EVGROUPS[x.group])return;const texts={};(x.lines||[]).forEach(l=>{if(EVBY[l.id])texts[l.id]=l.text;});E.groups[x.group]={texts,notes:x.notes||""};});}
$("evopen").onclick=async()=>{
  try{if(window.showOpenFilePicker){[evHandle]=await showOpenFilePicker({types:[{description:"JSON",accept:{"application/json":[".json"]}}]});
    evMerge(JSON.parse(await (await evHandle.getFile()).text()));evSetDirty(true);evDraw();return;}}catch(e){if(e.name==="AbortError")return;evHandle=null;}
  $("evpick").click();};
$("evpick").onchange=async()=>{const f=$("evpick").files[0];if(!f)return;try{evMerge(JSON.parse(await f.text()));evSetDirty(true);evDraw();}catch(e){alert(e.message);}$("evpick").value="";};

if(location.protocol.startsWith("http"))fetch("/ping").then(r=>r.ok?r.json():null).then(async j=>{
  if(!j||!j.studio)return;SRV=true;
  try{const r=await fetch("/draft/skills-draft");if(r.ok){const o=await r.json();if(o&&o.nodes){D=o;sel=null;dirty=false;$("dirty").textContent="";drawAll();}}}catch(e){}
  try{const r=await fetch("/draft/events-draft");if(r.ok){const o=await r.json();if(o&&o.groups){E={groups:{}};evMerge(o);evDraw();}}}catch(e){}
  $("where").textContent="Autosave on: design/drafts/skills-draft.json (not the game).";
  $("evwhere").textContent="Autosave on: design/drafts/events-draft.json (not the game).";
}).catch(()=>{});

window.addEventListener("beforeunload",e=>{if(dirty||evDirty){e.preventDefault();e.returnValue="";}});
drawAll();
{const h=(location.hash||'').slice(1);const b=document.querySelector('nav .tab[data-p="'+h+'"]');if(b)b.click();const q=new URLSearchParams(location.search);if(q.get('b')){branch=q.get('b');drawAll();}}
</script>
</body>
