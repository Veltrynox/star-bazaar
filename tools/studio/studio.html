 not start.\", \"brief\": \"Owner request: think about every skill with the QA agent and the economy agent: is it really worth it. Run by the OWNER by hand after the skill build (never started, scheduled or waited on by the main session or the overnight runner; no other task depends on it). economy-designer checks each new and changed skill's cost and effect against the market goal and the 20-ship cap; qa-analyst runs the bots over the skills and reports dominant, useless or trap skills; both write what to cut, merge or retune. Reports in qa/reports/ and handoffs/economy-designer/ and handoffs/qa-analyst/.\"}, {\"task_id\": \"T210\", \"title\": \"5 more placeholder solar systems (ids after the current placeholders)\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 25, \"window\": \"Owner request 2026-11-05 (playtest). Not started: main session sets it running.\", \"brief\": \"Owner: add 5 more temporary placeholder galaxies for the future. Read as: 5 more placeholder solar systems, after the placeholders from T176 (systems 3-5 in data/systems_placeholder.json, enabled false). Same shape, next free ids, off by default, no gameplay, shown in the galaxy overview only when enabled; check game/map.gd view_system and the galaxy overview so 10 systems do not break the view or the permit and discovery keys. Owner confirmed: they are solar systems, not a higher level. Handoff handoffs/<agent>/2026-11-05-<id>.json.\", \"note\": \"Placeholder systems 6-10 added (off by default), galaxy SLOTS grown to 10, tests; slots 8-10 positions temporary. Handoff handoffs/gameplay-programmer/2026-11-06-T210.json\"}, {\"task_id\": \"T211\", \"title\": \"Solar system 2: player and rival ships appear only after the system is opened; one ship each for the whole game\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 35, \"window\": \"Owner request 2026-11-05 (playtest). Not started: main session sets it running.\", \"brief\": \"Owner: in solar system 2 (and later systems) the player's ship and the rival ships should be there only if the player opened the system with a permit. The player has ONE pathfinder ship for the whole game and each rival has ONE ship for the whole game; it looks like there are many in each system now (game/rival_ships.gd spawns rivals per system, game/pathfinder.gd). Make rival ships exist once per competitor (not once per system): a rival ship is shown in system 2 only while it is flying there, and only systems the player has opened by permit show any ship traffic; the Pathfinder is one ship that changes system when it jumps. Keep saves working (bump the save version if needed). Test: ship counts are 1 per owner in every state; no ships in a closed system. Update gdd.md. Handoff handoffs/<agent>/2026-11-05-<id>.json.\", \"note\": \"One rival ship per competitor (3), home system 1, visits opened systems only; closed systems show none; Pathfinder already single; rival_ship_count key retired. Test _test_t211_ship_traffic.\"}, {\"task_id\": \"T212\", \"title\": \"Storage link consumes energy only, about 5 per cycle (temporary value)\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 15, \"window\": \"Owner request 2026-11-05 (playtest). Not started: main session sets it running.\", \"brief\": \"Owner: the storage link should consume only energy and not much, about 5 per cycle as a TEMPORARY value. Find the storage link upkeep (game/ storage link code and data/balance.json keys; see T171) and set it to energy only, 5 per cycle, as a named balance key with a data_version bump (placeholder; the owner or economy designer retunes it later). Show it correctly on the link row and in forecasts. Update gdd.md and tests that assert the old cost. Handoff handoffs/<agent>/2026-11-05-<id>.json.\", \"note\": \"link_upkeep_energy 20 -> 5 (energy only already), data_version 59, gdd.md line updated. Temporary value; owner/economy designer retunes.\"}, {\"task_id\": \"T213\", \"title\": \"Investigate and fix: 'Not enough cash' with 2k balance on a storage route\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 30, \"window\": \"Owner request 2026-11-05 (playtest). Not started: main session sets it running.\", \"brief\": \"Owner screenshot (2026-11-05): Cindrel planet panel, Connections: two 'To Space Storage' routes (energy, Logic Cores), each 'Ship 1 of 1', the Logic Cores route says 'Not enough cash.' (route -55) while the owner's balance is about 2k; a map note also says 'Not enough cash.' next to -253. Owner asks: does the check count the current cycle's income? Find where the state 'Not enough cash.' is set (game/route_engine.gd lines near 416, 868 and 1151, cash reserve and trip cost logic) and explain in the handoff exactly what is compared with what (cash, reserve, fixed cost, stock to buy, cycle income). If the message is wrong or misleading at 2k cash, fix the rule or the text (say what is missing: how much cash is needed, the reserve), and show the needed amount in the row. Add a test for the case (cash 2000, storage route with a cost under it is not reported as not enough cash). Story text through ids and build_story.py. Handoff handoffs/<agent>/2026-11-05-<id>.json.\", \"note\": \"Rule correct at 2k; text was stale last-cycle snapshot. Row/map text now shows needed and had amounts (ST_NO_CASH_ROUTE/BUY), test _test_no_cash_text.\"}, {\"task_id\": \"T214\", \"title\": \"Rival ships idle when they finish a trip instead of moving at random\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [\"T211\"], \"status\": \"done\", \"turn_cap\": 15, \"window\": \"Owner request 2026-11-05 (playtest). Not started: main session sets it running.\", \"brief\": \"Owner: rival ships do not need to move randomly: when a rival ship has reached its destination it idles (stays, no new random course); it moves again only when the game gives it a reason (the competitor opens or trades in another system, an event). Update game/rival_ships.gd, the tests for rival motion and gdd.md. Handoff handoffs/<agent>/2026-11-05-<id>.json.\", \"note\": \"Rival ships park on arrival (no new course); rival_ships.wake() on a newly opened system or an event popup starts one new leg. Tests and gdd line updated. Balance key rival_ship_wait_s now unused.\"}, {\"task_id\": \"T215\", \"title\": \"Remove the route hint UI from the bottom\", \"owner_agent\": \"ui-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 15, \"window\": \"Owner request 2026-11-05 (playtest). Not started: main session sets it running.\", \"brief\": \"Owner: remove the route hint UI shown at the bottom of the screen (the route hint strip; look in game/dest_hint.gd, game/planet_hint.gd, game/route_warning.gd and game/main.gd for the one at the bottom, and tell in the handoff which one it was). Remove its drawing, state and any text ids it alone uses; keep other hints (hover cards, route warnings in the panels) and the Availability rule. Update tests that look for it. Handoff handoffs/<agent>/2026-11-05-<id>.json.\", \"note\": \"Removed bottom-middle route legend strip (game/route_legend.gd) and LBL_LEGEND_SILK/CHIPS/ORE. Pending banner kept; owner to say if the banner was meant.\"}, {\"task_id\": \"T216\", \"title\": \"Gigs: design random side jobs for the 3D ship with a storyline\", \"owner_agent\": \"feature-designer\", \"depends_on\": [], \"status\": \"queued\", \"turn_cap\": 35, \"window\": \"Owner request 2026-11-05 (playtest). Not started: main session sets it running.\", \"brief\": \"Owner idea: random gigs the player does with the 3D ship, each with a story. Example: a ship crash the player flies to and gets something, unique for each branch and depending on the player's progression (market focus, skills, chain direction, cycle, systems opened). Design: how a gig appears (spawn rule, how often, a marker ht-click menu action from T200), arrival handling, branch-dependent rewards, save state, texts by id (no new literal text), ui-programmer for any panel or popup. A headless test for spawn, arrival and reward per branch. Update gdd.md.\"}, {\"task_id\": \"T219\", \"title\": \"Juice: route lines pop in when a route is made and pulse when a ship dispatches\", \"owner_agent\": \"juice-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 20, \"window\": \"Follow-up from T203 (juice review 2026-11-05). One small run.\", \"brief\": \"game/route_line.gd draws lanes with no entry or feedback: a new route simply appears, a removed one vanishes, and a ship dispatch has no cue on the lane. Add a short draw-in (alpha and width grow from the source end, about 0.25 s, EASE_OUT), a quick fade on removal, and one brief brightening pulse along the lane when a ship is sent. Why it matters: making a route is the core action and today the only confirmation is the two planet rings (_route_beat); the lane itself should answer. Nothing animates while paused, no text, no logic change, tunables as constants, one headless test for the pure curve.\", \"note\": \"Draw-in 0.25s, removal fade 0.15s, dispatch pulse 0.5s in route_line.gd; map.gd hooks; test added. Not seen windowed.\"}, {\"task_id\": \"T220\", \"title\": \"Juice: Pathfinder arrival and flight-order feedback (departure puff, dock ping, target marker pulse)\", \"owner_agent\": \"juice-programmer\", \"depends_on\": [], \"status\": \"queued\", \"turn_cap\": 20, \"window\": \"Follow-up from T203 (juice review 2026-11-05). One small run.\", \"brief\": \"game/pathfinder_view.gd gives no beat when the ship is ordered, leaves, or arrives: the target ring just appears and the arrival only posts a notice (_on_flight_arrived in game/main.gd). Add: a soft pulse on the target marker ring while the ship flies (slow, small), a short ping on the planet at arrival using the same ring helper as the T203 establish beat (play_established or a lighter variant), and a quick pop of the selection ring when the ship is selected or an order is accepted. Why it matters: the Pathfinder is the main thing the player steers in the new discovery mode and it is the quietest object on the map. Game time only (frozen while paused), no per-frame allocation, no logic change, tunables as constants.\"}, {\"task_id\": \"T221\", \"title\": \"Juice: ship trails and rival ships rough edges, plus notice board entry and exit\", \"owner_agent\": \"juice-programmer\", \"depends_on\": [], \"status\": \"queued\", \"turn_cap\": 20, \"window\": \"Follow-up from T203 (juice review 2026-11-05). One small run.\", \"brief\": \"Review and smooth the rough parts left after T198/T205: (1) game/ship_trail.gd: check the trail on stop, on a system change and on a sharp turn (no jump or long straight streak, clears cleanly, rival trails do not keep drawing while paused or in another system); (2) the notification board and pop-up notices (game/main.gd post_notice and its scripts): confirm each enters in under 0.3 s with the Juice.enter vocabulary, leaves with Juice.leave, and that a notice dismissed or replaced mid-animation ends in its final state; do not shorten hold times. Why it matters: trails and notices are on screen all the time, so any pop, streak or stuck half-faded notice is seen constantly. Fix only what is found, list what was fine, no text or logic changes, tests where headless-testable.\"}, {\"task_id\": \"T222\", \"title\": \"Bug: Space on 'Start exploring' also presses 'Stop exploring'\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [], \"status\": \"queued\", \"turn_cap\": 15, \"window\": \"Owner request 2026-11-05 (playtest). Not started: main session sets it running.\", \"brief\": \"Owner: after clicking the Start exploring button, pressing Space (pause/resume time) also activates the focused button, which flips it to Stop exploring. Fix: the exploration button (and other buttons near the ship controls) must not keep keyboard focus after a click (focus_mode NONE or release_focus), and Space must only toggle pause. Check every other button that can take focus and swallow Space or Enter. Headless test if feasible. Handoff handoffs/gameplay-programmer/2026-11-05-T222.json.\"}, {\"task_id\": \"T223\", \"title\": \"3D viewport: resource icons below each planet\", \"owner_agent\": \"ui-programmer\", \"depends_on\": [], \"status\": \"queued\", \"turn_cap\": 25, \"window\": \"Owner request 2026-11-05 (playtest). Not started: main session sets it running.\", \"brief\": \"Owner: under each planet in the 3D solar system view show small icons of the resources available on that planet (icons from art/icons and ui.gd, the same set the galaxy view uses). Use the Availability rule: closed or undiscovered planets and hidden goods are not drawn. Icons must follow the planet size and zoom, stay readable, not overlap the planet label, and not block clicks. Handoff handoffs/ui-programmer/2026-11-05-T223.json.\"}, {\"task_id\": \"T224\", \"title\": \"Story: 10 new connected generic stories, not tied to skill branches\", \"owner_agent\": \"story-designer\", \"depends_on\": [], \"status\": \"queued\", \"turn_cap\": 40, \"window\": \"Owner request 2026-11-05 (playtest). Not started: main session sets it running.\", \"brief\": \"Owner: write 10 new connected generic stories (one chain with a thread running through them, in the voice of story/voice.md) that are NOT related to the skill branches. Check how events, gigs (T217) and gated options are stored (story/events.md, story/ideas.md, header of tools/build_story.py) and write them in that format, English first, then Russian in story/ru. Mechanics only as text ids and a short list of the trigger and effect each story needs, no balance numbers; if a story needs new code, list it in the handoff for the gameplay-programmer. Do not run audio. Run python3 tools/build_story.py. Handoff handoffs/story-designer/2026-11-05-T224.json.\"}, {\"task_id\": \"T225\", \"title\": \"Skill tree: connection lines pass through skill nodes\", \"owner_agent\": \"ui-programmer\", \"depends_on\": [], \"status\": \"queued\", \"turn_cap\": 20, \"window\": \"Owner request 2026-11-05 (playtest). Not started: main session sets it running.\", \"brief\": \"Owner screenshot: in the skill screen a connector line runs straight through a node (seen on the Price Whisper node: a vertical line crosses the node box). Route the lines so they stop at node edges or go behind opaque nodes (draw order and node background), for every branch and every node pair, including the new skills from T208. Check all three branches by looking at the layout code and a windowed screenshot via qa/run_game.sh if needed. Handoff handoffs/ui-programmer/2026-11-05-T225.json.\"}, {\"task_id\": \"T226\", \"title\": \"Make the 3 temporary placeholder solar systems really present\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 40, \"window\": \"Owner request 2026-11-05 (playtest). Not started: main session sets it running.\", \"brief\": \"Owner (asked before, T176 was marked done but the owner sees nothing): T176 put systems 3-5 in data/systems_placeholder.json but off by default with availability rules that are never true, so they cannot be seen. Make three temporary placeholder systems actually appear in the galaxy overview and be enterable (hidden until system 2 is open is fine, but they must show up in a normal game without debug flags, with a visible TEMPORARY or placeholder look in the name text), each with a sun, a few planets with placeholder names and prices, and working discovery and flight. Keep placeholder:true so story and economy can replace them later. Update the Availability rule and test (sh tools/tests/run.sh) and add a test that all 3 placeholder systems are listed and enterable. Also close T192 by this decision: 3 placeholder systems. Handoff handoffs/gameplay-programmer/2026-11-05-T226.json.\", \"owner_note\": \"Owner frustrated: asked for this already.\", \"note\": \"Systems 3 to 5 now live in a normal game (on:true in data/systems_placeholder.json, names TEMPORARY A/B/C, placeholder:true); 6 to 10 stay off. Availability: feature rules 3 to 5 now always true, planet discovery rules added for s3_p1..s5_p3. Arrow ignores placeholder systems. Tests updated and added; suite passes.\"}, {\"task_id\": \"T227\", \"title\": \"Space Storage: delivered resources accumulate there (where does energy go?)\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [], \"status\": \"done\", \"note\": \"Delivery already accumulated (route test passes); the gap was that the Next cycle line hid link upkeep. Added upkeep drain to the projection, a stock-rule line in the panel (SS_LBL_STOCK_RULE), T227 tests.\", \"turn_cap\": 30, \"window\": \"Owner request 2026-11-05 (playtest). Not started: main session sets it running.\", \"brief\": \"Owner question: where does the energy go on a Space Storage? Expected rule: any resource brought to a Space Storage (by ship route, mining platform, planet transfer) just accumulates in that storage stock and stays there until used by a sell order, a recipe or the storage upkeep. Trace how energy and other raws are handled in game/space_storage*.gd, game/storage_link.gd and the route delivery code: find where energy is consumed, discarded or converted (for example upkeep burning it, or a cap) and fix it so deliveries accumulate. Show the stock in the storage panel. If upkeep or a cap is intended, state it in the panel text as a story id and tell the owner in the handoff what the rule is. Headless test: deliver energy to storage over several cycles, stock rises by the delivered amount minus only declared upkeep. Handoff handoffs/gameplay-programmer/2026-11-05-T227.json.\", \"owner_note\": \"Owner frustrated: asked before.\"}, {\"task_id\": \"T228\", \"title\": \"Exploration can be stopped while the game is paused\", \"owner_agent\": \"gamepla re is not recorded.\", \"- Reports: qa/reports/2026-11-03-endings-qa.md and bug_report.json.\", \"- Handoffs: handoffs/*/2026-11-03-{bad-endings-tutorial,bot-endings,bot-strength,endings-retune,endings-retune-r2,endings-qa,gdd-market-goal,competitors-log,retire-minerals-events}.json\"], \"log\": [\"1. Main session committed chain wiring, added Competitors Recent moves log (ui-programmer), retired EV29-37 (gameplay-programmer).\", \"2. story-designer wrote the four BAD endings and the market-goal preface and tutorial text.\", \"3. gameplay-programmer extended the QA bot, then strengthened it (lane ranking, ships, crafting, lux).\", \"4. economy-designer retuned twice (data v39, v40); focused bot wins about 85 percent, spread 0.\", \"5. General-purpose agent (no doc-manager exists) updated GDD, skills doc, log and state.\", \"6. qa-analyst ran 160 headless runs and wrote the report; retune round 3 stopped at the owner's request (tune later).\"]}, {\"goal_slug\": \"ship-ceo-skills-resources\", \"goal\": \"Ship-select screen with 3D preview; CEO bios EN/RU with stats and perks; skills redone with economy/feature/QA agreement; solid resource and crafting logic\", \"started\": \"2026-11-05\", \"finished\": \"2026-11-05\", \"report\": [\"Goal: ship-select screen with 3D preview, CEO bios EN/RU with stats and perks, skill tree redone with agent sign-off, resource and crafting audit.\", \"Result: done. 4 ships and 4 CEOs chosen on two new-game screens; 31 skills reviewed by economy, feature and QA agents; rivets and musk now have recipes; Luxury and alloy unlock order fixed; tests 1866 pass.\", \"Changed: new game/ceos.gd, game/ship_setup.gd, data/ceos.json, ships.json; skills.json, balance.json (v49), goods.json, availability.json; skill, ship and CEO texts EN/RU; softlock fix (dead-end bankruptcy).\", \"Open: LUX_6 uses batch yield, not saturation (no saturation rule in the build); pirate effects have no source (EV19 text); RU layout and ship preview size unchecked by eye; const SRC_FLOW="<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Star Bazaar workflow<\/title>\n<style>\n  :root {\n    --bg: #f6f6f3; --fg: #1d1f24; --muted: #5d6270; --line: #8b909c;\n    --rule: #fff1d1; --rule-b: #c9922a;\n    --person: #dce9ff; --person-b: #3b6fc4;\n    --agent: #dcf3e2; --agent-b: #2f9150;\n    --file: #ececea; --file-b: #8b8f98;\n    --gen: #ece1fa; --gen-b: #7a4fc0;\n    --group: #fafaf8;\n  }\n  @media (prefers-color-scheme: dark) {\n    :root {\n      --bg: #14161a; --fg: #e8e9ec; --muted: #9aa0ad; --line: #6c7280;\n      --rule: #3a2f16; --rule-b: #d9a441;\n      --person: #1c2c47; --person-b: #6c9eef;\n      --agent: #17342358; --agent-b: #52c27a;\n      --file: #23262c; --file-b: #7c818c;\n      --gen: #2c2140; --gen-b: #a384e6;\n      --group: #181b20;\n    }\n  }\n  html, body { margin: 0; background: var(--bg); color: var(--fg);\n    font: 14px/1.4 -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif; }\n  main { max-width: 1120px; margin: 0 auto; padding: 20px 16px 40px; }\n  h1 { font-size: 20px; margin: 0 0 4px; }\n  p.lead { margin: 0 0 14px; color: var(--muted); }\n  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 0 0 12px; font-size: 12px; color: var(--muted); }\n  .legend span { display: inline-flex; align-items: center; gap: 6px; }\n  .legend i { width: 14px; height: 14px; border-radius: 3px; border: 1.5px solid; display: inline-block; }\n  .legend i.dash { border: 0; border-top: 2px dashed var(--line); height: 0; width: 22px; border-radius: 0; }\n  .wrap { overflow-x: auto; border: 1px solid var(--file-b); border-radius: 8px; background: var(--group); }\n  svg { display: block; min-width: 1000px; width: 100%; height: auto; }\n  .node rect { stroke-width: 1.5; }\n  .node text { fill: var(--fg); font-size: 12.5px; }\n  .node .t { font-weight: 600; }\n  .node .s { fill: var(--muted); font-size: 11px; }\n  .node { cursor: default; }\n  .edge path { fill: none; stroke: var(--line); stroke-width: 1.6; }\n  .edge.dash path { stroke-dasharray: 6 4; }\n  .edge text { fill: var(--muted); font-size: 11px; paint-order: stroke; stroke: var(--group); stroke-width: 4px; }\n  .dim { opacity: .13; }\n  .hl path { stroke: var(--fg); stroke-width: 2.4; }\n  .notes { margin-top: 14px; display: grid; gap: 8px; font-size: 13px; color: var(--muted); }\n  .notes b { color: var(--fg); }\n<\/style>\n<\/head>\n<body>\n<main>\n  <h1>Star Bazaar: how the work flows<\/h1>\n  <p class=\"lead\">Agents keep no memory between sessions, so everything passes through files. Hover a box to see what it connects to.<\/p>\n  <div class=\"legend\">\n    <span><i style=\"background:var(--rule);border-color:var(--rule-b)\"><\/i>Rules<\/span>\n    <span><i style=\"background:var(--person);border-color:var(--person-b)\"><\/i>People and main session<\/span>\n    <span><i style=\"background:var(--agent);border-color:var(--agent-b)\"><\/i>Role agents<\/span>\n    <span><i style=\"background:var(--file);border-color:var(--file-b)\"><\/i>Files and logs<\/span>\n    <span><i style=\"background:var(--gen);border-color:var(--gen-b)\"><\/i>Generated, never edit by hand<\/span>\n    <span><i class=\"dash\"><\/i>Owner starts by hand only<\/span>\n  <\/div>\n  <div class=\"wrap\"><svg id=\"g\" viewBox=\"0 0 1100 720\" role=\"img\" aria-label=\"Project workflow graph\"><\/svg><\/div>\n  <div class=\"notes\">\n    <div><b>Loop:<\/b> the owner decides, the main session briefs an agent, the agent changes files and writes a handoff, the main session reads the handoff and commits.<\/div>\n    <div><b>Hard rule:<\/b> economy-designer and qa-analyst (and bots, <code>tools/sim.py<\/code>, retunes, sign-offs) run only when the owner asks. <code>sh tools/tests/run.sh<\/code> is always allowed and is not QA.<\/div>\n    <div><b>Commit gates:<\/b> one hook (<code>tools/gdd_sync.py<\/code>) runs three checks on every <code>git commit<\/code>, in this order. A failed check blocks the commit and tells the agent what to fix.<\/div>\n    <div><b>1. GDD sync:<\/b> <code>game/<\/code>, <code>data/<\/code> or <code>story/<\/code> changed without <code>gdd.md<\/code>. Fix: start doc-manager to update the GDD from the diff, stage it, commit again. No design effect: put <code>[no-gdd]<\/code> in the commit command.<\/div>\n    <div><b>2. Blackboard:<\/b> <code>tools/blackboard.py<\/code> moves run entries older than the last 4 from <code>blackboard.md<\/code> to <code>black_board.archive.md<\/code> and stages both (a script, never the agent; the notes are kept). A <code>blackboard.md<\/code> with a bad structure (title, \"Do not repeat\", \"Left to do\", run heading, the eight fields in order) blocks the commit.<\/div>\n    <div><b>3. Tests:<\/b> a commit that changes <code>game/<\/code>, <code>data/<\/code>, <code>story/<\/code> or <code>tools/tests/<\/code> runs <code>sh tools/tests/run.sh<\/code> and is blocked on any FAIL. No code effect: put <code>[no-tests]<\/code> in the commit command.<\/div>\n\n  <\/div>\n<\/main>\n<script>\nconst NS = 'http://www.w3.org/2000/svg';\nconst svg = document.getElementById('g');\nsvg.innerHTML = '<defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--line)\"/><\/marker><\/defs>';\n\nconst kinds = {\n  rule:   ['--rule', '--rule-b'],\n  person: ['--person', '--person-b'],\n  agent:  ['--agent', '--agent-b'],\n  file:   ['--file', '--file-b'],\n  gen:    ['--gen', '--gen-b'],\n};\n\n// id: [kind, x, y, w, h, title, subtitle]\nconst N = {\n  claude:  ['rule', 20, 250, 210, 62, 'CLAUDE.md', 'hard rules for every session'],\n  briefs:  ['rule', 20, 380, 210, 62, '.claude/agents/*.md', 'one brief per role'],\n  git:     ['rule', 20, 520, 210, 96, 'git commit', 'hook runs three checks first (tools/gdd_sync.py)'],\n  gates:   ['rule', 20, 630, 210, 84, 'commit checks', '1 GDD sync, 2 blackboard structure + archive, 3 tests. [no-gdd] and [no-tests] skip 1 and 3'],\n\n  tests:   ['rule', 20, 140, 210, 76, 'tools/tests/run.sh', 'always allowed: build_story, then headless Godot tests. Not QA'],\n  sim:     ['file', 20, 30, 210, 90, 'tools/sim.py  \u2605', 'paper cash-curve sim, owner by hand only. Reads data/*.json, never runs run.sh'],\n\n  owner:   ['person', 270, 60, 210, 76, 'Owner', 'decides everything, plays builds, approves proposals'],\n  main:    ['person', 270, 250, 210, 92, 'Main session (Claude)', 'briefs agents, reads handoffs, commits'],\n\n  group:   ['group', 520, 24, 230, 594, '', ''],\n  a1: ['agent', 530, 52, 210, 58, 'gameplay + ui programmer', 'GDScript, panels, screens'],\n  a2: ['agent', 530, 128, 210, 58, 'economy-designer  \u2605', 'every number in the game'],\n  a3: ['agent', 530, 204, 210, 58, 'story-designer', 'story, voice, skill names'],\n  a4: ['agent', 530, 280, 210, 58, 'feature-designer', 'proposes, owner decides'],\n  a5: ['agent', 530, 356, 210, 58, 'qa-analyst  \u2605', 'bot runs, bug reports'],\n  a6: ['agent', 530, 432, 210, 58, 'fx / galaxy / juice', 'shaders, background, tweens'],\n  a7: ['agent', 530, 508, 210, 58, 'general-purpose (docs)', 'updates the GDD from the diff'],\n\n  f1:  ['file', 800, 30,  270, 50, 'game/*.gd, *.tscn', 'the game code'],\n  f2:  ['file', 800, 92,  270, 50, 'data/*.json', 'balance, goods, skills, planets (data wins)'],\n  f3:  ['file', 800, 154, 270, 50, 'story/*.md, story/ru/*.json', 'text source'],\n  f4:  ['gen',  800, 216, 270, 50, 'story_text*.json, events.json', 'built by tools/build_story.py'],\n  f5:  ['file', 800, 278, 270, 50, 'design/proposals/*.md', 'dated proposals, waiting for owner'],\n  f6:  ['file', 800, 340, 270, 50, 'qa/reports/*', 'bug_report.json, runs.jsonl, screenshots'],\n  f7:  ['file', 800, 402, 270, 50, 'gdd.md, gdd-skills.md', 'design truth, short form, no balance numbers'],\n  f8:  ['file', 800, 464, 270, 50, 'schedule.json, state.md', 'task queue, status, goal log'],\n  f9:  ['file', 800, 526, 270, 62, 'handoffs/<agent>/<date>-<task>.json', 'fixed schema, the only memory between sessions'],\n};\n\nconst E = [\n  // from, side, to, side, label, dashed\n  ['owner','b','main','t','requests, approvals'],\n  ['owner','l','sim','r','', true],\n  ['tests','b','main','t','run before handoff'],\n  ['owner','r','a2','l','', true],\n  ['owner','r','a5','l','', true],\n  ['claude','r','main','l',''],\n  ['briefs','r','group','l','role brief'],\n  ['main','r','group','l','task + brief'],\n  ['main','b','git','r','commits'],\n  ['a1','r','f1','l',''],\n  ['a6','r','f1','l',''],\n  ['a2','r','f2','l',''],\n  ['a3','r','f3','l',''],\n  ['f3','b','f4','t','build'],\n  ['f4','l','a1','r','', false, 1],\n  ['a4','r','f5','l',''],\n  ['f5','t','owner','r','owner reads', false, 2],\n  ['a5','r','f6','l',''],\n  ['a7','r','f7','l',''],\n  ['group','r','f9','l','every agent ends with a handoff'],\n  ['git','b','gates','t',''],\n];\nconst EXTRA = [\n  // custom: handoffs back to main for verification, drawn under the diagram\n  ['f9','main','verify handoff'],\n];\n\nfunction el(tag, attrs, parent) {\n  const e = document.createElementNS(NS, tag);\n  for (const k in attrs) e.setAttribute(k, attrs[k]);\n  (parent || svg).appendChild(e);\n  return e;\n}\nfunction anchor(id, side) {\n  const [, x, y, w, h] = N[id];\n  return { l: [x, y + h / 2], r: [x + w, y + h / 2], t: [x + w / 2, y], b: [x + w / 2, y + h] }[side];\n}\n\nconst nodeEls = {}, edgeEls = [];\n\n// group box first\n{\n  const [, x, y, w, h] = N.group;\n  el('rect', { x, y, width: w, height: h, rx: 10, fill: 'none', stroke: 'var(--agent-b)', 'stroke-dasharray': '2 5', 'stroke-width': 1.5 });\n  const t = el('text', { x: x + 12, y: y - 6, fill: 'var(--agent-b)', 'font-size': 12, 'font-weight': 600 });\n  t.textContent = 'Role agents (\u2605 = owner starts by hand only)';\n  nodeEls.group = el('g', { class: 'node' });\n}\n\n// edges\nfunction addEdge(from, to, d, label, dashed, lx, ly) {\n  const g = el('g', { class: 'edge' + (dashed ? ' dash' : '') });\n  el('path', { d, 'marker-end': 'url(#ar)' }, g);\n  if (label) {\n    const t = el('text', { x: lx, y: ly, 'text-anchor': 'middle' }, g);\n    t.textContent = label;\n  }\n  edgeEls.push({ g, from, to });\n}\nfor (let [f, fs, t, ts, label, dashed, bend] of E) {\n  const [x1, y1] = anchor(f, fs), [x2, y2] = anchor(t, ts);\n  let d, lx = (x1 + x2) / 2, ly = (y1 + y2) / 2 - 5;\n  const horiz = (s) => s === 'l' || s === 'r';\n  if (horiz(fs) && horiz(ts)) {\n    const dx = Math.max(30, Math.abs(x2 - x1) / 2) * (fs === 'r' ? 1 : -1);\n    const dx2 = Math.max(30, Math.abs(x2 - x1) / 2) * (ts === 'l' ? -1 : 1);\n    d = `M${x1} ${y1} C${x1 + dx} ${y1} ${x2 + dx2} ${y2} ${x2} ${y2}`;\n  } else if (!horiz(fs) && !horiz(ts)) {\n    const k = Math.max(30, Math.abs(y2 - y1) / 2);\n    d = `M${x1} ${y1} C${x1} ${y1 + k * (fs === 'b' ? 1 : -1)} ${x2} ${y2 + k * (ts === 't' ? -1 : 1)} ${x2} ${y2}`;\n  } else if (!horiz(fs)) {\n    const k = Math.max(30, Math.abs(y2 - y1) / 2);\n    d = `M${x1} ${y1} C${x1} ${y1 + k * (fs === 'b' ? 1 : -1)} ${x2 + (ts === 'l' ? -60 : 60)} ${y2} ${x2} ${y2}`;\n  } else {\n    const k = Math.max(30, Math.abs(x2 - x1) / 2);\n    d = `M${x1} ${y1} C${x1 + k * (fs === 'r' ? 1 : -1)} ${y1} ${x2} ${y2 + (ts === 't' ? -60 : 60)} ${x2} ${y2}`;\n  }\n  // special routes\n  if (f === 'f4' && t === 'a1') {\n    // generated texts feed the game: go up the gap between files and agents\n    d = `M800 241 L775 241 L775 95 L742 81`; lx = 775; ly = 160;\n    label = '';\n  }\n  if (f === 'f5' && t === 'owner') {\n    d = `M935 278 C935 8 700 8 482 80`; lx = 700; ly = 6;\n  }\n  if (f === 'f3' && t === 'f4') { lx = 935 + 34; ly = 210; }\n  if (f === 'owner' && t === 'main') { lx = 375 + 44; ly = 196; }\n  if (f === 'main' && t === 'git') { d = 'M300 342 C300 420 250 540 232 568'; lx = 290; ly = 470; }\n  if (f === 'group' && t === 'f9') { lx = 775; ly = 553 + 14; label = 'handoff'; }\n  if (f === 'owner' && t === 'sim') { d = 'M270 90 C250 90 250 75 232 75'; lx = 250; ly = 84; label = ''; }\n  if (f === 'tests' && t === 'main') { d = 'M125 216 C125 240 200 250 290 250'; lx = 190; ly = 240; }\n  if (f === 'briefs') { lx = 380; ly = 404; }\n  if (f === 'main' && t === 'group') { lx = 500; ly = 280; label = 'task'; d = `M482 296 C505 296 505 296 518 296`; }\n  if (f === 'owner' && (t === 'a2' || t === 'a5')) {\n    d = t === 'a2' ? `M482 98 C560 98 480 157 528 157` : `M482 118 C500 200 440 385 528 385`;\n    lx = t === 'a2' ? 505 : 470; ly = t === 'a2' ? 140 : 300; label = t === 'a2' ? 'by hand' : '';\n  }\n  addEdge(f, t, d, label, dashed, lx, ly);\n}\n// handoff verification edge (under the diagram)\naddEdge('f9', 'main', 'M935 588 C935 690 380 700 380 344', 'main session reads the handoff before trusting it', false, 650, 696);\n\n// nodes\nfor (const id in N) {\n  if (id === 'group') continue;\n  const [kind, x, y, w, h, title, sub] = N[id];\n  const g = el('g', { class: 'node' });\n  const [bg, bd] = kinds[kind];\n  el('rect', { x, y, width: w, height: h, rx: 8, fill: `var(${bg})`, stroke: `var(${bd})` }, g);\n  const t = el('text', { x: x + 10, y: y + 20, class: 't' }, g); t.textContent = title;\n  // wrap subtitle\n  const words = sub.split(' '); const lines = []; let cur = '';\n  const maxc = Math.floor((w - 20) / 5.6);\n  for (const wd of words) { if ((cur + ' ' + wd).trim().length > maxc) { lines.push(cur); cur = wd; } else cur = (cur + ' ' + wd).trim(); }\n  if (cur) lines.push(cur);\n  lines.forEach((ln, i) => { const s = el('text', { x: x + 10, y: y + 36 + i * 13, class: 's' }, g); s.textContent = ln; });\n  nodeEls[id] = g;\n  g.addEventListener('mouseenter', () => focus(id));\n  g.addEventListener('mouseleave', clear);\n}\n\nfunction focus(id) {\n  const linked = new Set([id]);\n  edgeEls.forEach(e => {\n    const on = e.from === id || e.to === id;\n    e.g.classList.toggle('hl', on); e.g.classList.toggle('dim', !on);\n    if (on) { linked.add(e.from); linked.add(e.to); }\n  });\n  for (const k in nodeEls) nodeEls[k].classList.toggle('dim', !linked.has(k) && !(k === 'group'));\n}\nfunction clear() {\n  edgeEls.forEach(e => e.g.classList.remove('hl', 'dim'));\n  for (const k in nodeEls) nodeEls[k].classList.remove('dim');\n}\n<\/script>\n<\/body>\n<\/html>\n";

let SRV=false;const pend={};
function srvQueue(name,get,statusId){
  if(!SRV)return;clearTimeout(pend[name]);
  pend[name]=setTimeout(async()=>{try{const r=await fetch("/save/"+name,{method:"POST",body:get()});
    if(r.ok&&statusId)$(statusId).textContent="Autosaved to design/drafts/"+name+".json at "+new Date().toLocaleTimeString()+" (not the game).";}
    catch(e){SRV=false;}},500);
}
/* ---------------- skills ---------------- */
const SEED=JSON.parse($("seed").textContent);
const MK={fnd:"Foundations",mil:"Military",lux:"Luxury",min:"Minerals",bio:"Biotech"};
const KEY="starBazaarSkillsDraft";
let D=null,branch="mil",sel=null,dirty=false,handle=null;
function clone(o){return JSON.parse(JSON.stringify(o));}
function lsGet(){try{return JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){return null;}}
function lsSet(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){}}
D=lsGet()||clone(SEED);
if(!D.nodes)D=clone(SEED);
function setDirty(v){dirty=v;$("dirty").textContent=v?"Unsaved":"";if(v){lsSet();srvQueue("skills-draft",payload,"where");}}
const byId=()=>Object.fromEntries(D.nodes.map(n=>[n.id,n]));
const orig=Object.fromEntries(SEED.nodes.map(n=>[n.id,JSON.stringify(n)]));
const changed=n=>orig[n.id]!==JSON.stringify(n);

$("btabs").innerHTML=Object.keys(MK).map(k=>`<button data-b="${k}" style="border-left:4px solid var(--${k})">${MK[k]}</button>`).join("")+`<button data-b="all">Stats</button>`;
$("btabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;branch=b.dataset.b;sel=null;drawAll();};

function layout(m){
  const ns=D.nodes.filter(n=>n.market===m),ids=new Set(ns.map(n=>n.id)),by=Object.fromEntries(ns.map(n=>[n.id,n]));
  const depth={};
  const dep=n=>{if(depth[n.id]!=null)return depth[n.id];depth[n.id]=0;
    const ps=(n.prereqs||[]).filter(p=>ids.has(p));
    return depth[n.id]=ps.length?1+Math.max(...ps.map(p=>dep(by[p]))):0;};
  ns.forEach(dep);
  const cols=[];ns.forEach(n=>{(cols[depth[n.id]]=cols[depth[n.id]]||[]).push(n);});
  const row={};
  cols.forEach((c,ci)=>{
    if(!c)return;
    c.forEach(n=>{const ps=(n.prereqs||[]).filter(p=>ids.has(p)&&row[p]!=null);
      n._bc=ps.length?ps.reduce((a,p)=>a+row[p],0)/ps.length:1e3+ns.indexOf(n);});
    c.sort((a,b)=>a._bc-b._bc);
    let last=-1;c.forEach(n=>{let r=Math.max(last+1,Math.round(n._bc>=1e3?last+1:n._bc));row[n.id]=r;last=r;});
  });
  return {ns,depth,row,ids};
}
const W=168,H=58,GX=78,GY=16;
function drawTree(){
  const L=layout(branch),pos={};
  L.ns.forEach(n=>pos[n.id]={x:16+L.depth[n.id]*(W+GX),y:16+L.row[n.id]*(H+GY)});
  const maxx=Math.max(...Object.values(pos).map(p=>p.x))+W+20,maxy=Math.max(...Object.values(pos).map(p=>p.y))+H+20;
  const col=`var(--${branch})`;
  let edges="",nodes="";
  L.ns.forEach(n=>{(n.prereqs||[]).forEach(p=>{
    if(!pos[p])return;
    const a=pos[p],b=pos[n.id],x1=a.x+W,y1=a.y+H/2,x2=b.x,y2=b.y+H/2,mx=(x1+x2)/2;
    const longE=L.depth[n.id]-L.depth[p]>1;
    edges+=`<path class="edge${longE?" long":""}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`;
  });});
  L.ns.forEach(n=>{
    const p=pos[n.id],ext=(n.prereqs||[]).filter(x=>!pos[x]);
    const nm=n.name.length>22?n.name.slice(0,21)+"…":n.name;
    nodes+=`<g class="node ${n.kind==="tech"?"tech":""} ${sel===n.id?"sel":""} ${changed(n)?"changed":""}" data-id="${esc(n.id)}" transform="translate(${p.x},${p.y})">
      <rect width="${W}" height="${H}" rx="8" style="stroke:${col}"/>
      <text class="nm" x="10" y="20">${esc(nm)}</text>
      <text class="sub" x="10" y="36">${esc(n.id)} · ${n.kind==="tech"?"tech "+(n.values&&Object.entries(n.values).find(([k])=>k.startsWith("tech_goal"))?.[1]||""):n.cost+" pt"}</text>
      <text class="badge" x="10" y="50">${n.origin&&n.origin.startsWith("new")?"NEW":""}${changed(n)?" · edited":""}${ext.length?" · needs "+esc(ext.join(", ")).slice(0,26):""}</text>
    </g>`;
  });
  const empties=(D.empty_slots||[]).filter(s=>s.toLowerCase().startsWith(branch));
  $("treewrap").innerHTML=`<svg width="${maxx}" height="${maxy}" viewBox="0 0 ${maxx} ${maxy}">${edges}${nodes}</svg>
    <p class="empty-slot">Empty slots (agreed to stay empty): ${empties.length?empties.map(s=>`<span class="chip">${esc(s)}</span>`).join(""):"none"}</p>`;
  $("treewrap").querySelectorAll(".node").forEach(g=>g.onclick=()=>{sel=g.dataset.id;drawAll();});
}

function effs(n){return [n.effect,...(n.extra||[])].filter(Boolean);}
function val(n,e){return e.key&&n.values?n.values[e.key]:undefined;}
function stats(){
  const out={};
  Object.keys(MK).forEach(m=>out[m]={n:0,skills:0,techs:0,pts:0,vol:0,price:0,cut:0,goal:0});
  D.nodes.forEach(n=>{const s=out[n.market];if(!s)return;
    s.n++;n.kind==="tech"?s.techs++:s.skills++;s.pts+=n.kind==="tech"?0:Number(n.cost)||0;
    Object.entries(n.values||{}).forEach(([k,v])=>{if(k.startsWith("tech_goal"))s.goal+=Number(v)||0;});
    effs(n).forEach(e=>{const v=val(n,e);if(typeof v!=="number")return;const mk=e.target;const t=out[mk];
      if(!t)return;
      if(e.type==="volume_pct"&&!e.condition)t.vol+=v;
      if(e.type==="sale_price_pct")t.price+=v;
      if(e.type==="event_cut_pct")t.cut+=v;});
  });
  return out;
}
function drawStats(){
  const st=stats(),caps=D.balance_caps||{},budget=D.skill_point_budget||21;
  const total=Object.values(st).reduce((a,s)=>a+s.pts,0);
  const rows=Object.entries(st).map(([m,s])=>`<tr><td style="color:var(--${m});font-weight:600">${MK[m]}</td><td>${s.n}</td><td>${s.skills}/${s.techs}</td><td>${s.pts}</td><td>${s.goal}</td>
   <td class="${s.vol>caps.volume+1e-9?"bad":""}">${s.vol.toFixed(2)}</td><td class="${s.price>caps.price+1e-9?"bad":""}">${s.price.toFixed(2)}</td><td class="${s.cut>caps.event_cut+1e-9?"bad":""}">${s.cut.toFixed(2)}</td></tr>`).join("");
  $("treewrap").innerHTML=`<h3>Whole tree</h3>
   <table><tr><th>Branch</th><th>Nodes</th><th>Skill/Tech</th><th>Points to take all</th><th>Tech goal units</th><th>Free volume (cap ${caps.volume})</th><th>Sale price (cap ${caps.price})</th><th>Event cut (cap ${caps.event_cut})</th></tr>${rows}</table>
   <p>Total points to take every skill: <b>${total}</b> against about <b>${budget}</b> earned in a run, so a player takes roughly ${Math.round(budget/Math.max(total,1)*100)}% of the tree. Techs cost crafting, not points.</p>
   <p class="empty-slot">Slots left empty: ${(D.empty_slots||[]).map(s=>`<span class="chip">${esc(s)}</span>`).join("")||"none"}</p>
   <p class="empty-slot">Caps are the consensus guards (economy and QA). Red = over the cap. Only effects whose value is in the draft are counted; conditional volume is ignored.</p>`;
}

function fld(label,html){return `<label>${label}</label>${html}`;}
function drawSide(){
  const n=sel&&byId()[sel];
  if(!n){$("side").innerHTML=`<h3>Select a node</h3><p style="color:var(--mute)">Click a node in the tree to see its effect, numbers and prerequisites, and to edit them. Edits stay in this draft (saved in your browser and in the file you choose with Save draft). The game is never touched.</p>`;return;}
  const st=stats()[n.market];
  const used=D.nodes.filter(x=>(x.prereqs||[]).includes(n.id)).map(x=>x.id);
  const vals=Object.entries(n.values||{}).map(([k,v])=>fld(esc(k),`<input data-v="${esc(k)}" type="number" step="any" value="${esc(v)}">`)).join("");
  $("side").innerHTML=`
   <h3 style="margin-top:0">${esc(n.id)} ${n.origin&&n.origin.startsWith("new")?'<span class="chip">new (consensus)</span>':'<span class="chip">existing</span>'}${changed(n)?'<span class="chip warn">edited</span>':""}</h3>
   ${fld("Name",`<input data-f="name" value="${esc(n.name)}">`)}
   ${fld("Plain line (what it does)",`<textarea data-f="plain">${esc(n.plain)}</textarea>`)}
   ${fld("Flavour line",`<textarea data-f="flavour">${esc(n.flavour)}</textarea>`)}
   <div class="two">${fld("Kind",`<select data-f="kind"><option ${n.kind==="skill"?"selected":""}>skill</option><option ${n.kind==="tech"?"selected":""}>tech</option></select>`)}
   ${fld("Cost (points; 0 for tech)",`<input data-f="cost" type="number" value="${esc(n.cost)}">`)}</div>
   ${fld("Prerequisites (ids, comma separated)",`<input data-f="prereqs" value="${esc((n.prereqs||[]).join(", "))}">`)}
   <h3>Effect</h3>
   <div class="two">${fld("Type",`<input data-e="type" value="${esc(n.effect&&n.effect.type)}">`)}${fld("Target",`<input data-e="target" value="${esc(n.effect&&n.effect.target)}">`)}</div>
   ${effs(n).slice(1).map(e=>`<div class="chip">+ also ${esc(e.type)} ${esc(e.target||"")} ${esc(e.id||"")}</div>`).join("")}
   <h3>Numbers (placeholders for balance.json)</h3>${vals||'<span class="chip">no numbers</span>'}
   <h3>Stats</h3>
   <table><tr><td>Branch</td><td>${MK[n.market]}: ${st.n} nodes, ${st.pts} points to take all</td></tr>
   <tr><td>Needed by</td><td>${used.map(x=>`<span class="chip">${esc(x)}</span>`).join("")||"nothing (leaf)"}</td></tr>
   <tr><td>Free volume / price / cut in ${MK[n.market]}</td><td>${st.vol.toFixed(2)} / ${st.price.toFixed(2)} / ${st.cut.toFixed(2)}</td></tr></table>
   <p style="margin-top:12px"><button id="del" style="color:var(--bad)">Delete node</button></p>`;
  const touch=()=>{setDirty(true);drawTree();};
  $("side").querySelectorAll("[data-f]").forEach(i=>i.oninput=()=>{const f=i.dataset.f;
    n[f]=f==="cost"?Number(i.value):f==="prereqs"?i.value.split(",").map(s=>s.trim()).filter(Boolean):i.value;touch();});
  $("side").querySelectorAll("[data-e]").forEach(i=>i.oninput=()=>{n.effect=n.effect||{};n.effect[i.dataset.e]=i.value;touch();});
  $("side").querySelectorAll("[data-v]").forEach(i=>i.oninput=()=>{n.values[i.dataset.v]=Number(i.value);setDirty(true);});
  $("del").onclick=()=>{if(!confirm("Delete "+n.id+" from the draft?"))return;
    D.nodes=D.nodes.filter(x=>x!==n);D.nodes.forEach(x=>x.prereqs=(x.prereqs||[]).filter(p=>p!==n.id));
    D.empty_slots=[...new Set([...(D.empty_slots||[]),n.id])];sel=null;setDirty(true);drawAll();};
}
function drawAll(){
  document.querySelectorAll("#btabs button").forEach(b=>b.classList.toggle("on",b.dataset.b===branch));
  branch==="all"?drawStats():drawTree();drawSide();
}
$("add").onclick=()=>{
  const m=branch==="all"?"mil":branch,id=prompt("New node id (e.g. MIL_10)");if(!id)return;
  if(byId()[id]){alert("Id exists");return;}
  D.nodes.push({id,market:m,kind:"skill",tier:1,prereqs:[],cost:1,effect:{type:"",target:m},extra:[],values:{},name:id,plain:"",flavour:"",origin:"draft"});
  D.empty_slots=(D.empty_slots||[]).filter(s=>s!==id);sel=id;branch=m;setDirty(true);drawAll();
};
$("reset").onclick=()=>{if(!confirm("Throw away all edits and go back to the consensus draft?"))return;D=clone(SEED);sel=null;setDirty(false);try{localStorage.removeItem(KEY);}catch(e){}drawAll();};
function payload(){return JSON.stringify(D,null,1)+"\n";}
$("save").onclick=async()=>{
  const text=payload();
  try{
    if(window.showSaveFilePicker){
      if(!handle)handle=await showSaveFilePicker({suggestedName:"skills-draft.json",types:[{description:"JSON",accept:{"application/json":[".json"]}}]});
      const w=await handle.createWritable();await w.write(text);await w.close();
      $("where").textContent="Saved draft: "+handle.name+" (not the game).";setDirty(false);lsSet();return;
    }
  }catch(e){if(e.name==="AbortError")return;handle=null;}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.download="skills-draft.json";a.click();
  setDirty(false);lsSet();$("where").textContent="Downloaded skills-draft.json (not the game).";
};
async function loadObj(o){if(!o||!o.nodes)throw new Error("not a skills draft");D=o;sel=null;setDirty(false);lsSet();drawAll();}
$("open").onclick=async()=>{
  try{
    if(window.showOpenFilePicker){[handle]=await showOpenFilePicker({types:[{description:"JSON",accept:{"application/json":[".json"]}}]});
      await loadObj(JSON.parse(await (await handle.getFile()).text()));$("where").textContent="Opened draft: "+handle.name;return;}
  }catch(e){if(e.name==="AbortError")return;handle=null;}
  $("pick").click();
};
$("pick").onchange=async()=>{const f=$("pick").files[0];if(!f)return;try{await loadObj(JSON.parse(await f.text()));}catch(e){alert(e.message);}$("pick").value="";};

/* ---------------- event texts: one free-text document per event ---------------- */
const EVSEED=JSON.parse($("evseed").textContent);
const EVKEY="starBazaarEventsDraft3";
const EVBY=Object.fromEntries(EVSEED.entries.map(x=>[x.id,x]));
const EVGROUPS={};EVSEED.entries.forEach(x=>{(EVGROUPS[x.group]=EVGROUPS[x.group]||[]).push(x);});
const isMain=(g,x)=>x.id===g+"_TITLE"||x.id.startsWith(g+"_BODY");
const mainOf=g=>EVGROUPS[g].filter(x=>isMain(g,x));
const labelOf=(g,x)=>x.id===g+"_TITLE"?"Title":("Body"+x.id.slice((g+"_BODY").length).replace("_"," ").replace(/^ /," "));
let E={groups:{}},evSel=null,evDirty=false,evHandle=null,evAll=false;
try{const o=JSON.parse(localStorage.getItem(EVKEY)||"null");if(o&&o.groups)E=o;}catch(e){}
const evText=(g,x)=>{const t=E.groups[g]&&E.groups[g].texts&&E.groups[g].texts[x.id];return t===undefined?x.text:t;};
const evNotes=g=>(E.groups[g]&&E.groups[g].notes)||"";
const evChanged=g=>EVGROUPS[g].filter(x=>evText(g,x)!==x.text);
const evEdited=g=>evChanged(g).length>0||!!evNotes(g).trim();
function evStore(g,texts,notes){
  const cur=E.groups[g]||{texts:{},notes:""};
  if(texts)Object.entries(texts).forEach(([id,v])=>{if(v===EVBY[id].text)delete cur.texts[id];else cur.texts[id]=v;});
  if(notes!==undefined)cur.notes=notes;
  E.groups[g]=cur;if(!evEdited(g))delete E.groups[g];evSetDirty(true);
}
function evSetDirty(v){evDirty=v;$("evdirty").textContent=v?"Unsaved":"";if(v){try{localStorage.setItem(EVKEY,JSON.stringify(E));}catch(e){}srvQueue("events-draft",evPayload,"evwhere");}}
function evDoc(g){
  if(!evAll)return mainOf(g).map(x=>`${labelOf(g,x)} (max ${x.max}):\n${evText(g,x)}`).join("\n\n");
  return EVGROUPS[g].map(x=>`[[${x.id}]] ${x.place||""} (max ${x.max})\n${evText(g,x)}`).join("\n\n");
}
function evParse(g,doc){ /* -> {id:text} */
  const out={};
  if(evAll){const p=doc.split(/^\[\[([A-Za-z0-9_]+)\]\].*$/m);for(let i=1;i<p.length;i+=2)if(EVBY[p[i]])out[p[i]]=(p[i+1]||"").trim();return out;}
  const byLabel=Object.fromEntries(mainOf(g).map(x=>[labelOf(g,x),x.id]));
  const p=doc.split(/^(Title|Body(?: [AB])?) \(max \d+\):[ \t]*$/m);
  for(let i=1;i<p.length;i+=2)if(byLabel[p[i]])out[byLabel[p[i]]]=(p[i+1]||"").trim();
  return out;
}
function evOver(g,texts){return Object.entries(texts).filter(([id,v])=>EVBY[id].max&&v.length>EVBY[id].max).map(([id,v])=>(evAll?id:labelOf(g,EVBY[id]))+" "+v.length+"/"+EVBY[id].max);}
function evList(){
  const q=$("evq").value.toLowerCase(),only=$("evonly").checked;
  return Object.keys(EVGROUPS).filter(g=>{
    if(!evAll&&!mainOf(g).length)return false;
    if(only&&!evEdited(g))return false;
    if(q&&!(g+" "+EVGROUPS[g].map(x=>evText(g,x)).join(" ")).toLowerCase().includes(q))return false;return true;});
}
function evDraw(){
  evAll=$("evview").value==="all";
  const keys=evList();
  $("evlist").innerHTML=keys.map(k=>{const m=mainOf(k)[0]||EVGROUPS[k][0];return `<div data-g="${esc(k)}" style="padding:5px 8px;border-radius:6px;cursor:pointer;${evSel===k?"background:var(--card);border:1px solid var(--acc)":"border:1px solid transparent"}">
    <b>${esc(k)}</b>${evEdited(k)?' <span class="chip warn">edited</span>':""}<div style="color:var(--mute);font-size:12px">${esc(evText(k,m).slice(0,44))}</div></div>`;}).join("")||'<p class="empty-slot">No match.</p>';
  $("evlist").querySelectorAll("[data-g]").forEach(d=>d.onclick=()=>{evSel=d.dataset.g;evDraw();});
  if(!evSel||!EVGROUPS[evSel]){$("evmain").innerHTML='<p style="color:var(--mute)">Pick an event on the left. In "Main text" view you see only the title and the body, the text the player reads, as plain writing. Edit it freely and add instructions in the notes box; an agent then adapts it to the game. "All lines" shows every text of the event (buttons, effect lines, results) with its text id.</p>';return;}
  const g=evSel,h=EVGROUPS[g][0];
  $("evmain").innerHTML=`<h3 style="margin-top:0">${esc(g)} ${h.tag?`<span class="chip">${esc(h.tag)}</span>`:""}${h.kind?`<span class="chip">kind ${esc(h.kind)}</span>`:""}<button id="evrevert" style="float:right">Revert this event</button></h3>
   <textarea id="evdoc" style="width:100%;min-height:${evAll?58:30}vh;resize:vertical;line-height:1.55;padding:10px;font-size:15px" spellcheck="true">${esc(evDoc(g))}</textarea>
   <div id="evover" style="font-size:12px;min-height:18px"></div>
   <label>Notes for the agent (what you want changed, tone, ideas)</label>
   <textarea id="evnotes" style="width:100%;min-height:80px">${esc(evNotes(g))}</textarea>`;
  const over=()=>{const o=evOver(g,evParse(g,$("evdoc").value));$("evover").innerHTML=o.length?'<span class="bad">Over the length limit: '+esc(o.join(", "))+'</span> <span style="color:var(--mute)">(the agent will shorten it if you leave it)</span>':'<span class="ok">Within the length limits.</span>';};
  over();
  $("evdoc").oninput=()=>{evStore(g,evParse(g,$("evdoc").value),undefined);over();};
  $("evnotes").oninput=()=>evStore(g,undefined,$("evnotes").value);
  $("evrevert").onclick=()=>{if(!confirm("Revert "+g+" to the game's current text and clear its notes?"))return;delete E.groups[g];evSetDirty(true);evDraw();};
}
["evq","evonly","evview"].forEach(i=>$(i).addEventListener("input",evDraw));
function evPayload(){
  const groups=Object.keys(E.groups).filter(evEdited).map(g=>({group:g,title:(EVBY[g+"_TITLE"]||{}).text||"",notes:evNotes(g),
    lines:evChanged(g).map(x=>({id:x.id,place:x.place,max:x.max,original:x.text,text:evText(g,x)}))}));
  return JSON.stringify({_note:"DRAFT event text edits from the owner (English only; localisation is ignored until the owner asks for a translation). For each group: 'lines' are the text ids the owner rewrote ('original' is the current game text, 'text' is the owner's version, 'max' is the length limit) and 'notes' are instructions for the whole event. Adapt them to the game: keep mechanics and placeholders like {bot1}, {cash_out}, respect max, write the result into story/*.md (never edit the generated data/story_text.json or data/events.json), then run python3 tools/build_story.py.",groups},null,1)+"\n";
}
async function evSave(){
  const text=evPayload();
  try{
    if(window.showSaveFilePicker){
      if(!evHandle)evHandle=await showSaveFilePicker({suggestedName:"events-draft.json",types:[{description:"JSON",accept:{"application/json":[".json"]}}]});
      const w=await evHandle.createWritable();await w.write(text);await w.close();$("evwhere").textContent="Saved "+evHandle.name+" (not the game).";evSetDirty(false);return;
    }
  }catch(e){if(e.name==="AbortError")return;evHandle=null;}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.download="events-draft.json";a.click();
  evSetDirty(false);$("evwhere").textContent="Downloaded events-draft.json (not the game).";
}
$("evsave").onclick=evSave;
$("evreset").onclick=()=>{if(!confirm("Throw away all event edits and notes?"))return;E={groups:{}};evSetDirty(false);try{localStorage.removeItem(EVKEY);}catch(e){}evDraw();};
function evMerge(o){if(!o||!o.groups)throw new Error("not an events draft");
  o.groups.forEach(x=>{if(!EVGROUPS[x.group])return;const texts={};(x.lines||[]).forEach(l=>{if(EVBY[l.id])texts[l.id]=l.text;});E.groups[x.group]={texts,notes:x.notes||""};});}
$("evopen").onclick=async()=>{
  try{if(window.showOpenFilePicker){[evHandle]=await showOpenFilePicker({types:[{description:"JSON",accept:{"application/json":[".json"]}}]});
    evMerge(JSON.parse(await (await evHandle.getFile()).text()));evSetDirty(true);evDraw();return;}}catch(e){if(e.name==="AbortError")return;evHandle=null;}
  $("evpick").click();};
$("evpick").onchange=async()=>{const f=$("evpick").files[0];if(!f)return;try{evMerge(JSON.parse(await f.text()));evSetDirty(true);evDraw();}catch(e){alert(e.message);}$("evpick").value="";};

if(location.protocol.startsWith("http"))fetch("/ping").then(r=>r.ok?r.json():null).then(async j=>{
  if(!j||!j.studio)return;SRV=true;
  try{const r=await fetch("/draft/skills-draft");if(r.ok){const o=await r.json();if(o&&o.nodes){D=o;sel=null;dirty=false;$("dirty").textContent="";drawAll();}}}catch(e){}
  try{const r=await fetch("/draft/events-draft");if(r.ok){const o=await r.json();if(o&&o.groups){E={groups:{}};evMerge(o);evDraw();}}}catch(e){}
  $("where").textContent="Autosave on: design/drafts/skills-draft.json (not the game).";
  $("evwhere").textContent="Autosave on: design/drafts/events-draft.json (not the game).";
}).catch(()=>{});

window.addEventListener("beforeunload",e=>{if(dirty||evDirty){e.preventDefault();e.returnValue="";}});
drawAll();
{const h=(location.hash||'').slice(1);const b=document.querySelector('nav .tab[data-p="'+h+'"]');if(b)b.click();const q=new URLSearchParams(location.search);if(q.get('b')){branch=q.get('b');drawAll();}}
</script>
</body>
</html>
