ying the fee clears it; fee is a template value set by the economy designer (T97). Q2 shield: all numbers go to the economy designer (T99); the shield affects only planets the player can choose to buy later. Q3 pirates: pirates exist and reduce trade volume; the player can hire clearing for money at a cost; numbers to T102. Q4 zoom: the galaxy view opens only after the player opens solar system 2, introduced through the tutorial (T119, with T15); not a bug fix; T105 stays blocked by T85. Q5 asteroid approach: a warning; the paid option grants no skill point and no reputation; declining is a 50/50 roll between a bad outcome (warehouse destroyed, or storage cut) and nothing; template values (T107). STILL OPEN: nomad mining and the field link (T104); field clearing skill or money (T111, T113); planet types (T115); whether money never buys skill points covers all spending (T97, T99, T107).\"}, {\"task_id\": \"T96\", \"title\": \"Debris event: texts (idea 1)\", \"owner_agent\": \"story-designer\", \"depends_on\": [\"T95\"], \"status\": \"done\", \"turn_cap\": 15, \"window\": \"Story lane, idea 1 step 1 of 3 (serial). In the 2026-10-28 economy and story batch; T97 follows its return.\", \"brief\": \"Write the 'cleanup orbit debris' event in story/events.md: title, body, choice labels (pay the fee; leave the debris), and the plain effect lines with NOT_EVENT_PREFIX. Leaving the debris lowers the planet's route efficiency while it stays; paying the fee clears it. Use the same id format as the other events; keep to max lengths in story/voice.md. Do not write numbers; the fee is set in T97. Handoff: handoffs/story-designer/<date>-T96.json.\", \"owner_note\": \"Owner idea 1, 2026-10-28. Q1 answered: route efficiency from the planet is lowered while the debris stays; paying clears it; fee is a template value (T97).\"}, {\"task_id\": \"T97\", \"title\": \"Debris event: fee numbers (idea 1)\", \"owner_agent\": \"economy-designer\", \"depends_on\": [\"T96\"], \"status\": \"done\", \"turn_cap\": 15, \"window\": \"Economy lane, idea 1 step 2 of 3 (serial). DONE 2026-10-28: handoffs/economy-designer/2026-10-28-ideas.json. Note: T96 handoff file is missing.\", \"brief\": \"Set the debris fee (one-off cash cost) as a template value in data/events.json or data/balance.json, as the T12 rule allows. Set the non-payment effect as a template value: the route efficiency lowered from that planet while the debris stays. Log old, new and reason; run tools/sim.py before and after. Handoff: handoffs/economy-designer/<date>-T97.json.\", \"owner_note\": \"Owner idea 1, 2026-10-28. Q1 answered: fee size is a template value set here. Money-rule scope still open (the fee is not a skill point).\"}, {\"task_id\": \"T98\", \"title\": \"Debris event: wire it through the event system (idea 1)\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [\"T12\", \"T96\", \"T97\"], \"status\": \"done\", \"turn_cap\": 20, \"window\": \"Gameplay lane, idea 1 build (step 3 of 3, serial), after T97 and T12. Next build after the batch returns, once T12 is done.\", \"brief\": \"Add the debris event as a choice event through the T12 system: entry in data/events.json, texts loaded by id (no hard-coded text), fee applied as a one-off cash effect. Leaving the debris lowers that planet's route efficiency while it stays; paying clears it. Check it with the T12 debug trigger. Handoff: handoffs/gameplay-programmer/<date>-T98.json.\", \"owner_note\": \"Owner idea 1, 2026-10-28.\"}, {\"task_id\": \"T99\", \"title\": \"Solar shield: numbers (idea 2)\", \"owner_agent\": \"economy-designer\", \"depends_on\": [\"T95\"], \"status\": \"done\", \"turn_cap\": 25, \"window\": \"Economy lane, idea 2 numbers (step 1 of 3). In the 2026-10-28 batch. Build waits in T101.\", \"brief\": \"Abstract numbers only: shield build cost; resource-mix shift per planet (what drops, what gains); extra profit and energy; resident unhappiness as a number if needed. Update tools/sim.py only if it reads these values. Log every value with old, new and reason. Handoff: handoffs/economy-designer/<date>-T99.json.\", \"owner_note\": \"Owner idea 2, 2026-10-28. Q2 answered: all numbers go to the economy designer. The shield affects only planets the player can choose to buy later. Dependency on T98 (idea 1 build) moved to the build task T101.\"}, {\"task_id\": \"T100\", \"title\": \"Solar shield: texts (idea 2)\", \"owner_agent\": \"story-designer\", \"depends_on\": [\"T99\"], \"status\": \"done\", \"turn_cap\": 20, \"window\": \"Story lane, idea 2 texts (step 2 of 3), in the 2026-10-28 batch after T99 returns.\", \"brief\": \"Texts for: the shield event and build choice; resident unhappiness notices (if T99 defines them); the habitability line for the completion ending, one line per tier affected, following the T95 answer (the shield affects only planets buyable later; no ending change). Story ids in the existing format; max lengths per story/voice.md. Handoff: handoffs/story-designer/<date>-T100.json.\", \"owner_note\": \"Owner idea 2, 2026-10-28. Owner note for story-designer 2026-10-28: no shield wording in any ending. The completion-ending habitability line in this brief is not to be written. Handoff file missing at Producer check; stays running.\"}, {\"task_id\": \"T101\", \"title\": \"Solar shield: build, resource mix, unhappiness, habitability (idea 2)\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [\"T12\", \"T85\", \"T98\", \"T99\", \"T100\"], \"status\": \"done\", \"turn_cap\": 60, \"window\": \"Gameplay lane, idea 2 build (step 3 of 3, serial), after idea 1 build T98 and texts T100. Needs T85 for the buyable planets.\", \"brief\": \"(1) Build action for the partial shield over the sun in the system view; cost from data. (2) Per-planet resource-mix modifiers applied to production and prices; profit and energy gains from data. (3) Resident unhappiness per planet, shown in the planet panel with story ids, if T99 defines it. (4) Habitability flag per planet, used only for which buyable planets the player can choose (owner 2026-10-28). Do not change the ending picker (T77) or the ending structure. (5) Save and load the shield state. No hard-coded text or numbers. Handoff: handoffs/gameplay-programmer/<date>-T101.json.\", \"owner_note\": \"Owner idea 2, 2026-10-28. Owner answer 3: the shield only affects planets the player can buy later; no change to the ending structure, so the ending-check step is removed. Needs T85 (system 2 planets).\"}, {\"task_id\": \"T102\", \"title\": \"Nomads and pirates: numbers (idea 3)\", \"owner_agent\": \"economy-designer\", \"depends_on\": [\"T95\"], \"status\": \"done\", \"turn_cap\": 20, \"window\": \"Economy lane, idea 3 numbers (step 1 of 3). In the 2026-10-28 batch. Build waits in T104 (after T101).\", \"brief\": \"Abstract numbers: the pirate effect size as a reduction of trade volume; the cost the player pays to hire pirate clearing (money); cash or stock from mining a field after eviction; pirate increase per evicted nomad group. Log every value. Handoff: handoffs/economy-designer/<date>-T102.json.\", \"owner_note\": \"Owner idea 3, 2026-10-28. Q3 answered: pirates exist and reduce trade volume; the player can hire clearing for money at a cost. Still open: the nomad field link (T104). Dependency on T101 moved to the build task T104.\"}, {\"task_id\": \"T103\", \"title\": \"Nomads and pirates: texts (idea 3)\", \"owner_agent\": \"story-designer\", \"depends_on\": [\"T102\"], \"status\": \"done\", \"turn_cap\": 15, \"window\": \"Story lane, idea 3 texts (step 2 of 3), in the 2026-10-28 batch after T102 returns.\", \"brief\": \"Event texts: nomads on asteroids (choice: evict or let them stay), the eviction outcome, the pirate-increase notice, the pirate trade-volume notice, and the hire-clearing option and its outcome. Story ids in story/events.md; max lengths per story/voice.md. Handoff: handoffs/story-designer/<date>-T103.json.\", \"owner_note\": \"Owner idea 3, 2026-10-28.\"}, {\"task_id\": \"T105\", \"title\": \"Galaxy overview: zoom-out view with systems, connections, icons and routes (idea 4)\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [\"T15\", \"T85\", \"T118\", \"T119\"], \"status\": \"done\", \"turn_cap\": 40, \"window\": \"Gameplay lane, idea 4 build (step 3 of 3, serial), after T118. Blocked by T85 (system 2) and the tutorial (T15, T119).\", \"brief\": \"Owner answer 2026-10-28 (idea 4): this is a feature, not a bug fix. (1) Galaxy-level zoom that shows: explored solar systems and the connections between them; small icons from T118 for the resources near each planet; the trade routes the player has built. (2) Unreached systems show as unknown. (3) The galaxy view opens only after the player opens solar system 2; the first opening is introduced through the tutorial (text T119, flow in T15). (4) Labels by story id from T106; no hard-coded text. (5) No new numbers. Stay within the macOS frame budget and report frame_time_ms. Handoff: handoffs/gameplay-programmer/<date>-T105.json.\", \"owner_note\": \"Owner idea 4, 2026-10-28. Owner answers: the view opens only after system 2 is opened; introduced through the tutorial. Blocked by T85 (kept). Tutorial dependencies T15 and T119 added by Producer 2026-10-28.\"}, {\"task_id\": \"T118\", \"title\": \"Map icons for the resources near each planet (idea 4)\", \"owner_agent\": \"artist\", \"depends_on\": [\"T106\"], \"status\": \"done\", \"turn_cap\": 30, \"window\": \"Artist lane, idea 4 step 2 of 3 (serial), after T106.\", \"brief\": \"Small 2D icons, one per resource, for the galaxy view and the resource row near each planet. Use the existing resource keys in data/; no text inside the images. Report frame_time_ms if drawn in-scene. Handoff: handoffs/artist/<date>-T118.json.\", \"owner_note\": \"Created by Producer 2026-10-28: T105 and T116 referenced it but it was missing from the queue. Owner answer 7 gives map icons to the artist. Owner idea 4.\"}, {\"task_id\": \"T119\", \"title\": \"Tutorial text: galaxy view introduction (idea 4)\", \"owner_agent\": \"story-designer\", \"depends_on\": [\"T95\"], \"status\": \"done\", \"turn_cap\": 15, \"window\": \"Story lane, idea 4 tutorial text. Next story batch; before T105.\", \"brief\": \"Write the tutorial lines that introduce the galaxy view the first time the player opens it, after they have opened solar system 2. Say briefly what it shows: explored systems, the links between them, resource icons, and the player's own trade routes. Story ids in the existing format in story/screens.md or story/game-flow.md; max lengths per story/voice.md. Do not write numbers. Handoff: handoffs/story-designer/<date>-T119.json.\", \"owner_note\": \"Created by Producer 2026-10-28 (owner answer, idea 4): the zoom is introduced through the tutorial, and a tutorial text task in the story lane did not exist. Feeds T105.\"}, {\"task_id\": \"T107\", \"title\": \"Asteroid approach: numbers (idea 5)\", \"owner_agent\": \"economy-designer\", \"depends_on\": [\"T95\"], \"status\": \"done\", \"turn_cap\": 20, \"window\": \"Economy lane, idea 5 numbers (step 1 of 4). In the 2026-10-28 batch. Build waits in T109 (after T105).\", \"brief\": \"Template values, abstract numbers: the state payment (money) for the paid option; the storage capacity cut; the warehouse destruction rule for the bad outcome (which warehouse, what happens to its stock). The paid option grants nothing: no skill point and no reputation (owner 2026-10-28). Keep 50/50 unless the owner changes it. Log every value. Handoff: handoffs/economy-designer/<date>-T107.json.\", \"owner_note\": \"Owner idea 5, 2026-10-28. Q5 answered: the paid option grants no skill point and no reputation; declining is a 50/50 roll (bad outcome or nothing); template values. Money-rule scope still open for other spending.\"}, {\"task_id\": \"T108\", \"title\": \"Asteroid approach: texts (idea 5)\", \"owner_agent\": \"story-designer\", \"depends_on\": [\"T107\"], \"status\": \"done\", \"turn_cap\": 15, \"window\": \"Story lane, idea 5 texts (step 2 of 4), in the 2026-10-28 batch after T107 returns.\", \"brief\": \"Texts: approaching-asteroid warning; pay the state option; decline option; the three outcomes (warehouse destroyed; storage cut; nothing happens). Reward: paying the state gives one research point (owner 2026-10-28); its notice is T120, not this task. Story ids in story/events.md; max lengths per story/voice.md. Handoff: handoffs/story-designer/<date>-T108.json.\", \"owner_note\": \"Owner idea 5, 2026-10-28. Reward revised 2026-10-28: paying the state gives one research point (event reward, not bought with money). The reward notice is T120. Handoff file missing at Producer check; stays running.\"}, {\"task_id\": \"T109\", \"title\": \"Asteroid approach: event and 50/50 outcome (idea 5)\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [\"T12\", \"T71\", \"T105\", \"T107\", \"T108\", \"T120\"], \"status\": \"done\", \"turn_cap\": 50, \"window\": \"Gameplay lane, idea 5 build (step 3 of 4, serial), after T105 (idea 4 build) and the T107 and T108 batch work.\", \"brief\": \"(1) Asteroid event as a T12 choice event: pay (money to the state; grants one research point as an event reward, not bought with money; no skill point and no reputation) or decline. (2) Decline: a seeded 50/50 roll (replayable for QA) between a bad outcome (the chosen warehouse destroyed, or its storage cut, per data) and nothing. (3) Asteroid drawn as a simple polygon on an approach path. (4) Texts by id; numbers from data. (5) Save and load. Handoff: handoffs/gameplay-programmer/<date>-T109.json.\", \"owner_note\": \"Owner idea 5, 2026-10-28. Reward and skill 3 answered: the paid option grants no skill point and no reputation, so the skill 3 question no longer blocks this task. Reputation removed.\"}, {\"task_id\": \"T110\", \"title\": \"Hexagon ring around the sun and visual extras (idea 5)\", \"owner_agent\": \"artist\", \"depends_on\": [\"T109\"], \"status\": \"done\", \"turn_cap\": 30, \"window\": \"Artist lane, idea 5 step 4 of 4 (serial), after T109.\", \"brief\": \"Simple polygon structure of hexagons around the sun, shown during the asteroid event, plus the small visual extras the owner listed. Line and polygon draw, no heavy shader. Stay within the macOS frame budget and report frame_time_ms. No gameplay logic. Handoff: handoffs/artist/<date>-T110.json.\", \"owner_note\": \"Owner idea 5, 2026-10-28. Moved from galaxy-builder to artist (owner answer 7).\"}, {\"task_id\": \"T114\", \"title\": \"Ship dots with trails on leaving and arriving (idea 7)\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [\"T87\"], \"status\": \"done\", \"turn_cap\": 30, \"window\": \"Gameplay lane, idea 7 step 1 of 2 (serial), after T113. Not batched.\", \"brief\": \"A dot for each ship leaving its source and arriving at its destination, with a fading trail along the lane. One dot per ship on a shared lane (T87). No text; no balance values. Stay within the frame budget and report frame_time_ms. Handoff: handoffs/gameplay-programmer/<date>-T114.json.\", \"owner_note\": \"Owner idea 7, 2026-10-28. Serial order: runs after idea 6 (T113). T87 stays a hard dependency. 2026-10-28: T113 removed from depends_on (ship dots need only multi-ship lanes, T87).\"}, {\"task_id\": \"T120\", \"title\": \"Story: asteroid reward notice (EV20 reward line, idea 5)\", \"owner_agent\": \"story-designer\", \"depends_on\": [\"T108\"], \"status\": \"done\", \"turn_cap\": 10, \"window\": \"Story lane, idea 5 reward text, after T108 returns; before T109.\", \"brief\": \"Write the reward notice for EV20 in story/events.md: paying the state gives one research point as an event reward (not bought with money). Plain effect line with NOT_EVENT_PREFIX. Story id in the existing format; max length per story/voice.md. No shield or ending wording. Handoff: handoffs/story-designer/<date>-T120.json.\", \"owner_note\": \"Owner idea 5 reward confirmed 2026-10-28: indow\": \"Gameplay lane, after T122 (shares the top bar control).\", \"brief\": \"Promote the speed selector (1x, 2x, 6x, 12x) from the debug build into the release build and the top bar. The chosen speed stays on until the player changes it, and survives pause and resume. It must not change balance or cycle length, only how fast game time runs. Save the chosen speed in the autosave and restore it on load. Handoff: handoffs/gameplay-programmer/<date>-T123.json.\", \"owner_note\": \"Created by main session 2026-10-31 from the owner's list (11 items). Owner decides scope; no code yet.\"}, {\"task_id\": \"T124\", \"title\": \"Tutorial: first steps (buy, Send to, sell, skill tree) (owner item 3)\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 15, \"window\": \"Gameplay lane. Needs the story lines first (story designer step inside the brief).\", \"brief\": \"Build a guided tutorial for the first steps: Buy on a planet row, Send to... a second planet, Sell at the destination, and what the skill tree is for. Each step waits until the player does it. Story lines for every step come from story/screens.md (story-designer writes them first; if a line is missing, do not invent text, ask). Reuse the existing tutorial hook (TUT_* ids). Handoff: handoffs/gameplay-programmer/<date>-T124.json.\", \"owner_note\": \"Created by main session 2026-10-31 from the owner's list (11 items). Owner decides scope; no code yet.\"}, {\"task_id\": \"T126\", \"title\": \"Skill point earned: visible pop-up with a splash (owner item 5)\", \"owner_agent\": \"ui-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 15, \"window\": \"UI lane. Splash uses existing UI textures only; any new art goes to the artist first.\", \"brief\": \"When a skill point is earned, show a short pop-up over the top of the screen: the point count and a one-line reason (story text NOT_SKILL_REASON_* already exists). The splash is an animated highlight built from existing UI textures and the existing notice style. No new art or effect files without an artist handoff. The pop-up must not block play; it fades after a few seconds and can be dismissed. Handoff: handoffs/ui-programmer/<date>-T126.json.\", \"owner_note\": \"Created by main session 2026-10-31 from the owner's list (11 items). Owner decides scope; no code yet.\"}, {\"task_id\": \"T127\", \"title\": \"Permit Charter text: clearer, less stamp wording (owner item 6)\", \"owner_agent\": \"story-designer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 15, \"window\": \"Story lane. Quick.\", \"brief\": \"Rewrite the Permit Charter (C1) skill text and its permit lines (SK_C1_* and PERMIT_* ids) so the purpose is obvious at a glance. Owner said the current wording mentions a stamp and is not clear. Keep the voice in story/voice.md and the max lengths. Handoff: handoffs/story-designer/<date>-T127.json.\", \"owner_note\": \"Created by main session 2026-10-31 from the owner's list (11 items). Owner decides scope; no code yet.\"}, {\"task_id\": \"T128\", \"title\": \"Skill arrow outside the planet ring in the 3D view (owner item 7)\", \"owner_agent\": \"ui-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 15, \"window\": \"NOT READY for art: the arrow icon needs an artist handoff first. The UI logic can be built with a placeholder from existing textures.\", \"brief\": \"Add a minimal arrow outside the planet ring in the 3D view. It is hidden until a skill permit or system is available to open. Clicking it opens the skill tab and highlights the steps needed. If the permit is held, clicking moves the view to the other system. Icon: artist handoff (minimal arrow, no new effects). Handoff: handoffs/ui-programmer/<date>-T128.json.\", \"owner_note\": \"Created by main session 2026-10-31 from the owner's list (11 items). Owner decides scope; no code yet.\"}, {\"task_id\": \"T129\", \"title\": \"Planet panel: more room above the scrollbar (owner item 8)\", \"owner_agent\": \"ui-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 15, \"window\": \"UI lane. Small.\", \"brief\": \"When the planet panel grows with options, the scrollbar sits too close to the other elements. Give it a clear margin from the option rows and the panel edge at macOS window size. Check at the smallest supported window. Handoff: handoffs/ui-programmer/<date>-T129.json.\", \"owner_note\": \"Created by main session 2026-10-31 from the owner's list (11 items). Owner decides scope; no code yet.\"}, {\"task_id\": \"T130\", \"title\": \"Event texts: braver, more story, in line with the game (owner item 9)\", \"owner_agent\": \"story-designer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 15, \"window\": \"Story lane. Batch of event texts (data/events.json, EV01 to EV20).\", \"brief\": \"Owner says event texts are dull. Rewrite the event title and body lines (EV* ids) and choice labels to be bolder and more in the Commons and Bureau voice, with a sharper sense of consequence. Keep the same meaning, effects and numbers; no new mechanics. Keep max lengths. Handoff: handoffs/story-designer/<date>-T130.json.\", \"owner_note\": \"Created by main session 2026-10-31 from the owner's list (11 items). Owner decides scope; no code yet.\"}, {\"task_id\": \"T132\", \"title\": \"Sun: cut the sprite sheet and make a 3D sun that lights the planets (owner item 11)\", \"owner_agent\": \"fx-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 15, \"window\": \"FX lane. Source sheet: art/Solar Flare Evolution Sprite Sheet.png (8 by 8 grid of frames). Owner asked for FX here, overriding the no-new-fx rule for this item only.\", \"brief\": \"Cut the sheet into frames with a script (keep the script in tools/). Then build a 3D sun in Godot from the frames: an animated texture on a sphere, with the flare motion driven by the frame sequence. The sun's flare events should brighten or shift the light on the planets. Keep the frame budget for macOS. Handoff: handoffs/fx-programmer/<date>-T132.json.\", \"owner_note\": \"Created by main session 2026-10-31 from the owner's list (11 items). Owner decides scope; no code yet.\"}, {\"task_id\": \"T133\", \"title\": \"Planet income popup: +N green number above the planet each cycle (owner request 2026-10-31)\", \"owner_agent\": \"ui-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 15, \"window\": \"UI lane. Visual feedback only; uses existing fonts and theme colours. Owner checks the look.\", \"brief\": \"When a planet earns money in a cycle (credits from its routes and standing orders), show a short green \\\"+N\\\" number above that planet on the 3D map. It rises a little and fades out over about 1.5 to 2 seconds. Several planets can show one at a time. The number is the credits that planet gained in the last cycle (use the game's own income figure, do not recompute balance). Make it pretty: a clean mono number with a soft glow, using the theme's green (find the existing green token in the theme; do not add new art). It must not block clicks, and it must be off or hidden when there is no income. Keep it readable at macOS window size. Handoff: handoffs/ui-programmer/<date>-T133.json.\", \"owner_note\": \"Created by producer 2026-10-31 from owner request (planet income popup). Visual check by owner.\"}, {\"task_id\": \"T134\", \"title\": \"Send to button visible on planet panel with zero storage (owner request 2026-10-31)\", \"owner_agent\": \"ui-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 15, \"window\": \"UI lane. Small.\", \"brief\": \"On the planet panel, the \\\"Send to...\\\" control is only shown on a storage row that has stock. The owner wants it visible from the start, even when the planet has zero storage of a resource, so the player can chain a route right away and plan from the start. Show \\\"Send to...\\\" on each resource row (or wherever it is offered now) even at zero stock, and make it work the same way it does with stock (it starts the pending route; the route then needs the source to have stock to move anything, which the game already handles). Keep the existing route rules (cross-system needs C3, a route needs a destination planet, and the game's checks). If zero stock means the route cannot run yet, show a short hint in the existing notice style rather than hiding the button. No new art. Handoff: handoffs/ui-programmer/<date>-T134.json.\", \"owner_note\": \"Created by producer 2026-10-31 from owner request. Visual check by owner.\"}, {\"task_id\": \"T135\", \"title\": \"Planet atmosphere glow: smooth 0-1-0 ramp from the planet edge (owner request 2026-10-31)\", \"owner_agent\": \"fx-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 15, \"window\": \"FX lane. Visual; owner checks the look.\", \"brief\": \"The planet's blue atmosphere glow is not uniform. The bright blue ring at the planet edge does not start from the same value as the planet's edge, so the glow looks like a hard band. Make the glow a clean ramp: at the planet's limb the glow value equals the planet's edge value, it peaks there, and it fades smoothly to zero outward, so the profile reads 0 to 1 to 0 with no hard ring. Use the existing atmosphere shader (art/planet_fx/planet_sphere_atmosphere.gdshader and the glow shader, whichever draws the ring) and its named constants; no new art. Keep the planets' colours from the palette. Check that all planet variants use the same ramp. Handoff: handoffs/fx-programmer/<date>-T135.json.\", \"owner_note\": \"Created by producer 2026-10-31 from owner request (atmosphere ring). Visual check by owner.\"}, {\"task_id\": \"T136\", \"title\": \"Reword the mission line on the planet panel (owner review of the planet panel)\", \"owner_agent\": \"ui-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 15, \"window\": \"UI lane, after the current UI round. Small.\", \"brief\": \"The planet/mission panel still shows the line \\\"Mission: Buy a ship\\\". Buying a ship now happens through \\\"Send to...\\\" or the ship panel, so the line is out of date. Pick clearer wording that matches the new flow and replace the line. Take the wording from story/screens.md or the story text loader (data/story_text.json via game/story_text.gd); do not hard-code new text in the panel. If the change needs a new or changed story id, list the id, its meaning and max length in the handoff for the story-designer rather than inventing text. Do not change the mission logic or any numbers. Handoff: handoffs/ui-programmer/<date>-T136.json.\", \"owner_note\": \"Source: owner's review of the planet panel (2026-11-01). Not started; queued after the current UI round.\"}, {\"task_id\": \"T139\", \"title\": \"Space Storage: sell orders draw from stock stored in Space Storage (owner answer d)\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [\"T85\"], \"status\": \"done\", \"turn_cap\": 40, \"window\": \"Gameplay lane, owner answer 2026-11-01. Start by main session. Goes with T64 (unstopped the same day).\", \"brief\": \"Owner answer 2026-11-01 (d). A sell order at a planet, or a sell order at a Space Storage post, draws its stock from the stock stored in that system's Space Storage. Use the existing storage and order code; add no new numbers and no new text (story ids only, flag any missing id for the story-designer). Save and load are unchanged in shape. Check with a headless run that a sell order empties Space Storage stock and that a route that broke still gets support as T85 defines. Handoff: handoffs/gameplay-programmer/<date>-T139.json.\", \"owner_note\": \"Owner answer 2026-11-01 (d). Producer added 2026-11-01. Unstop of T64 is recorded on T64.\"}, {\"task_id\": \"T140\", \"title\": \"Buy works on its own: standing buy order without a route; Send to... is optional\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 40, \"window\": \"Gameplay lane, owner request 2026-11-02. Start by main session.\", \"brief\": \"Owner request 2026-11-02: sending is mandatory today. Today the planet panel has one button, \\\"Buy and send to...\\\" (planet_panel.gd, handler main.gd _on_buy_send), which sets a standing buy order and then needs a destination click to make a route. Change it so buying and sending are separate choices: (1) a standing buy order at a planet works on its own, with no route and no destination needed (use the existing set_local_order / local buy code in main.gd and route_engine.gd); (2) sending is optional: a route can be made from a planet's storage to another planet at any time through the existing Send to flow, with or without a buy order. Keep every existing rule: cross-system needs C3, one ship per route, ship purchase and upkeep, the route checks. Buy-only goods must show up in storage and be sellable through the existing sell orders. Do not change numbers or add text: flag any missing story id for the story-designer. Check headless that (a) a buy order alone fills storage with no route, (b) a route still works with no buy order when storage has stock, (c) the old combined path still works. Save/load shape unchanged. Handoff: handoffs/gameplay-programmer/<date>-T140.json. T141 (planet panel buttons) waits on this task.\", \"owner_note\": \"Owner request 2026-11-02. Added by main session; producer to confirm.\"}, {\"task_id\": \"T141\", \"title\": \"Planet panel: separate Buy and optional Send to... buttons\", \"owner_agent\": \"ui-programmer\", \"depends_on\": [\"T140\"], \"status\": \"done\", \"turn_cap\": 15, \"window\": \"UI lane. Small. Start after T140 is done.\", \"brief\": \"Follows T140. On each resource row of the planet panel, replace the combined \\\"Buy and send to...\\\" button with two separate controls: a Buy toggle (standing buy order, shows \\\"Buy: on\\\" and Stop buying, no destination step) and an optional \\\"Send to...\\\" that starts the route flow as today. Both must be usable independently. Keep the existing tooltips' style and notice text, reuse StoryText ids where they exist (BTN_BUY_SEND, LBL_BUY_SEND_TIP), flag any new ids for the story-designer rather than inventing text. No new art. Handoff: handoffs/ui-programmer/<date>-T141.json. Visual check by owner. Note from T140: the resource-row button in planet_panel.gd still uses BTN_BUY_SEND (\\\"Buy and send to...\\\") and its tooltip still says it sends. It now only buys. Relabel it to the Buy text (StoryText id BTN_BUY if it exists; otherwise flag it for the story-designer and use the nearest existing id). main.gd _on_buy_send now only sets the standing buy order; begin_buy_and_send(c) keeps the old combined path for tests only and no button calls it.\", \"owner_note\": \"Owner request 2026-11-02. Added by main session; producer to confirm.\"}, {\"task_id\": \"T142\", \"title\": \"Feature designer: first pass on new features and improvements to existing mechanics\", \"owner_agent\": \"feature-designer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 25, \"window\": \"Design lane, no code. Runs in parallel with T140.\", \"brief\": \"Read state.md, the latest QA report under qa/reports/, and the latest handoffs of gameplay-programmer and economy-designer. Find where the buy/send split (T140) leaves gaps or new choices. Write up to 5 ranked proposals per your agent rules: new features that fit the core loop, and improvements to existing mechanics (dead choices, dominant strategies, slow stretches, unclear feedback). Write design/proposals/2026-11-02-first-pass.md and handoffs/feature-designer/2026-11-02-T142.json. Owner approves; nothing is built from this task.\", \"owner_note\": \"Owner request 2026-11-02 (new agent). Added by main session; producer to confirm.\"}, {\"task_id\": \"T143\", \"title\": \"Route row says where its money lands (feature proposal 1, approved 2026-11-02)\", \"owner_agent\": \"ui-programmer\", \"depends_on\": [\"T141\"], \"status\": \"done\", \"turn_cap\": 15, \"window\": \"UI lane. Small. Start after T141.\", \"brief\": \"Owner approved proposal 1 (design/proposals/2026-11-02-first-pass.md). Add one line to each route row: \\\"Pays when [planet] has a standing Sell order\\\", with its on/off state. If off, one control turns on that Sell order using the existing order toggle. First confirm whether the route row already says this; if it does, report that and stop. Story text: flag new StoryText ids for the story-designer, do not invent text. Must fit the macOS window size. Handoff: handoffs/ui-programmer/<date>-T143.json.\", \"owner_note\": \"Owner approved 2026-11-02. Added by main session; producer to confirm.\"}, {\"task_id\": \"T144\", \"title\": \"Economy: route upgrade numbers and lane cap (feature proposal 3, approved 2026-11-02)\", \"owner_agent\": \"economy-designer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 20, \"window\": \"Economy lane. Start first; T145 waits on it.\", \"brief\": \"Owner approved proposal 3 in principle (design/proposals/2026-11-02-first-pass.md). Set the numbers for a route upgrade (level 2, margin bonus) that a full lane offers in place of one more ship. Existing keys upgrade_cost (600) and upgrade_margin_bonus (0.25) in data/balance.json are unread by code today. Check their interaction with B3, permits and ship price 900, and the permit-path pacing from T137. Run tools/sim.py for decent, sloppy, always-expand and never-expand. Targets as in your agent file. Report whether always-expand and decent still play identically, and whether the upgrade changes that. Handoff: handoffs/economy-designer/<date>-T144.json.\", \"owner_note\": \"Owner approved 2026-11-02. Added by main session; producer to confirm.\"}, {\"task_id\": \"T145\", \"title\": \"Route upgrade: full lane offers upgrade instead of one more ship (feature proposal 3)\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [\"T144\"], \"status\": \"done\", \"turn_cap\": 40, \"window\": \"Gameplay lane. Start after T144 numbers are set.\", \"brief\": \"Owner approved proposal 3. When a lane is full (lane cap binds), the route offers \\\"Upgrade route\\\" (level 2, margin bonus using the values set in T144) instead of an extra ship. Use the existing route level field and upgrade keys in data/balance.json. Ships and upgrades compete for the same cash. Keep all existing route rules. The UI button is added by ui-programmer as a follow-up task. Add a headless test that a full lane gets the upgrade and the margin rises. Handoff: handoffs/gameplay-programmer/<date>-T145.json. Numbers from T144 (done): upgrade_cost 900 (was 600), upgrade_margin_bonus 0.25 unchanged. Only a level 2 upgrade is tuned. Note: the economy designer's sim (tools/sim.py --real --upg) shows always-expand and decent still tie at cycle 25; that is a separate open item.\", \"owner_note\": \"Owner approved 2026-11-02. Added by main session; producer to confirm.\"}, {\"task_id\": \"T146\", \"title\": \"Feature designer: ideas to make trade mechanics more interesting (owner request 2026-11-02)\", \"owner_agent\": \"feature-designer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 25, \"window\": \"Design lane, no code. Runs alongside the gameplay and UI tasks.\", \"brief\": \"Owner request 2026-11-02: think about how to make trade mechanics more interesting. Read state.md, the trade section of gdd.md (grep for route, order, price, margin, saturation, event), the latest QA summary under qa/reports/, and design/proposals/2026-11-02-first-pass.md so you do not repeat it. Write up to 5 ranked proposals, each with the player's new choice, risk, and owner agent and size. Mechanics only: no code, no numbers, no story text. Write design/proposals/2026-11-02-trade-mechanics.md and handoffs/feature-designer/2026-11-02-T146.json. The owner approves; nothing is built from this task.\", \"owner_note\": \"Owner request 2026-11-02. Added by main session; producer to confirm.\"}, {\"task_id\": \"T147\", \"title\": \"Route upgrade: planet route panel button, shown only on a full lane (follow-up to T145)\", \"owner_agent\": \"ui-programmer\", \"depends_on\": [\"T145\"], \"status\": \"done\", \"turn_cap\": 15, \"window\": \"UI lane. Small. Start after T145.\", \"brief\": \"Follows T145. Add an \\\"Upgrade route\\\" button, shown only on a full lane (where the lane cap binds, so the route offers an upgrade in place of one more ship). Show the cost (upgrade_cost, 900) and the margin bonus, and show it as taken once the route is level 2. Reuse existing StoryText ids where possible; flag any new ids for the story-designer. Handoff: handoffs/ui-programmer/<date>-T147.json.\", \"owner_note\": \"Added by main session 2026-11-02 for the approved route upgrade (proposal 3).\"}, {\"task_id\": \"T149\", \"title\": \"Content depth in system 1: more planets and goods, and event follow-ups\", \"owner_agent\": \"feature-designer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 15, \"window\": \"Design lane. Proposal first; no data or code changes until the owner approves the count.\", \"brief\": \"System 1 has 3 planets and 2 goods; events are rare notices with little follow-up. Propose a costed set: how many planets and goods to add to system 1, and which events should get a follow-up (a second notice or a choice with a visible result later). Check against the existing planets.json, goods and event data first. Write a proposal in design/proposals/ dated 2026-11-02. Do not change balance numbers or write code. Handoff: handoffs/feature-designer/2026-11-02-T149.json with the proposal path and open questions for the owner.\", \"owner_note\": \"Owner: content is thin. Decide the count with the owner before any data work, which will be a new task. Goods part absorbed by goal trade-goods-asteroid-mining (T152-T161); keep only planets and follow-up events here unless the owner says otherwise.\"}, {\"task_id\": \"T163\", \"title\": \"Routes drawn on top of each other: separate overlapping routes\", \"owner_agent\": \"ui-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 35, \"window\": \"Owner request 2026-11-05 (after goal ship-ceo-skills-resources). Not started: main session sets it running.\", \"brief\": \"Some routes appear as a double line, one on top of another (for example A to B and B to A, or routes sharing a corridor). Find how the map draws routes (game/map.gd and the route drawing code), separate them with a small sideways offset per overlapping pair so each stays selectable and readable. Do not change route_offset.gd cost rules unless needed. Add a headless test where possible; screenshot check in a windowed run. Handoff handoffs/ui-programmer/2026-11-05-T163.json.\"}, {\"task_id\": \"T164\", \"title\": \"Routes pass through the sun: route around it\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 40, \"window\": \"Owner request 2026-11-05 (after goal ship-ceo-skills-resources). Not started: main session sets it running.\", \"brief\": \"Some routes are drawn straight through the sun of the system. Treat the sun as an obstacle in the route path and in game/route_offset.gd (it already bends round planets and crossing routes): the drawn path and the offset cost must both go round the sun with a clearance. Keep the drawing and the cost on the same path. Add tests for a route across the sun position; check the saved route data stays valid. Handoff handoffs/gameplay-programmer/2026-11-05-T164.json.\"}, {\"task_id\": \"T165\", \"title\": \"Design: transfer of goods or cargo from one space station to another\", \"owner_agent\": \"feature-designer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 25, \"window\": \"Owner request 2026-11-05 (after goal ship-ceo-skills-resources). Not started: main session sets it running.\", \"brief\": \"Owner wants a transfer mechanic from one space station to another. Propose a concrete costed design: what is moved (stock from Space Storage, ships, cash?), cost and time, limits, unlock rule in data/availability.json, how it fits market share and the resource audit (design/proposals/2026-11-05-resource-final.md). Write design/proposals/2026-11-05-station-transfer.md and handoff handoffs/feature-designer/2026-11-05-T165.json. Owner decides before any build.\", \"owner_note\": \"Merged into T169: the design is design/proposals/2026-11-05-storage-link.md; pointer at design/proposals/2026-11-05-station-transfer.md. Build is T171; T166 is superseded.\"}, {\"task_id\": \"T166\", \"title\": \"Build: station-to-station transfer (after owner approves T165)\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [\"T164\"], \"status\": \"stopped\", \"turn_cap\": 50, \"window\": \"Owner request 2026-11-05 (after goal ship-ceo-skills-resources). Not started: main session sets it running.\", \"brief\": \"Build the approved design from design/proposals/2026-11-05-station-transfer.md: data in data/*.json and data/availability.json, logic, save fields (bump the save version), panel hooks. UI layout goes to ui-programmer, texts to story-designer (English and Russian). Handoff handoffs/gameplay-programmer/2026-11-05-T166.json.\", \"owner_note\": \"Superseded by T171 (storage link build).\"}, {\"task_id\": \"T167\", \"title\": \"Planet name label drawn under the screen-space blur layer: put it on top\", \"owner_agent\": \"ui-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 25, \"window\": \"Owner request 2026-11-05 (after goal ship-ceo-skills-resources). Not started: main session sets it running.\", \"brief\": \"The planet name label shows below the screen-space blur layer, so it looks blurred or dimmed. It must draw above the blur. Find the blur layer (CanvasLayer or full-screen shader rect) and the planet label nodes (game/map.gd and the planet label code), fix the layer or z-order so names sit on top without changing the blur on the map. Check other labels (route labels n be dropped or merged.\"}, {\"task_id\": \"T171\", \"title\": \"Build: storage link between space stations\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [\"T169\"], \"status\": \"done\", \"turn_cap\": 50, \"window\": \"Owner request 2026-11-05 (later). Not started: main session sets it running.\", \"brief\": \"UI goes to ui-programmer, texts to story-designer (English and Russian). Replaces T166. Handoff handoffs/gameplay-programmer/2026-11-05-T171.json.\", \"owner_note\": \"Built: engine (game/storage_link.gd), save v7, availability rule storage_link, UI in space_storage_view.gd and galaxy_view.gd, English texts SS_LINK_*. Numbers are the proposal's placeholders (T170 not run). Russian for SS_ ids not in scope. Handoffs: gameplay-programmer, story-designer, ui-programmer 2026-11-05-T171.json.\"}, {\"task_id\": \"T172\", \"title\": \"Skill tree: propose more skills to fill the tree\", \"owner_agent\": \"feature-designer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 40, \"window\": \"Owner request 2026-11-05 (later). Not started: main session sets it running.\", \"brief\": \"Fill the skill tree with more skills (data/skills.json, 31 nodes now, see design/proposals/2026-11-05-*.md and gdd-skills.md). Find empty slots or thin branches (Military, Luxury, Minerals, Biotech and any general branch) and propose new nodes with effect, cost and which gap each fills. Use only the existing effect vocabulary unless a new type is argued. Each skill must be put to the economy-designer and qa-analyst by the main session and only kept when they agree it adds balance or interest, as in goal ship-ceo-skills-resources. Write design/proposals/2026-11-05-more-skills.md and handoff handoffs/feature-designer/2026-11-05-T172.json.\"}, {\"task_id\": \"T174\", \"title\": \"Skill tree: texts (English and Russian) and code for the new skills\", \"owner_agent\": \"story-designer\", \"depends_on\": [\"T172\"], \"status\": \"done\", \"turn_cap\": 35, \"window\": \"Owner request 2026-11-05 (later). Not started: main session sets it running.\", \"brief\": \"Write names and descriptions in story/skills.md and story/ru/skills.json for the approved new skills, no hidden goods named; run python3 tools/build_story.py. Any new effect type needs gameplay-programmer code in game/skills.gd first. Handoff handoffs/story-designer/2026-11-05-T174.json.\"}, {\"task_id\": \"T175\", \"title\": \"Cinderrest and similar planets: planet-style panel with mining instead of buying\", \"owner_agent\": \"ui-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 40, \"window\": \"Owner request 2026-11-05 (later). Not started: main session sets it running.\", \"brief\": \"Cinderrest and the other mining-type planets (find them in data/planets.json by type or by the cluster/mining flag; list them in the handoff) should open a panel that looks and behaves like the normal planet panel (game/planet_panel.gd), but where the buy side is replaced by mining: show what the planet yields, the yield per trip or cycle, risk, and a Mine action or order instead of Buy prices and amounts. Reuse the planet panel layout and the existing mining or cluster logic (game/clusters.gd, route_engine.gd) and do not add new rules; if a rule is missing, report it for gameplay-programmer. Follow the availability rule: show only goods allowed by data/availability.json, and texts need ids in story/*.md plus Russian in story/ru. Run sh tools/tests/run.sh; screenshot check in a windowed run. Handoff handoffs/ui-programmer/2026-11-05-T175.json.\"}, {\"task_id\": \"T176\", \"title\": \"Placeholders for 3 more solar systems\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 45, \"window\": \"Owner request 2026-11-05 (later). Not started: main session sets it running.\", \"brief\": \"Add placeholder data for 3 more solar systems after the existing ones (system 1 is in data/planets.json, later systems are in data/systems.json; system 3 was on hold with no entry, so pick the next free ids; check game/map.gd view_system and the galaxy overview for how systems are stored and chosen). Each placeholder: a system id and name, a sun, a map position in the galaxy overview, a few placeholder planets with temporary names and prices, and an entry in data/availability.json so nothing shows before it should (progressive disclosure: hidden until a visible_when is true, and locked behind a placeholder permit or unlock cycle that is off for now). Keep names and texts as text ids (English in story/*.md, Russian placeholder in story/ru), no hidden goods named. Make the galaxy overview and system switching handle 6 systems without errors, mark all placeholder data clearly (a placeholder flag or note field) so economy-designer and story-designer can replace it later. Handoff handoffs/gameplay-programmer/2026-11-05-T176.json.\", \"note\": \"Placeholder systems 3-5 in data/systems_placeholder.json (off by default, placeholder:true), availability rules never true, English texts only. Permit keys reuse permit_2_*; Russian not added.\"}, {\"task_id\": \"T177\", \"title\": \"Design: pilotable ship, discovery by flying, trading posts and mining platforms\", \"owner_agent\": \"feature-designer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 45, \"window\": \"Owner request 2026-11-05 (later). Not started: main session sets it running.\", \"brief\": \"Owner spec: the ship the player chose at New Game (data/ships.json, 3D model in assets/ships) becomes a pilotable 3D ship on the map. The player clicks a planet, space storage, asteroid field or a point on the map and the ship flies there. When the game is paused the ship does not fly. Discovery: from now on a planet is closed until the ship has flown there; the story reason is that a trading post has to be established there. Dead planets like Cinderrest work the same way, but the player establishes a mining platform, which allows mining and 'send to' of the resources. Events are tied to establishing trading posts. Propose the rules: flight speed and travel time in cycles, how pause and game speed interact, what happens to the ship's existing route duty while it flies (is it one of the fleet or a separate scout?), cost and time to establish a trading post and a mining platform, what a post unlocks (buying, selling, routes, storage), what is known at start (system 1 home planet, which others are closed), how closed planets look on the map (unknown, no name, no goods: availability rule), flight to other systems and permits, danger and events on the way, how this interacts with the win condition, market share and the existing QA bots (they must still be able to play: say how). Write design/proposals/2026-11-05-ship-flight-discovery.md and handoff handoffs/feature-designer/2026-11-05-T177.json. Owner decides before any build.\"}, {\"task_id\": \"T178\", \"title\": \"Economy: numbers for flight time, trading post and mining platform costs\", \"owner_agent\": \"economy-designer\", \"depends_on\": [\"T177\"], \"status\": \"queued\", \"turn_cap\": 30, \"window\": \"Owner request 2026-11-05 (later). Not started: main session sets it running.\", \"brief\": \"Set numbers for T177 in data/balance.json (new keys, bump data_version): flight speed, post and platform cost (goods or cash), time to establish. Handoff handoffs/economy-designer/2026-11-05-T178.json.\"}, {\"task_id\": \"T179\", \"title\": \"Build: ship movement, click-to-fly, pause, discovery state and save\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [\"T177\", \"T178\"], \"status\": \"done\", \"turn_cap\": 60, \"window\": \"Owner request 2026-11-05 (later). Not started: main session sets it running.\", \"brief\": \"Build the approved T177 design with T178 numbers: ship position and flight state in the game state and the save (bump the save version), click targets (planet, space storage, asteroid, map point), arrival handling, flight stops on pause, discovered T181\", \"title\": \"Story: events and texts for establishing trading posts and mining platforms\", \"owner_agent\": \"story-designer\", \"depends_on\": [\"T177\"], \"status\": \"done\", \"turn_cap\": 40, \"window\": \"Owner request 2026-11-05 (later). Not started: main session sets it running.\", \"brief\": \"Write events for establishing trading posts (arrival, local officials, a snag, a bargain, a rival already there) and for mining platforms on dead planets (crew, collapse, a find), plus all new UI texts, in story/*.md and Russian in story/ru/*.json, then python3 tools/build_story.py. Texts must not name hidden goods; the mechanics (effects, conditions) come from the T177 design and the events use game/conditions.gd atoms. Handoff handoffs/story-designer/2026-11-05-T181.json.\"}, {\"task_id\": \"T182\", \"title\": \"QA: flight, discovery and trading post runs with bots\", \"owner_agent\": \"qa-analyst\", \"depends_on\": [\"T179\", \"T180\", \"T181\"], \"status\": \"queued\", \"turn_cap\": 40, \"window\": \"Owner request 2026-11-05 (later). Not started: main session sets it running.\", \"brief\": \"Run the bots (qa/bots) over 6 seeds and the CEO and ship combos: check the game can still be won, discovery and posts do not soft-lock (no open planet reachable), pause stops the ship, flights to every target type work, saves round-trip mid-flight, no dominant strategy (fast-expand versus stay home). Report in qa/reports/2026-11-05-ship-flight.md and handoff handoffs/qa-analyst/2026-11-05-T182.json. Do not fix code.\"}, {\"task_id\": \"T183\", \"title\": \"Fix: planets never hidden by availability, save version and migration tests\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 40, \"window\": \"Owner request 2026-11-05. Not started: main session sets it running.\", \"brief\": \"Fix the 15 failures from sh tools/tests/run.sh (2026-11-05). (a) Planet availability: at start only the home planet should be open, but planet_1, planet_2, planet_3 and dead_1 all show open, and for every planet rule (planet_1..3, dead_1, s2_p1..s2_p4, dead_2) 'condition false hides it' fails (game/availability.gd, planet rules in data). Check whether T179/T180 discovery and closed-planet flags changed the meaning of 'open' and update either the code or the test accordingly; hidden must mean not drawn and not tradable. (b) 'save: version 6' and 'migration: a v2 file loads migrated' fail, with 'Parse JSON failed. Error at line 0: Expected key' in the log: T179 bumped the save version, so fix the test expectation or the migration chain, whichever is wrong; old saves may be dropped (state.md standing rule) but the test must say so. Done when sh tools/tests/run.sh shows fail=0. Handoff handoffs/gameplay-programmer/2026-11-05-T183.json.\", \"owner_note\": \"From the owner's test run: 1900 pass, 15 fail.\", \"note\": \"Test-only fix (main session, 2026-11-05): discovery_enabled ships at 0, so _new_main(discovery=true) now sets it to 1 explicitly; save version expectations updated to 7. Game code unchanged. run.sh: pass=1915 fail=0.\"}, {\"task_id\": \"T184\", \"title\": \"Fix: clicking another planet's icon inside a planet panel closes the panel; add a regression test\", \"owner_agent\": \"ui-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 35, \"window\": \"Owner request 2026-11-05. Not started: main session sets it running.\", \"brief\": \"Bug: open a planet panel, then click another planet's icon inside that panel (game/planet_panel.gd): the panel closes. Expected: the panel switches to the other planet's UI. Fix it, and add a test in tools/tests/run_tests.gd so it is always checked: open planet A's panel, simulate the click on planet B's icon in it, assert the panel is open and shows B (not closed, not A); also cover panel-to-storage and panel-to-dead-planet icons and a click on the same planet. Handoff handoffs/ui-programmer/2026-11-05-T184.json.\", \"owner_note\": \"Owner asked for an assertion or unit test so it never happens again; a headless test in the suite is the better choice (runs on every sh tools/tests/run.sh).\", \"note\": \"Root cause: Thumb/RouteRow emitted pressed before accept_event, panel rebuild removed the icon, click leaked to map and hid panel. Fixed order; test _test_panel_thumb_switch added.\"}, {\"task_id\": \"T185\", \"title\": \"Fix the space station 3D model\", \"owner_agent\": \"fx-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 30, \"window\": \"Owner request 2026-11-05. Not started: main session sets it running.\", \"brief\": \"The space station model looks wrong (find it under assets/ and where it is loaded, e.g. game/map.gd or the storage code; ask the owner for specifics only if the fault is not visible from the model: check scale, origin and pivot, rotation, normals, materials and missing textures). Fix the model or its loading and keep the frame budget. If the model file must be regenerated by a tool, change the tool, not the output. Handoff handoffs/fx-programmer/2026-11-05-T185.json.\", \"owner_note\": \"The owner did not say what is wrong with it: confirm in play after the fix.\", \"note\": \"Done 2026-11-05: station.gd MODEL_PATH pointed to a renamed glb; path fixed. Size/brightness at default zoom left as owner visual decision. Handoff handoffs/fx-programmer/2026-11-05-T185.json.\"}, {\"task_id\": \"T186\", \"title\": \"Raise the ship cap to 20\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 20, \"window\": \"Owner request 2026-11-05. Not started: main session sets it running.\", \"brief\": \"Set ship_cap to 20 (data/balance.json, bump data_version; find every hard-coded 5 or old cap in game/, the ship panel, route lists, save and tests, and the tutorial and story texts that name the cap via python3 tools/build_story.py sources). Make sure UI lists of ships still fit at 20 (scroll or compact rows; ui-programmer if layout needs work ols/tests/run.sh): for every pair of node types (planet, space storage, dead planet, asteroid field), in the same system and across systems, build a link with the game's own link function (route, storage link, mining platform) from a start state plus the needed unlocks, and assert it is created, saved and loaded back, and is not rejected for a stale reason (range, cap, closed flag, missing unlock that the game allows). Also assert from the start state that every node can be reached by some chain of allowed links, so no node is stranded. Fix code bugs the test finds. Handoff handoffs/gameplay-programmer/2026-11-05-T188.json.\", \"owner_note\": \"Owner asked for a test or assertion that connections can always be established.\", \"note\": \"Added _test_links_everywhere in run_tests.gd (all node-type pairs, same and cross system, save/load, reachability). No game bugs found. Asteroid-asteroid has no link and storage is never a route source: treated as design, owner may revisit.\"}, {\"task_id\": \"T189\", \"title\": \"Decide: Storage Link and Rival ships need a first playtest\", \"owner_agent\": \"feature-designer\", \"brief\": \"Storage Link (game/storage_link.gd) is 'built, not yet run in play' per gdd-skills.md; rival ships (T187) look unreviewed. Owner plays both, then decides keep/retune/look. needs owner decision.\", \"owner_note\": \"Owner playtest, no agent can judge feel.\", \"depends_on\": [], \"status\": \"queued\", \"turn_cap\": 30, \"window\": \"Gap analysis 2026-11-05 (overnight). Needs owner decision before start.\", \"note\": \"\"}, {\"task_id\": \"T190\", \"title\": \"Decide: asteroid-asteroid links and storage as route source\", \"owner_agent\": \"gameplay-programmer\", \"brief\": \"T188 test found no asteroid-asteroid link and storage never a route source. Owner chooses: add, or document as design in gdd.md. needs owner decision.\", \"owner_note\": \"\", \"depends_on\": [], \"status\": \"queued\", \"turn_cap\": 30, \"window\": \"Gap analysis 2026-11-0  \"Owner request 2026-11-05 (playtest feedback). Not started: main session sets it running.\", \"brief\": \"Owner: remove the Competitors entry from the main menu (title screen menu; the Competitors screen was added with Four Markets, find it in game/ and the menu code). Remove only the main-menu button and anything that opens the screen from there; keep competitor data and rival logic. If the in-game menu also has it, ask nothing: leave that and list it in the handoff. Update gdd.md line if it names the menu. Handoff handoffs/ui-programmer/2026-11-05-T194.json.\", \"note\": \"Removed Competitors button from the in-game menu (game/game_menu.gd). Competitors panel still opens from the share panel button (L) and key; left as is, owner may want that removed too. No handoff (done by main session).\"}, {\"task_id\": \"T195\", \"title\": \"Lower the voice narrator volume by default\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 15, \"window\": \"Owner request 2026-11-05 (playtest feedback). Not started: main session sets it running.\", \"brief\": \"Owner: the voice narration is too loud. Lower its default volume (Voice autoload and Settings screen, game/voice*.gd or settings code; find the default volume constant or setting, also the saved-settings default for new installs). Pick about 50 percent of the current default, keep the Settings slider working, and do not override a value a player already saved. Handoff handoffs/gameplay-programmer/2026-11-05-T195.json.\", \"note\": \"game/voice.gd: DEFAULT_VOLUME 0.5 (was 1.0) for new installs; saved value kept; slider unchanged.\"}, {\"task_id\": \"T196\", \"title\": \"Ship movement: acceleration, deceleration, yaw turning and a steady course (player and rival ships)\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 40, \"window\": \"Owner request 2026-11-05 (playtest feedback). Not started: main session sets it running.\", \"brief\": \"Owner: ships fly with no acceleration and the rival ships wander a little at random. Build proper motion for the player's Pathfinder (game/pathfinder.gd) and the rival ships (game/rival_ships.gd): speed ramps up from rest and brakes before the target (arrive and stop), the heading turns at a limited yaw rate toward the course instead of snapping, the ship flies a straight course to the target once aligned, and rivals pick a destination and fly to it steadily (no random jitter; wait, then pick the next one). Motion runs on the game clock: paused means no movement and no turning. Keep the save round-trip working (flight state saved mid-flight, bump the save version if the format changes, old saves may be dropped). Put speed, acceleration and turn-rate numbers in data/balance.json as new keys with a data_version bump (placeholders; the economy designer does not retune them here). Handoff handoffs/gameplay-programmer/2026-11-05-T196.json.\", \"note\": \"Built 2026-11-05: game/ship_motion.gd shared step; accel/brake/yaw for Pathfinder and rivals; 7 balance keys (data_version 57); save v8. Debug menu listing of keys not checked.\"}, {\"task_id\": \"T197\", \"title\": \"Ship model orientation: ships fly sideways\", \"owner_agent\": \"ui-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 25, \"window\": \"Owner request 2026-11-05 (playtest feedback). Not started: main session sets it running.\", \"brief\": \"Owner: ships fly sideways. Fix the 3D model forward axis for the player's ship and the rival ships (game/pathfinder_view.gd, game/rival_ships.gd, model loading as in game/ship_setup.gd): the nose must point along the heading (the direction of travel), with yaw following the course from T196. Check the corvette models in assets/ships for their own forward axis and correct it in code (a per-model yaw offset constant is fine), not by editing model files by hand. Handoff handoffs/ui-programmer/2026-11-05-T197.json.\", \"note\": \"Per-model yaw offset MODEL_YAW_DEG in game/ships.gd (all -90, inferred from vertices; ship_corvette_01 least certain: flip to 90 if backwards). Not seen windowed.\"}, {\"task_id\": \"T198\", \"title\": \"Ship trails and ship size\", \"owner_agent\": \"juice-programmer\", \"depends_on\": [\"T197\"], \"status\": \"done\", \"turn_cap\": 25, \"window\": \"Owner request 2026-11-05 (playtest feedback). Not started: main session sets it running.\", \"brief\": \"Owner: ships have no trails, and they are probably too big. Add an engine trail behind the player's ship and the rival ships (fading line or particles, short, cheap in the frame budget, off while paused), in a different tint for the player and for rivals. Reduce the ship scale on the map (put the scale in one constant per ship kind; target a noticeably smaller ship, about half, and note the value in the handoff so the owner can adjust). Handoff handoffs/juice-programmer/2026-11-05-T198.json.\", \"note\": \"Built 2026-11-05: game/ship_trail.gd, ship scale 0.5 (PLAYER_SHIP_SCALE, RIVAL_SHIP_SCALE), SHIP_PICK_PX 20. Not seen windowed; owner to check look.\"}, {\"task_id\": \"T199\", \"title\": \"Rival ships: mark them, click to see which competitor\", \"owner_agent\": \"ui-programmer\", \"depends_on\": [\"T196\"], \"status\": \"done\", \"turn_cap\": 30, \"window\": \"Owner request 2026-11-05 (playtest feedback). Not started: main session sets it running.\", \"brief\": \"Owner: rival ships are not marked and the player cannot tell what they are. Give every rival ship an owner: the competitor it belongs to (the three rivals in data, e.g. Harrow Combine, Velvet Concord, Ostrel Syndicate; check the actual names in data/ and story text) and show it with a small marker or tint per competitor. Clicking a rival ship shows a small card with the competitor's name and its market (use existing hover card style from tools/tests hover cards / game code). The ship must not block clicks on planets behind it. Texts go through story/*.md ids and Russian story/ru/*.json, then python3 tools/build_story.py. Handoff handoffs/ui-programmer/2026-11-05-T199.json.\", \"note\": \"Built 2026-11-06: per-competitor tint (RivalShips.TINTS), click within 20px opens game/rival_card.gd with name and strongest market; tests pass. Look and colours not seen windowed.\"}, {\"task_id\": \"T200\", \"title\": \"Ship controls: select the ship, left-click flies at once, right-click opens the action menu\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [\"T196\"], \"status\": \"done\", \"turn_cap\": 40, \"window\": \"Owner request 2026-11-05 (playtest feedback). Not started: main session sets it running.\", \"brief\": \"Owner's control design. (1) The player selects the ship (click it; show a selected look). (2) With the ship selected, a LEFT click on a planet, space storage, asteroid field or a point in space sends it there at once; no confirm dialog (remove the current 'fly here?' question). (3) A RIGHT click on a planet, storage, asteroid, dead planet or other action object opens a small context menu with the actions that object allows for the ship: establish a trading post, establish a mining platform, establish an outpost and so on (use the existing post/platform rules from game/pathfinder.gd; show an action only when it is allowed, hidden means not drawn; the Availability rule applies). Choosing an action starts the flight automatically (no further click or confirm) and the ship establishes it on arrival. (4) Esc or clicking empty space deselects. Update the tutorial and help texts that describe the old controls (story/*.md and story/ru/*.json, then python3 tools/build_story.py). Handoff handoffs/gameplay-programmer/2026-11-05-T200.json; ui-programmer does any panel or menu layout. Update 2026-11-05 (owner): establishing an outpost (trading post or mining platform) is almost instant: on arrival it completes within a moment (about a second or two of game time) instead of the build cycles now in data/balance.json (post_first_build_cycles, post_build_cycles, platform_build_cycles in game/pathfinder.gd); set those keys to the near-instant value, bump data_version, and keep the build state and save working. The cost of a post or platform stays as it is.\", \"note\": \"2026-11-05: ship select (cyan ring), left click flies at once, right click menu on planets with allowed action, Esc/right-click space deselects; outposts build in 0.025 cycles (data_version 58); tutorial texts updated. Open: no Fly-here item on storage/asteroids, selected look and menu style for owner.\"}, {\"task_id\": \"T201\", \"title\": \"Test: ships are rotated to face their heading\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [\"T197\"], \"status\": \"done\", \"turn_cap\": 25, \"window\": \"Owner request 2026-11-05. Not started: main session sets it running.\", \"brief\": \"Add a headless test in tools/tests/run_tests.gd (runs with sh tools/tests/run.sh) that the 3D ships face the way they fly, so 'ships fly sideways' can never come back. For the player's Pathfinder (game/pathfinder_view.gd) and the rival ships (game/rival_ships.gd), and for every corvette model in assets/ships that the game can show: set a known heading (at least 8 directions: along +X, -X, +Z, -Z and the four diagonals, and a heading in a second solar system if its map differs), step the ship's update, then take the model node's global basis, compute its nose (forward) vector using the model's declared forward axis (the per-model yaw offset from T197) and assert it matches the heading within about 2 degrees; assert the model's up axis stays up (no roll or pitch); assert a turn toward a new course changes the nose gradually at the yaw rate from T196 (not a snap) and finishes aligned; assert a stopped or paused ship keeps its last heading. Also assert that each model's forward axis data exists for every ship id in data/ships.json so a new model cannot be added without one. Fix code bugs the test finds. Handoff handoffs/gameplay-programmer/2026-11-05-T201.json.\", \"owner_note\": \"Owner asked for an assertion or unit test for ship rotation; headless test chosen so it runs on every sh tools/tests/run.sh.\", \"note\": \"2026-11-05: _test_ship_facing added in run_tests.gd (8 headings, up axis, gradual turn, resting ships, yaw data per ship id); no code bugs found; second-system heading covered via all rival systems only.\"}, {\"task_id\": \"T202\", \"title\": \"Test: ships spawn near a planet, never inside it\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [\"T196\"], \"status\": \"done\", \"turn_cap\": 25, \"window\": \"Owner request 2026-11-05. Not started: main session sets it running.\", \"brief\": \"Add a headless test in tools/tests/run_tests.gd (runs with sh tools/tests/run.sh) that no ship is placed inside a planet, but near it. Cover every spawn path: the player's Pathfinder at New Game (home planet), after loading a save, after a ship arrives at or leaves a planet, space storage and an asteroid field, and the rival ships at start and when they pick a new course. For each position assert: (1) the distance to the centre of every planet (and dead planet, station, asteroid field) is greater than that body's radius plus a small margin (use the radius the map really draws, not a guess), so the ship is outside it; (2) at spawn the ship is within a 'near' limit of its parent body (radius plus a spawn gap constant, put the limit in one named constant and reuse it in the game code); (3) the same holds in every solar system, including the placeholder systems 3-5 when enabled, and when the map is zoomed or the system view differs. Fix any code bug the test finds (an offset constant in game/pathfinder.gd or game/rival_ships.gd is fine). Handoff handoffs/gameplay-programmer/2026-11-05-T202.json.\", \"owner_note\": \"Owner asked for an assertion or unit test that the ship is not spawned inside the planet but near it.\", \"note\": \"Test _test_ships_spawn_near_bodies added; fixed Pathfinder docking at planet centre, rival spawn inside bodies, old-save centre positions, rivals in later systems. Motion.BODY_MARGIN/SPAWN_GAP in ship_motion.gd.\"}, {\"task_id\": \"T203\", \"title\": \"Juice: establishing a trading post, plus 3 juice tasks of the agent's own choice\", \"owner_agent\": \"juice-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 35, \"window\": \"Owner request 2026-11-05 (playtest). Not started: main session sets it running.\", \"brief\": \"Owner: add juice when the ship establishes a trading post or mining platform (arrival burst, build-up sparkle or ring on the planet, a short count-up or pop of the new post marker, a soft screen nudge; game/pathfinder_view.gd and the post code; cheap in the frame budget, nothing animates while time is paused, no text without story ids). Then look at the game for where juice is thin or an existing effect is broken or rough (trails, notices, panels, route lines, events) and ADD 3 NEW TASKS FOR YOURSELF to schedule.json (task ids continuing the numbering, owner_agent juice-programmer, status queued, same fields as other tasks, one small run each, say in each brief why it matters). Do not start those 3 tasks in this run. Handoff handoffs/juice-programmer/2026-11-05-<this task id>.json listing the 3 task ids.\", \"note\": \"2026-11-06: establish beat (ring, spokes, label pop, nudge) built; follow-ups T219-T221 queued. Not seen windowed.\"}, {\"task_id\": \"T204\", \"title\": \"Ship selected: left-click on empty space drops the selection\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 15, \"window\": \"Owner request 2026-11-05 (playtest). Not started: main session sets it running.\", \"brief\": \"Owner: with the ship selected, a LEFT click on empty space (not a planet, storage, asteroid field or other action object) must only drop the selection; the ship does not fly there. This replaces the 'point in space' target of T200 (left click flies only to objects). Clicks on objects keep flying at once, right click keeps the action menu, Esc still deselects. Update tutorial or help texts that say the ship flies to a point in space (story/*.md and story/ru/*.json, then python3 tools/build_story.py) and the test for the controls in tools/tests/run_tests.gd. Handoff handoffs/<agent>/2026-11-05-<id>.json.\", \"note\": \"game/map.gd: left click on empty space with ship selected now only deselects (no point flight). No story text mentioned point flight. No new test (map input not headless-testable); tests pass=4017 fail=0.\"}, {\"task_id\": \"T205\", \"title\": \"Trails come out of the engines and are thicker\", \"owner_agent\": \"juice-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 25, \"window\": \"Owner request 2026-11-05 (playtest). Not started: main session sets it running.\", \"brief\": \"Owner: the ship trails do not start at the engines and are too thin. Anchor each trail to the ship model's engine exhaust position(s) (a per-model engine offset constant next to the per-model yaw offset from T197; corvette models in assets/ships, game/pathfinder_view.gd, game/rival_ships.gd), so it comes out of the back of the ship whatever the heading, and make it clearly thicker (about 2 to 3 times the current width, tapering to the end; keep the player and rival tints; off while paused). Note the width constants in the handoff so the owner can adjust. Handoff handoffs/<agent>/2026-11-05-<id>.json.\", \"note\": \"Trail is a tapered triangle-strip ribbon (ship_trail.gd WIDTH 0.16 world units at the engine, 0 at the end); starts at the engine point Ships.ENGINE_BACK[kind] (0.9 of footprint radius behind centre, per model, same for all four so far). Not seen windowed; owner: tune WIDTH and ENGINE_BACK per model.\"}, {\"task_id\": \"T206\", \"title\": \"Exploration mode: the ship scouts the planets of this solar system by itself and tells you when done\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 40, \"window\": \"Owner request 2026-11-05 (playtest). Not started: main session sets it running.\", \"brief\": \"Owner: add an exploration mode (a button or toggle by the ship controls; ui-programmer does layout if needed). When on, the Pathfinder flies by itself through every not yet discovered planet of the CURRENT solar system, discovers it and establishes the trading post or mining platform, using the existing flight, discovery and post rules (game/pathfinder.gd) and their costs; if cash is short it waits at the planet and continues when it can pay, and exploration stops at the system edge. The player can switch it off or give a manual order at any time, which ends the mode. It follows the game clock (paused means no movement). When every planet of the system is surveyed AND its post or platform is established, show one notification (notice queue) and switch the mode off. Notification and button texts as story ids (story/*.md, story/ru/*.json, then python3 tools/build_story.py). Save the mode state. Add a headless test: mode on visits all planets and ends with the notice once. Handoff handoffs/<agent>/2026-11-05-<id>.json.\", \"owner_note\": \"Built 2026-11-06: Explore button in Ships panel, Pathfinder.set_exploring, saved, notice once, test _test_t206_explore. Not seen windowed. Open: dead world without mining skill is skipped, mode idles; no Russian ids.\"}, {\"task_id\": \"T207\", \"title\": \"Skill tree: fill every empty skill slot, each skill argued for\", \"owner_agent\": \"feature-designer\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 40, \"window\": \"Owner request 2026-11-05 (playtest). Not started: main session sets it running.\", \"brief\": \"Owner: finish the skill tree so every slot is filled (data/skills.json has 31 nodes; see gdd-skills.md and design/proposals/2026-11-05-skill-tree-round*.md for the empty slots and thin branches in Military, Luxury, Minerals, Biotech and the general
