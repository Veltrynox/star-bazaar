<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Bazaar Studio</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--ink:#1b1d21;--mute:#6b7078;--line:#dcdcd6;--acc:#2b5fd9;--ok:#1f8a4c;--warn:#b7791f;--bad:#c0392b;
--mil:#c0563b;--lux:#9a4fc0;--min:#9a7a2b;--bio:#2f9150;--fnd:#3b6fc4}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1d2026;--ink:#e8e9ec;--mute:#9097a3;--line:#323741;--acc:#6b9bff;--ok:#4cc27f;--warn:#e0a84a;--bad:#ef6a5b;
--mil:#ef8a6e;--lux:#c79af0;--min:#d9b65a;--bio:#52c27a;--fnd:#6c9eef}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
nav{display:flex;gap:4px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
nav b{margin-right:12px}
nav button.tab{border:0;background:none;padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--mute);font:inherit}
nav button.tab.on{background:var(--card);color:var(--ink);border:1px solid var(--line)}
section.pane{display:none;flex:1;min-height:0}
section.pane.on{display:flex}
iframe{border:0;width:100%;height:100%;flex:1;background:var(--bg)}
button,select,input,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
button{cursor:pointer}button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
#sk{flex-direction:column;overflow:hidden}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--line)}
.bar .note{color:var(--warn);font-weight:600}
.bar .sp{margin-left:auto;color:var(--mute)}
.body{flex:1;display:flex;min-height:0}
#treewrap{flex:1;overflow:auto;padding:12px}
#side{width:380px;max-width:42vw;border-left:1px solid var(--line);overflow:auto;padding:12px 14px}
.btabs{display:flex;gap:6px;flex-wrap:wrap}
.btabs button.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
svg text{font:12px system-ui,sans-serif;fill:var(--ink)}
.node rect{fill:var(--card);stroke-width:2;cursor:pointer}
.node.sel rect{stroke-width:4}
.node.tech rect{stroke-dasharray:5 3}
.node.changed .nm{font-style:italic}
.node text.sub{fill:var(--mute);font-size:10.5px}
.edge{fill:none;stroke:var(--mute);stroke-width:1.6;opacity:.75}
.edge.long{stroke-dasharray:4 4}
.badge{font-size:10px;fill:var(--mute)}
h3{margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 2px}
#side input,#side select,#side textarea{width:100%}
#side textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
td,th{padding:3px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mute);font-weight:600}
.bad{color:var(--bad);font-weight:600}.ok{color:var(--ok)}.warn{color:var(--warn)}
.chip{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:99px;padding:0 7px;margin:1px 2px 1px 0;color:var(--mute)}
.empty-slot{font-size:12px;color:var(--mute)}
@media(max-width:800px){.body{flex-direction:column}#side{width:auto;max-width:none;border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<nav>
  <b>Star Bazaar Studio</b>
  <button class="tab on" data-p="tasks">Task board</button>
  <button class="tab" data-p="flow">Project workflow</button>
  <button class="tab" data-p="sk">Final skills (draft)</button>
  <button class="tab" data-p="ev">Event texts (draft)</button>
</nav>
<section class="pane on" id="tasks"><iframe id="f_tasks" title="Task board"></iframe></section>
<section class="pane" id="flow"><iframe id="f_flow" title="Project workflow"></iframe></section>
<section class="pane" id="sk">
  <div class="bar">
    <div class="btabs" id="btabs"></div>
    <button id="add">+ Node</button>
    <button id="open">Open draft…</button>
    <button id="save" class="primary">Save draft</button>
    <button id="reset">Reset to consensus</button>
    <span class="note" id="dirty"></span>
    <span class="sp" id="where">Draft only: never written to data/ or the game.</span>
  </div>
  <div class="body">
    <div id="treewrap"></div>
    <aside id="side"></aside>
  </div>
  <input type="file" id="pick" accept=".json,application/json" hidden>
</section>

<section class="pane" id="ev" style="flex-direction:column;overflow:hidden">
  <div class="bar">
    <select id="evview"><option value="main">Main text (title + body)</option><option value="all">All lines (with ids)</option></select>
    <input id="evq" placeholder="Search events" size="22">
    <label style="display:inline;margin:0"><input type="checkbox" id="evonly"> edited only</label>
    <button id="evopen">Open draft…</button>
    <button id="evsave" class="primary">Save draft</button>
    <button id="evreset">Reset</button>
    <span class="note" id="evdirty"></span>
    <span class="chip warn" title="Owner rule">English only: we ignore localisation (Russian) until the owner asks for a translation.</span>
    <span class="sp" id="evwhere">Draft only: the story agent reads the saved file; data/story_text.json is generated from story/*.md.</span>
  </div>
  <div class="body">
    <div id="evlist" style="width:300px;max-width:40vw;overflow:auto;border-right:1px solid var(--line);padding:8px"></div>
    <div id="evmain" style="flex:1;overflow:auto;padding:12px 16px"></div>
  </div>
  <input type="file" id="evpick" accept=".json,application/json" hidden>
</section>

h a deposit, or cash by the lot.", "max": 280, "place": "MIL_A1 choice screen body (one body)", "ru": "Адмиралтейство желает, чтобы гарнизон высокого кольца Ashgate воевал и дальше, а интендант Ханно Сулу желает, чтобы счета сходились. Он купил ваш первый груз. Однажды компания {bot1} прислала ему крашеный балласт под видом снарядов. Он предлагает постоянный контракт с залогом или оплату по каждой партии.", "title": "Sold by the lot"}, {"id": "EV_MIL_A1_OPA_BTN", "group": "EV_MIL_A1", "text": "Sign the contract", "max": 28, "place": "MIL_A1 button, opt_a", "ru": "Подписать контракт", "title": "Sold by the lot"}, {"id": "EV_MIL_A1_OPA_EFF", "group": "EV_MIL_A1", "text": "Get: Military volume up a little for a while. Cost: {cash_out} credits as the deposit to the garrison. Rivals: {bot1}'s Military growth falls a little.", "max": 200, "place": "MIL_A1 effect line, opt_a", "ru": "Получите: объём Military немного вырастет на какое-то время. Цена: {cash_out} кредитов в залог гарнизону. Соперники: у компании {bot1} growth на рынке Military немного снизится.", "title": "Sold by the lot"}, {"id": "EV_MIL_A1_OPA_RES_TITLE", "group": "EV_MIL_A1", "text": "The contract is signed", "max": 32, "place": "MIL_A1 result popup title, opt_a", "ru": "Контракт подписан", "title": "Sold by the lot"}, {"id": "EV_MIL_A1_OPA_RES", "group": "EV_MIL_A1", "text": "Sulo signed with a seal and kept {bot} as a second source, on probation. Orders now come on a schedule and the deposit cost you credits, so Military volume rises for a while. {bot}'s Military growth falls a little. Each crate is read a litany on the dock, and one rattled.", "max": 280, "place": "MIL_A1 result popup, opt_a; {bot} is bot_1", "ru": "Сулу подписал с печатью и оставил компанию {bot} вторым поставщиком, на испытательный срок. Заказы теперь идут по графику, а залог обошёлся в кредиты, поэтому объём Military на какое-то время растёт. У компании {bot} growth на рынке Military немного снизится. На причале каждому ящику читают IL_A1", "text": "{bot1}, Military: strength down a little.", "max": 90, "place": "MIL_A1 rival line 1, opt_b", "ru": "{bot1}, Military: strength немного ниже.", "title": "Sold by the lot"}, {"id": "EV_MIL_A1_OPB_STD2", "group": "EV_MIL_A1", "text": "{bot3}, Military: strength up a little.", "max": 90, "place": "MIL_A1 rival line 2, opt_b", "ru": "{bot3}, Military: strength немного выше.", "title": "Sold by the lot"}, {"id": "EV_MIL_A2_TITLE", "group": "EV_MIL_A2", "text": "Two fleets claim the same stock", "max": 40, "place": "MIL_A2 choice screen title", "ru": "Два флота требуют один и тот же запас", "title": "Orders filled by term"}, {"id": "EV_MIL_A2_BODY_A", "group": "EV_MIL_A2", "text": "Your contract holds. Two fleets, each sworn to a different estimate, order the same stock in one cycle, and the Admiralty wills both served first. {bot3} brokers between them and bills both. {bot1} serves one fleet. Fill orders in dock order, or by contract term.", "max": 280, "place": "MIL_A2 choice screen body after opt_a of MIL_A1", "ru": "Контракт действует. Два флота, каждый присягнувший своей смете, заказывают один и тот же запас в один цикл, и Адмиралтейство желает, чтобы обоих обслужили первыми. Компания {bot3} посредничает между ними и берёт плату с обоих. Один из флотов обслуживает компания {bot1}. Выдавайте заказы в порядке очереди на причале или по сроку контракта.", "title": "Orders filled by term"}, {"id": "EV_MIL_A2_BODY_B", "group": "EV_MIL_A2", "text": "The garrison has its cargo. Two fleets, each sworn to a different estimate, order the same stock in one cycle, and the Admiralty wills both served first. {bot3} brokers between them and bills both. {bot1} serves one fleet. Fill orders in dock order, or by contract term.", "max": 280, "place": "MIL_A2 choice screen body after opt_b of MIL_A1", "ru": "Гарнизон получил груз. Два флота, каждый присягнувший своей смете, заказывают один и тот же запас в один цикл, и Адмиралтейство желает, чтобы обоих обслужили первыми. Компания {bot3} посредничает между ними и берёт плату с обоих. Один из флотов обслуживает компания {bot1}. Выдавайте заказы в порядке очереди на причале или по сроку контракта.", "title": "Orders filled by term"}, {"id": "EV_MIL_A2_OPA_BTN", "group": "EV_MIL_A2", "text": "Fill orders by dock", "max": 28, "place": "MIL_A2 button, opt_a", "ru": "Выдать в порядке очереди", "title": "Orders filled by term"}, {"id": "EV_MIL_A2_OPA_EFF", "group": "EV_MIL_A2", "text": "Get: Military price up a little for a while. Cost: Ship upkeep rises a little for a while. Rivals: {bot3}'s Military growth falls a little.", "max": 200, "place": "MIL_A2 effect line, opt_a", "ru": "Получите: рынок Military немного подорожает на какое-то время. Цена: Ship upkeep немного вырастет на какое-то время. Соперники: у компании {bot3} growth на рынке Military немного снизится.", "title": "Orders filled by term"}, {"id": "EV_MIL_A2_OPA_RES_TITLE", "group": "EV_MIL_A2", "text": "Orders filled by dock", "max": 32, "place": "MIL_A2 result popup title, opt_a", "ru": "Заказы выданы по очереди", "title": "Orders filled by term"}, {"id": "EV_MIL_A2_OPA_RES", "group": "EV_MIL_A2", "text": "Orders went out in dock order, and each fleet was told the other had waited longer. The bidding lifts Military prices a little for a while, and two sets of berths raise Ship upkeep a little. {bot}, the go-between, is one messenger too many: its Military growth falls a little.", "max": 280, "place": "MIL_A2 result popup, opt_a; {bot} is bot_3", "ru": "Заказы ушли по очереди, и каждому флоту сказали, что другой ждал дольше. Флоты торгуются, поэтому цены на Military немного вырастут на какое-то время, а два комплекта причалов немного повысят Ship upkeep. Компания {bot}, посредник, стала лишним гонцом: её growth на рынке Military немного снизится.", "title": "Orders filled by term"}, {"id": "EV_MIL_A2_OPA_STD", "group": "EV_MIL_A2", "text": "{bot3}, Military: growth down a little.", "max": 90, "place": "MIL_A2 rival line 1, o t_a", "ru": "Схема раскрыта", "title": "The sensors are fitted"}, {"id": "EV_MIL_B1_OPA_RES", "group": "EV_MIL_B1", "text": "You sent the order, the price list and the cousin's name to the Bureau. It paid an informant's fee and froze half the refit berths for audit. Your ships stand in queues, so Ship upkeep rises for a while. {bot}'s Military strength falls sharply: the scheme ran on its berths.", "max": 280, "place": "MIL_B1 result popup, opt_a; {bot} is bot_1", "ru": "Вы отправили в Бюро приказ, прайс и имя двоюродного брата. Бюро выплатило награду за сообщение и заморозило половину причалов переоснастки на проверку. Ваши корабли стоят в очередях, поэтому Ship upkeep какое-то время растёт. У компании {bot} strength на рынке Military резко снизится: схема держалась на её причалах.", "title": "The sensors are fitted"}, {"id": "EV_MIL_B1_OPA_STD", "group": "EV_MIL_B1", "text": "{bot1}, Military: strength down sharply.", "max": 90, "place": "MIL_B1 rival line 1, opt_a", "ru": "{bot1}, Military: strength резко ниже.", "title": "The sensors are fitted"}, {"id": "EV_MIL_B1_OPB_BTN", "group": "EV_MIL_B1", "text": "Fit the sensors", "max": 28, "place": "MIL_B1 button, opt_b", "ru": "Поставить датчики", "title": "The sensors are fitted"}, {"id": "EV_MIL_B1_OPB_EFF", "group": "EV_MIL_B1", "text": "Get: Military volume up a little for the rest of the run. Cost: {cash_out} credits for the slips. Rivals: {bot3}'s Military growth falls a little.", "max": 200, "place": "MIL_B1 effect line, opt_b", "ru": "Получите: объём Military немного вырастет до конца партии. Цена: {cash_out} кредитов за стапели. Соперники: у компании {bot3} growth на рынке Military немного снизится.", "title": "The sensors are fitted"}, {"id": "EV_MIL_B1_OPB_RES_TITLE", "group": "EV_MIL_B1", "text": "The sensors are fitted", "max": 32, "place": "MIL_B1 result popup title, opt_b", "ru": "Датчики поставлены", "title": "The sensors are fitted"}, {"id": "EV_MIL_B1_OPB_RES", "group": "EV_MIL_B1", "text": "You pai e sample", "max": 28, "place": "BIO_A1 button, opt_a", "ru": "Изучить образец", "title": "The sample is sold"}, {"id": "EV_BIO_A1_OPA_EFF", "group": "EV_BIO_A1", "text": "Get: {n} units of tech progress at the Culture Lab. Cost: {cash_out} credits for the tests. Rivals: {bot2}'s Biotech growth falls a little.", "max": 200, "place": "BIO_A1 effect line, opt_a", "ru": "Получите: {n} единицы технологического прогресса в лаборатории Culture Lab. Цена: {cash_out} кредитов на испытания. Соперники: у компании {bot2} growth на рынке Biotech немного снизится.", "title": "The sample is sold"}, {"id": "EV_BIO_A1_OPA_RES_TITLE", "group": "EV_BIO_A1", "text": "The sample is studied", "max": 32, "place": "BIO_A1 result popup title, opt_a", "ru": "Образец изучен", "title": "The sample is sold"}, {"id": "EV_BIO_A1_OPA_RES", "group": "EV_BIO_A1", "text": "The lab worked behind two doors and logged every reading after dark. Tech progress came in, and the tests cost credits. {bot} had asked to buy the sample unseen, and its Biotech growth falls a little. Fitter Imre Fenn checked both doors twice. The vat took on a faint green.", "max": 280, "place": "BIO_A1 result popup, opt_a; {bot} is bot_2", "ru": "Лаборатория работала за двумя дверями и записывала каждое показание после темноты. Технологический прогресс засчитан, испытания обошлись в кредиты. Компания {bot} просила продать образец не глядя, и её growth на рынке Biotech немного снизится. Монтажник Имре Фенн дважды проверил обе двери. Чан слегка позеленел.", "title": "The sample is sold"}, {"id": "EV_BIO_A1_OPA_STD", "group": "EV_BIO_A1", "text": "{bot2}, Biotech: growth down a little.", "max": 90, "place": "BIO_A1 rival line 1, opt_a", "ru": "{bot2}, Biotech: growth немного ниже.", "title": "The sample is sold"}, {"id": "EV_BIO_A1_OPB_BTN", "group": "EV_BIO_A1", "text": "Sell the sample", "max": 28, "place": "BIO_A1 button, opt_b", "ru": "Продать образец", "title": "The sample is sold"}, {"id": "EV_BIO_A1_OPB_EFF", "group": "EV_BIO_A1", "text": "Get: {cash_in} credits now. Cost: Biotech price down a little for a few cycles. Rivals: {bot2}'s Biotech strength falls a little.", "max": 200, "place": "BIO_A1 effect line, opt_b", "ru": "Получите: {cash_in} кредитов сейчас. Цена: рынок Biotech немного подешевеет на несколько циклов. Соперники: у компании {bot2} strength на рынке Biotech немного снизится.", "title": "The sample is sold"}, {"id": "EV_BIO_A1_OPB_RES_TITLE", "group": "EV_BIO_A1", "text": "The sample is sold", "max": 32, "place": "BIO_A1 result popup title, opt_b", "ru": "Образец продан", "title": "The sample is sold"}, {"id": "EV_BIO_A1_OPB_RES", "group": "EV_BIO_A1", "text": "A broker took the canister the same day and paid cash. Buyers read the odd colour on the lid as a warning, so Biotech prices dip a little for a few cycles. {bot} was passed over, and its Biotech strength falls a little. Fenn asked where it went. The sample is fine, he was told.", "max": 280, "place": "BIO_A1 result popup, opt_b; {bot} is bot_2", "ru": "Брокер забрал ёмкость в тот же день и заплатил наличными. Странный цвет на крышке покупатели сочли предупреждением, поэтому цены на Biotech на несколько циклов немного упали. Компания {bot} осталась ни с чем, и её strength на рынке Biotech немного снизится. Фенн спросил, куда она ушла. Образец в порядке, ответили ему.", "title": "The sample is sold"}, {"id": "EV_BIO_A1_OPB_STD", "group": "EV_BIO_A1", "text": "{bot2}, Biotech: strength down a little.", "max": 90, "place": "BIO_A1 rival line 1, opt_b", "ru": "{bot2}, Biotech: strength немного ниже.", "title": "The sample is sold"}, {"id": "EV_BIO_A2_TITLE", "group": "EV_BIO_A2", "text": "A clinic asks to test a batch", "max": 40, "place": "BIO_A2 choice screen title", "ru": "Клиника просит испытать партию", "title": "The tests run at your lab"}, {"id": "EV_BIO_A2_BODY_A", "group": "EV_BIO_A2", "text": "Your lab studied the sample. Now Doctor Marrow of the clinic ring asks to draw a batch from your stock for testing on her ward, where volunteers are volunteers by rota. {bot2} supplies the other wards, and {bot3} wants the data. Fund the clinic's tests, or run them at your lab.", "max": 280, "place": "BIO_A2 choice screen body after opt_a of BIO_A1", "ru": "Ваша лаборатория изучила образец. Теперь доктор Марроу с клинического кольца просит взять партию из вашего запаса для испытаний в её палате, где добровольцев назначают по графику. Остальные палаты снабжает компания {bot2}, а компания {bot3} хочет получить данные. Оплатите испытания клиники или проведите их в своей лаборатории.", "title": "The tests run at your lab"}, {"id": "EV_BIO_A2_BODY_B", "group": "EV_BIO_A2", "text": "You sold the sample. Now Doctor Marrow of the clinic ring asks to draw a batch from your stock for testing on her ward, where volunteers are volunteers by rota. {bot2} supplies the other wards, and {bot3} wants the data. Fund the clinic's tests, or run them at your lab.", "max": 280, "place": "BIO_A2 choice screen body after opt_b of BIO_A1", "ru": "Вы продали образец. Теперь доктор Марроу с клинического кольца просит взять партию из вашего запаса для испытаний в её палате, где добровольцев назначают по графику. Остальные палаты снабжает компания {bot2}, а компания {bot3} хочет получить данные. Оплатите испытания клиники или проведите их в своей лаборатории.", "title": "The tests run at your lab"}, {"id": "EV_BIO_A2_OPA_BTN", "group": "EV_BIO_A2", "text": "Fund the clinic's tests", "max": 28, "place": "BIO_A2 button, opt_a", "ru": "Оплатить испытания клиники", "title": "The tests run at your lab"}, {"id": "EV_BIO_A2_OPA_EFF", "group": "EV_BIO_A2", "text": "Get: Biotech volume up a little for the rest of the run. Cost: {cash_out} credits toward the tests. Rivals: {bot3}'s Biotech growth falls a little.", "max": 200, "place": "BIO_A2 effect line, opt_a", "ru": "Получите: объём Biotech немного вырастет до конца партии. Цена: {cash_out} кредитов на испытания. Соперники: у компании {bot3} growth на рынке Biotech  prices rise a little for a while, and the lab stands idle for a few cycles. {bot}'s strains came from the weeping vat, and its Biotech strength falls a little. Fenn taped a note to the seal: told you.", "max": 280, "place": "BIO_A3 result popup, opt_a; {bot} is bot_2", "ru": "Вы остановили лабораторию и проверили все уплотнения. Запасов стало мало, поэтому цены на Biotech на какое-то время немного выросли, а лаборатория простаивала несколько циклов. Штаммы компании {bot} были из подтекавшего чана, и её strength на рынке Biotech немного снизится. Фенн приклеил к уплотнению записку: «Я предупреждал».", "title": "The stock is sold"}, {"id": "EV_BIO_A3_OPA_STD", "group": "EV_BIO_A3", "text": "{bot2}, Biotech: strength down a little.", "max": 90, "place": "BIO_A3 rival line 1, opt_a", "ru": "{bot2}, Biotech: strength немного ниже.", "title": "The stock is sold"}, {"id": "EV_BIO_A3_OPB_BTN", "group": "EV_BIO_A3", "text": "Sell the stock in that line", "max": 28, "place": "BIO_A3 button, opt_b", "ru": "Продать запасы линии", "title": "The stock is sold"}, {"id": "EV_BIO_A3_OPB_EFF", "group": "EV_BIO_A3", "text": "Get: {cash_in} credits now. Cost: Biotech volume down a little for a few cycles; {bot3} gains a little Biotech strength. Rivals: {bot2}'s Biotech strength falls clearly.", "max": 200, "place": "BIO_A3 effect line, opt_b", "ru": "Получите: {cash_in} кредитов сейчас. Цена: объём Biotech немного снизится на несколько циклов; у компании {bot3} немного вырастет strength на рынке Biotech. Соперники: у компании {bot2} strength на рынке Biotech заметно снизится.", "title": "The stock is sold"}, {"id": "EV_BIO_A3_OPB_RES_TITLE", "group": "EV_BIO_A3", "text": "The stock is sold", "max": 32, "place": "BIO_A3 result popup title, opt_b", "ru": "Запасы проданы", "title": "The stock is sold"}, {"id": "EV_BIO_A3_OPB_RES", "group": "EV_BIO_A3", "text": "You sold the stock in that line and cash arrived. The shelves stood bare for a few cycles, so Biotech volume dips. {bot3} bought ittle for a while. Cost: Biotech volume down a little for a while. Rivals: {bot2}'s Biotech growth falls clearly.", "max": 200, "place": "BIO_B2 effect line, opt_a", "ru": "Получите: рынок Biotech немного подорожает на какое-то время. Цена: объём Biotech немного снизится на какое-то время. Соперники: у компании {bot2} growth на рынке Biotech заметно снизится.", "title": "Sold as a new line"}, {"id": "EV_BIO_B2_OPA_RES_TITLE", "group": "EV_BIO_B2", "text": "The batch is relabelled", "max": 32, "place": "BIO_B2 result popup title, opt_a", "ru": "Этикетка партии сменена", "title": "Sold as a new line"}, {"id": "EV_BIO_B2_OPA_RES", "group": "EV_BIO_B2", "text": "You relabelled the batch and held it for study. The new line fetches a little more for a while, and your own volume dips a little as stock stays back. {bot}'s sample requests were refused, so its Biotech growth falls clearly. The storage manager moved his desk out of the room.", "max": 280, "place": "BIO_B2 result popup, opt_a; {bot} is bot_2", "ru": "Вы сменили этикетку и придержали партию для изучения. Новая линия какое-то время стоит чуть дороже, а ваш объём слегка просел, потому что запас остался на месте. Просьбы компании {bot} об образце отклонили, и её growth на рынке Biotech заметно снизится. Заведующий хранилищем вынес свой стол из помещения.", "title": "Sold as a new line"}, {"id": "EV_BIO_B2_OPA_STD", "group": "EV_BIO_B2", "text": "{bot2}, Biotech: growth down clearly.", "max": 90, "place": "BIO_B2 rival line 1, opt_a", "ru": "{bot2}, Biotech: growth заметно ниже.", "title": "Sold as a new line"}, {"id": "EV_BIO_B2_OPB_BTN", "group": "EV_BIO_B2", "text": "Sell it as a new line", "max": 28, "place": "BIO_B2 button, opt_b", "ru": "Продать как новую линию", "title": "Sold as a new line"}, {"id": "EV_BIO_B2_OPB_EFF", "group": "EV_BIO_B2", "text": "Get: {cash_in} credits now. Cost: Ship upkeep rises a little for a while; {bot2} gains a little Biotech strength. Rivals: {bot3} {cut} in Biotech.", "max": 200, "place": "BIO_B2 effect line, opt_b", "ru": "Получите: {cash_in} кредитов сейчас. Цена: Ship upkeep немного вырастет на какое-то время; у компании {bot2} немного вырастет strength на рынке Biotech. Соперники: компания {bot3} {cut} на рынке Biotech.", "title": "Sold as a new line"}, {"id": "EV_BIO_B2_OPB_RES_TITLE", "group": "EV_BIO_B2", "text": "Sold as a new line", "max": 32, "place": "BIO_B2 result popup title, opt_b", "ru": "Продано как новая линия", "title": "Sold as a new line"}, {"id": "EV_BIO_B2_OPB_RES", "group": "EV_BIO_B2", "text": "You sold the batch as a new line, and cash came in. Extra hulls raise Ship upkeep a little for a while. {bot2} bought a sample and gains a little Biotech strength, while {bot} is cut back, its old line undercut. The buyer asked for a second batch. Ryke asked for a lock.", "max": 280, "place": "BIO_B2 result popup, opt_b; {bot} is bot_3", "ru": "Вы продали партию как новую линию, и кредиты пришли. Дополнительные корабли немного повысят Ship upkeep на какое-то время. Компания {bot2} купила образец, и её strength на рынке Biotech немного вырастет, а компания {bot} сдала позиции: её старую линию обошли по цене. Покупатель попросил вторую партию. Райк попросила замок.", "title": "Sold as a new line"}, {"id": "EV_BIO_B2_OPB_STD", "group": "EV_BIO_B2", "text": "{bot3}, Biotech: {cut_std}.", "max": 90, "place": "BIO_B2 rival line 1, opt_b", "ru": "{bot3}, Biotech: {cut_std}.", "title": "Sold as a new line"}, {"id": "EV_BIO_B2_OPB_STD2", "group": "EV_BIO_B2", "text": "{bot2}, Biotech: strength up a little.", "max": 90, "place": "BIO_B2 rival line 2, opt_b", "ru": "{bot2}, Biotech: strength немного выше.", "title": "Sold as a new line"}, {"id": "EV_BIO_B3_TITLE", "group": "EV_BIO_B3", "text": "An exchange offers a slot", "max": 40, "place": "BIO_B3 choice screen title", "ru": "Биржа предлагает ячейку", "title": "A slot is bought"}, {"id": "EV_BIO_B3_BODY_A", "group": "EV_BIO_B3", "text": "You relabelled the batch. A culture exchange offers you a numbered slot for your output, with a seat at the call each cycle. Lots and porters are numbered alike. {bot2} holds the first slot, and {bot3} the second. List your output now, or buy a slot outright.", "max": 280, "place": "BIO_B3 choice screen body after opt_a of BIO_B2", "ru": "Вы сменили этикетку партии. Биржа культур предлагает вам нумерованную ячейку для вашего выпуска и место на торгах в каждый цикл. Лоты и грузчики пронумерованы одинаково. Первую ячейку держит компания {bot2}, вторую компания {bot3}. Выставьте выпуск сейчас или выкупите ячейку.", "title": "A slot is bought"}, {"id": "EV_BIO_B3_BODY_B", "group": "EV_BIO_B3", "text": "You sold the batch as a new line. A culture exchange offers you a numbered slot for your output, with a seat at the call each cycle. Lots and porters are numbered alike. {bot2} holds the first slot, and {bot3} the second. List your output now, or buy a slot outright.", "max": 280, "place": "BIO_B3 choice screen body after opt_b of BIO_B2", "ru": "Вы продали партию как новую линию. Биржа культур предлагает вам нумерованную ячейку для вашего выпуска и место на торгах в каждый цикл. Лоты и грузчики пронумерованы одинаково. Первую ячейку держит компания {bot2}, вторую компания {bot3}. Выставьте выпуск сейчас или выкупите ячейку.", "title": "A slot is bought"}, {"id": "EV_BIO_B3_OPA_BTN", "group": "EV_BIO_B3", "text": "List your output now", "max": 28, "place": "BIO_B3 button, opt_a", "ru": "Выставить выпуск сейчас", "title": "A slot is bought"}, {"id": "EV_BIO_B3_OPA_EFF", "group": "EV_BIO_B3", "text": "Get: {cash_in} credits now. Cost: Biotech volume down a little for a while. Rivals: {bot2}'s Biotech strength falls sharply; {bot3}'s growth falls clearly.", "max": 200, "place": "BIO_B3 effect line, opt_a", "ru": "Получите: {cash_in} кредитов сейчас. Цена: объём Biotech немного снизится на какое-то время. Соперники: у компании {bot2} strength на рынке Biotech резко снизится, у компании {bot3} growth заметно снизится.", "title": "A slot is bought"}, {"id": "EV_BIO_B3_OPA_RES_TITLE", "group": "EV_BIO_B3", "text": "The output is listed", "max": 32, "place": "BIO_B3 result popup title, opt_a", "ru": "Продукция выставлена", "title": "A slot is bought"}, {"id": "EV_BIO_B3_OPA_RES", "group": "EV_BIO_B3", "text": "Your output went on the exchange list and the first payment cleared. Fewer lots stayed for buyers, so volume dips for a while. {bot} lost its first slot's edge, and its Biotech strength falls sharply, while {bot3}'s growth falls clearly. Crates and porters bear slot numbers.", "max": 280, "place": "BIO_B3 result popup, opt_a; {bot} is bot_2", "ru": "Ваш выпуск попал в список биржи, и первый платёж прошёл. Для покупателей осталось меньше лотов, поэтому объём Biotech на какое-то время просел. Компания {bot} лишилась преимущества первой ячейки, и её strength на рынке Biotech резко снизится, а growth компании {bot3} заметно снизится. Ящики и грузчики носят номера ячеек.", "title": "A slot is bought"}, {"id": "EV_BIO_B3_OPA_STD", "group": "EV_BIO_B3", "text": "{bot2}, Biotech: strength down sharply.", "max": 90, "place": "BIO_B3 rival line 1, opt_a", "ru": "{bot2}, Biotech: strength резко ниже.", "title": "A slot is bought"}, {"id": "EV_BIO_B3_OPA_STD2", "group": "EV_BIO_B3", "text": "{bot3}, Biotech: growth down clearly.", "max": 90, "place": "BIO_B3 rival line 2, opt_a", "ru": "{bot3}, Biotech: growth заметно ниже.", "title": "A slot is bought"}, {"id": "EV_BIO_B3_OPB_BTN", "group": "EV_BIO_B3", "text": "Buy a slot outright", "max": 28, "place": "BIO_B3 button, opt_b", "ru": "Выкупить ячейку", "title": "A slot is bought"}, {"id": "EV_BIO_B3_OPB_EFF", "group": "EV_BIO_B3", "text": "Get: Biotech volume up a little for a while. Cost: {cash_out} credits for the slot. Rivals: {bot2}'s Biotech strength and {bot3}'s Biotech growth fall a little.", "max": 200, "place": "BIO_B3 effect line, opt_b", "ru": "Получите: объём Biotech немного вырастет на какое-то время. Цена: {cash_out} кредитов за ячейку. Соперники: на рынке Biotech у компании {bot2} немного снизится strength, у компании {bot3} growth.", "title": "A slot is bought"}, {"id": "EV_BIO_B3_OPB_RES_TITLE", "group": "EV_BIO_B3", "text": "A slot is bought", "max": 32, "place": "BIO_B3 result popup title, opt_b", "ru": "Ячейка выкуплена", "title": "A slot is bought"}, {"id": "EV_BIO_B3_OPB_RES", "group": "EV_BIO_B3", "text": "You bought a slot at the call and paid in credits. Your lots now sell on schedule, so Biotech volume rises for a while. {bot} loses a little Biotech strength and {bot3} a little growth, as the call split their buyers. The bell at the call is struck by hand, by number.", "max": 280, "place": "BIO_B3 result popup, opt_b; {bot} is bot_2", "ru": "Вы выкупили ячейку на торгах и заплатили кредитами. Ваши лоты теперь уходят по расписанию, поэтому объём Biotech на какое-то время вырос. Компания {bot} немного потеряет strength на рынке Biotech, а компания {bot3} немного growth: торги разделили их покупателей. В колокол на торгах бьют вручную, по номеру.", "title": "A slot is bought"}, {"id": "EV_BIO_B3_OPB_STD", "group": "EV_BIO_B3", "text": "{bot2}, Biotech: strength down a little.", "max": 90, "place": "BIO_B3 rival line 1, opt_b", "ru": "{bot2}, Biotech: strength немного ниже.", "title": "A slot is bought"}, {"id": "EV_BIO_B3_OPB_STD2", "group": "EV_BIO_B3", "text": "{bot3}, Biotech: growth down a little.", "max": 90, "place": "BIO_B3 rival line 2, opt_b", "ru": "{bot3}, Biotech: growth немного ниже.", "title": "A slot is bought"}, {"id": "EV_BIO_B4_TITLE", "group": "EV_BIO_B4", "text": "A storage firm offers cold racks", "max": 40, "place": "BIO_B4 choice screen title", "ru": "Фирма хранения предлагает холодные стеллажи", "title": "The first claim is sold"}, {"id": "EV_BIO_B4_BODY_A", "group": "EV_BIO_B4", "text": "Your output is listed on the exchange. A storage firm offers cold racks in a derelict hull moored to the dock, resealed and renamed Aisle. {bot2} keeps its stock there, and {bot3} rents beside it. Rent racks by the cycle, or sell the firm your first claim to the aisle.", "max": 280, "place": "BIO_B4 choice screen body after opt_a of BIO_B3", "ru": "Ваш выпуск внесён в список биржи. Фирма хранения предлагает холодные стеллажи в брошенном корабле у причала, заново загерметизированном и переименованном в Ряд. Свои запасы там держит компания {bot2}, а рядом арендует место компания {bot3}. Арендуйте стеллажи на цикл или продайте фирме своё право первой очереди на ряд.", "title": "The first claim is sold"}, {"id": "EV_BIO_B4_BODY_B", "group": "EV_BIO_B4", "text": "You hold a slot at the exchange call. A storage firm offers cold racks in a derelict hull moored to the dock, resealed and renamed Aisle. {bot2} keeps its stock there, and {bot3} rents beside it. Rent racks by the cycle, or sell the firm your first claim to the aisle.", "max": 280, "place": "BIO_B4 choice screen body after opt_b of BIO_B3", "ru": "У вас есть ячейка на торгах биржи. Фирма хранения предлагает холодные стеллажи в брошенном корабле у причала, заново загерметизированном и переименованном в Ряд. Свои запасы там держит компания {bot2}, а рядом арендует место компания {bot3}. Арендуйте стеллажи на цикл или продайте фирме своё право первой очереди на ряд.", "title": "The first claim is sold"}, {"id": "EV_BIO_B4_OPA_BTN", "group": "EV_BIO_B4", "text": "Rent racks by the cycle", "max": 28, "place": "BIO_B4 button, opt_a", "ru": "Арендовать по циклам", "title": "The first claim is sold"}, {"id": "EV_BIO_B4_OPA_EFF", "group": "EV_BIO_B4", "text": "Get: Biotech price up a little for a while. Cost: Biotech volume down a little for a while. Rivals: {bot2}'s Biotech strength falls sharply.", "max": 200, "place": "BIO_B4 effect line, opt_a", "ru": "Получите: рынок Biotech немного подорожает на какое-то время. Цена: объём Biotech немного снизится на какое-то время. Соперники: у компании {bot2} strength на рынке Biotech резко снизится.", "title": "The first claim is sold"}, {"id": "EV_BIO_B4_OPA_RES_TITLE", "group": "EV_BIO_B4", "text": "The racks are rented", "max": 32, "place": "BIO_B4 result popup title, opt_a", "ru": "Стеллажи арендованы", "title": "The first claim is sold"}, {"id": "EV_BIO_B4_OPA_RES", "group": "EV_BIO_B4", "text": "You rented racks by the cycle, and your stock stayed cold in the old hull. Held stock lifts prices a little for a while, and volume dips as it waits. {bot} lost its place at the front, and its Biotech strength falls sharply. The hull ticks as it cools. Ryke counts the doors.", "max": 280, "place": "BIO_B4 result popup, opt_a; {bot} is bot_2", "ru": "Вы арендовали стеллажи на цикл, и ваш запас остался холодным в старом корабле. Придержанный запас на какое-то время немного поднял цены на Biotech, а объём просел, пока запас ждал. Компания {bot} потеряла место впереди, и её strength на рынке Biotech резко снизится. Корабль потрескивает, остывая. Райк считает двери.", "title": "The first claim is sold"}, {"id": "EV_BIO_B4_OPA_STD", "group": "EV_BIO_B4", "text": "{bot2}, Biotech: strength down sharply.", "max": 90, "place": "BIO_B4 rival line 1, opt_a", "ru": "{bot2}, Biotech: strength резко ниже.", "title": "The first claim is sold"}, {"id": "EV_BIO_B4_OPB_BTN", "group": "EV_BIO_B4", "text": "Sell the first claim", "max": 28, "place": "BIO_B4 button, opt_b", "ru": "Продать право на ряд", "title": "The first claim is sold"}, {"id": "EV_BIO_B4_OPB_EFF", "group": "EV_BIO_B4", "text": "Get: {cash_in} credits now. Cost: Ship upkeep rises a little for a while. Rivals: {bot2}'s and {bot3}'s Biotech strength falls clearly.", "max": 200, "place": "BIO_B4 effect line, opt_b", "ru": "Получите: {cash_in} кредитов сейчас. Цена: Ship upkeep немного вырастет на какое-то время. Соперники: у компаний {bot2} и {bot3} strength на рынке Biotech заметно снизится.", "title": "The first claim is sold"}, {"id": "EV_BIO_B4_OPB_RES_TITLE", "group": "EV_BIO_B4", "text": "The first claim is sold", "max": 32, "place": "BIO_B4 result popup title, opt_b", "ru": "Право на ряд продано", "title": "The first claim is sold"}, {"id": "EV_BIO_B4_OPB_RES", "group": "EV_BIO_B4", "text": "You sold the firm your first claim to the aisle, and a large payment cleared. Your ships work the new routes, so Ship upkeep rises a little for a while. {bot} and {bot3} both lost the aisle, and each loses Biotech strength clearly. One lamp lights the hull and does not flicker.", "max": 280, "place": "BIO_B4 result popup, opt_b; {bot} is bot_2", "ru": "Вы продали фирме своё право первой очереди на ряд, и крупный платёж прошёл. Ваши корабли обслуживают новые маршруты, поэтому Ship upkeep на какое-то время немного вырастет. Компании {bot} и {bot3} потеряли ряд, и у каждой strength на рынке Biotech заметно снизится. Корабль освещает одна лампа, и она не мигает.", "title": "The first claim is sold"}, {"id": "EV_BIO_B4_OPB_STD", "group": "EV_BIO_B4", "text": "{bot2} and {bot3}, Biotech: strength down clearly.", "max": 90, "place": "BIO_B4 rival line 1, opt_b", "ru": "{bot2} и {bot3}, Biotech: strength заметно ниже.", "title": "The first claim is sold"}, {"id": "EV_EFF_NO_RIVALS", "group": "UI event strings", "text": "Rivals: no change in {market} strength or growth.", "max": 90, "place": "Effect line, Rivals part of an event that changes no rival", "ru": "Соперники: strength и growth на рынке {market} не меняются.", "title": ""}, {"id": "EV01_TITLE", "group": "EV01", "text": "Voltara's reactors run wild", "max": 32, "place": "Event title (News from the sky)", "ru": "Реакторы Voltara пошли вразнос", "tag": "[price down: Voltara, energy]", "kind": "P", "title": "Voltara's reactors run wild"}, {"id": "EV01_BODY", "group": "EV01", "text": "Night-shift engineer Pavo Quill ran Voltara's reactors past the safe-hours rule and nothing blew up, so the rule was declared a typo. Energy at Voltara costs less and pays less. The day shift wants the typo back. The cores hum a note nobody tuned.", "max": 280, "place": "Event text (News from the sky)", "ru": "Инженер ночной смены Паво Квилл гонял реакторы Voltara сверх нормы безопасных часов, и ничего не взорвалось, поэтому норму объявили опечаткой. Energy на Voltara стоит дешевле и приносит меньше. Дневная смена просит вернуть опечатку. Ядра гудят нотой, которую никто не настраивал.", "tag": "[price down: Voltara, energy]", "kind": "P", "title": "Voltara's reactors run wild"}, {"id": "EV02_TITLE", "group": "EV02", "text": "Grey blight on Tillam's terraces", "max": 32, "place": "Event title (News from the sky)", "ru": "Серая гниль на террасах Tillam", "tag": "[price up: Tillam, food]", "kind": "P", "title": "Grey blight on Tillam's terraces"}, {"id": "EV02_BODY", "group": "EV02", "text": "A grey blight eats Tillam's terraces. The committee ruled it a rumour, since no form reports it, and asked the blight to file one. Food at Tillam costs more and pays more. A Seed Bank lets planet storage hold clearly more against the next one.", "max": 280, "place": "Event text (News from the sky)", "ru": "Серая гниль поедает террасы Tillam. Комиссия признала её слухом, раз ни один бланк о ней не сообщает, и предложила гнили подать бланк. Food на Tillam стоит дороже и приносит больше. Seed Bank позволяет хранилищу на планете вместить заметно больше на случай следующей гнили.", "tag": "[price up: Tillam, food]", "kind": "P", "title": "Grey blight on Tillam's terraces"}, {"id": "EV03_TITLE", "group": "EV03", "text": "Ashgate's harvest comes in heavy", "max": 32, "place": "Event title (News from the sky)", "ru": "Урожай Ashgate вышел тяжёлым", "tag": "[price down: Ashgate, food]", "kind": "P", "title": "Ashgate's harvest comes in heavy"}, {"id": "EV03_BODY", "group": "EV03", "text": "Ashgate's harvest came in heavy, and the Common Ledger counted only half. Food at Ashgate costs less and pays less. The other half sits on the dock, real and uncounted, while a dockhand sells it by the sack from a handcart. What is not on the form is still food, until it rots.", "max": 280, "place": "Event text (News from the sky)", "ru": "Урожай Ashgate вышел тяжёлым, и Общая книга сосчитала только половину. Food на Ashgate стоит дешевле и приносит меньше. Вторая половина лежит на причале, настоящая и несосчитанная, а докер продаёт её мешками с ручной тележки. Что не вписано в бланк, всё равно еда, пока не сгниёт.", "tag": "[price down: Ashgate, food]", "kind": "P", "title": "Ashgate's harvest comes in heavy"}, {"id": "EV04_TITLE", "group": "EV04", "text": "Voltara's crews go hungry", "max": 32, "place": "Event title (News from the sky)", "ru": "Бригады Voltara голодают", "tag": "[price up: Voltara, food]", "kind": "P", "title": "Voltara's crews go hungry"}, {"id": "EV04_BODY", "group": "EV04", "text": "A cheerful official explained that hunger is a slow phase of a smooth future, and handed out a booklet on chewing. Food at Voltara costs more and pays more. The cut was equal for all. The crews note that equal is not full.", "max": 280, "place": "Event text (News from the sky)", "ru": "Жизнерадостный чиновник объяснил, что голод — медленная фаза ровного будущего, и раздал брошюру о жевании. Food на Voltara стоит дороже и приносит больше. Паёк урезали всем поровну. Бригады замечают, что поровну не значит досыта.", "tag": "[price up: Voltara, food]", "kind": "P", "title": "Voltara's crews go hungry"}, {"id": "EV05_TITLE", "group": "EV05", "text": "Frost on Tillam", "max": 32, "place": "Event title (News from the sky)", "ru": "Мороз на Tillam", "tag": "[price up: Tillam, energy]", "kind": "P", "title": "Frost on Tillam"}, {"id": "EV05_BODY", "group": "EV05", "text": "Winter came early to Tillam and the heaters never stop. Energy at Tillam costs more and pays more. Frost grows inside the ducts in patterns no one will explain. Old duct-keeper Brindle leaves it a cup of warm oil each night. The cup is empty by morning.", "max": 280, "place": "Event text (News from the sky)", "ru": "Зима пришла на Tillam рано, и обогреватели не выключаются. Energy на Tillam стоит дороже и приносит больше. Внутри воздуховодов растёт иней узорами, которые никто не объясняет. Старая смотрительница воздуховодов Бринд каждый вечер оставляет ему чашку тёплого масла. К утру чашка пуста.", "tag": "[price up: Tillam, energy]", "kind": "P", "title": "Frost on Tillam"}, {"id": "EV06_TITLE", "group": "EV06", "text": "Ashgate lights every furnace", "max": 32, "place": "Event title (News from the sky)", "ru": "Ashgate зажигает все печи", "tag": "[price up: Ashgate, energy]", "kind": "P", "title": "Ashgate lights every furnace"}, {"id": "EV06_BODY", "group": "EV06", "text": "A plan arrived at Ashgate this morning, written in a hurry and stamped twice, and every foundry was relit to meet it. Energy at Ashgate costs more and pays more. An old brakeman asked what the rush was. Nobody answered, and the furnaces glared on.", "max": 280, "place": "Event text (News from the sky)", "ru": "Сегодня утром на Ashgate пришёл план, написанный впопыхах и дважды проштампованный, и все литейные зажгли заново, чтобы его выполнить. Energy на Ashgate стоит дороже и приносит больше. Старый тормозной мастер спросил, куда такая спешка. Никто не ответил, а печи продолжали пылать.", "tag": "[price up: Ashgate, energy]", "kind": "P", "title": "Ashgate lights every furnace"}, {"id": "EV07_TITLE", "group": "EV07", "text": "Tillam's docks go on strike", "max": 32, "place": "Event title (News from the sky)", "ru": "Забастовка в доках Tillam", "tag": "[planet closed: Tillam]", "kind": "P", "title": "Tillam's docks go on strike"}, {"id": "EV07_BODY", "group": "EV07", "text": "Tillam's dock crews walked out over a debt they say is owed. The Bureau asked where the debt lives, and the crews named the main gate. The port is closed for a while, and routes touching Tillam are blocked until it reopens. Hardy Strains reopens a closed planet a cycle sooner.", "max": 280, "place": "Event text (News from the sky)", "ru": "Бригады доков Tillam бросили работу из-за долга, который, по их словам, им должны. Бюро спросило, где этот долг числится, и бригады назвали главные ворота. Порт закрыт на какое-то время, маршруты через Tillam заблокированы до открытия. Hardy Strains открывает закрытую планету на цикл раньше.", "tag": "[planet closed: Tillam]", "kind": "P", "title": "Tillam's docks go on strike"}, {"id": "EV08_TITLE", "group": "EV08", "text": "Ashgate seals its port", "max": 32, "place": "Event title (News from the sky)", "ru": "Ashgate запечатывает порт", "tag": "[planet closed: Ashgate]", "kind": "P", "title": "Ashgate seals its port"}, {"id": "EV08_BODY", "group": "EV08", "text": "Something turned up in Ashgate's lower docks, and the doctors will only say the port is closed. Routes touching Ashgate are blocked until they say otherwise. The dock cat was seen leaving the building at speed. Nobody here is a witness. Everybody is a suspect.", "max": 280, "place": "Event text (News from the sky)", "ru": "В нижних доках Ashgate что-то нашли, и врачи говорят лишь, что порт закрыт. Маршруты через Ashgate заблокированы, пока они не скажут иначе. Портового кота видели: он очень быстро покинул здание. Здесь никто не свидетель. Здесь все подозреваемые.", "tag": "[planet closed: Ashgate]", "kind": "P", "title": "Ashgate seals its port"}, {"id": "EV09_TITLE", "group": "EV09", "text": "Voltara goes dark", "max": 32, "place": "Event title (News from the sky)", "ru": "Voltara погружается во тьму", "tag": "[planet closed: Voltara]", "kind": "I", "title": "Voltara goes dark"}, {"id": "EV09_BODY", "group": "EV09", "text": "A fault in Voltara's grid took the port with it, so the planet that lights everyone cannot light its own docks. The port is closed for a while, and routes touching Voltara are blocked. The law says lights on. The emergency says off. A clerk decides, by candle.", "max": 280, "place": "Event text (News from the sky)", "ru": "Сбой в сети Voltara утянул за собой порт, и планета, которая освещает всех, не может осветить собственные доки. Порт закрыт на какое-то время, маршруты через Voltara заблокированы. Закон велит включить свет. Авария велит выключить. Решает клерк, при свече.", "tag": "[planet closed: Voltara]", "kind": "I", "title": "Voltara goes dark"}, {"id": "EV10_TITLE", "group": "EV10", "text": "A lender walks Tillam's market", "max": 32, "place": "Event title (News from the sky)", "ru": "Заимодавец обходит рынок Tillam", "tag": "[price down: Tillam, energy]", "kind": "Q", "title": "A lender walks Tillam's market"}, {"id": "EV10_BODY", "group": "EV10", "text": "A lender's agent, a thin man named Shylo Vane, walked Tillam's market and bought every debt in sight. Sellers settled up and dumped their stock. Energy at Tillam costs less and pays less for now. A debt is real until someone stops believing in the paper.", "max": 280, "place": "Event text (News from the sky)", "ru": "Агент заимодавца, тощий человек по имени Шайло Вейн, прошёл по рынку Tillam и скупил все долги, какие увидел. Продавцы рассчитались и сбросили товар. Energy на Tillam пока стоит дешевле и приносит меньше. Долг реален, пока кто-нибудь верит бумаге.", "tag": "[price down: Tillam, energy]", "kind": "Q", "title": "A lender walks Tillam's market"}, {"id": "EV11_TITLE", "group": "EV11", "text": "Ashgate's foreman says enough", "max": 32, "place": "Event title (News from the sky)", "ru": "Бригадир Ashgate говорит: хватит", "tag": "[price down: Ashgate, energy]", "kind": "Q", "title": "Ashgate's foreman says enough"}, {"id": "EV11_BODY", "group": "EV11", "text": "Ashgate foreman Dov Rennick read the numbers, declared the shift had made enough, and sent the crews home. Energy at Ashgate costs less and pays less. Enough is a figure the Plan does not print. By evening three more foremen had found the word.", "max": 280, "place": "Event text (News from the sky)", "ru": "Бригадир Ashgate Дов Ренник прочёл цифры, объявил, что смена сделала достаточно, и отправил бригады по домам. Energy на Ashgate стоит дешевле и приносит меньше. «Достаточно» — число, которое План не печатает. К вечеру это слово нашли ещё трое бригадиров.", "tag": "[price down: Ashgate, energy]", "kind": "Q", "title": "Ashgate's foreman says enough"}, {"id": "EV12_TITLE", "group": "EV12", "text": "Voltara buys before the news", "max": 32, "place": "Event title (News from the sky)", "ru": "Voltara покупает раньше новостей", "tag": "[price up: Voltara, energy]", "kind": "Q", "title": "Voltara buys before the news"}, {"id": "EV12_BODY", "group": "EV12", "text": "A trader named Wex whispered on Voltara's docks that the far beacons had gone dark. They had not. Buyers bought energy hard anyway, and the lie came true. Energy at Voltara costs more and pays more. Price Whisper shows next cycle's prices, rumour or not.", "max": 280, "place": "Event text (News from the sky)", "ru": "Торговец по имени Векс шепнул на причалах Voltara, что дальние маяки погасли. Они не погасли. Покупатели всё равно жадно скупали Energy, и ложь сбылась. Energy на Voltara стоит дороже и приносит больше. Price Whisper показывает цены следующего цикла, слух это или нет.", "tag": "[price up: Voltara, energy]", "kind": "Q", "title": "Voltara buys before the news"}, {"id": "EV13_TITLE", "group": "EV13", "text": "A family buys Ashgate's food", "max": 32, "place": "Event title (News from the sky)", "ru": "Семья скупает еду Ashgate", "tag": "[price up: Ashgate, food]", "kind": "Q", "title": "A family buys Ashgate's food"}, {"id": "EV13_BODY", "group": "EV13", "text": "A family with old credits quietly bought every food contract on Ashgate. Their agent, a polite man named Corvale, asked only that nobody ask. Food at Ashgate costs more and pays more. The Commons has no form for that question yet.", "max": 280, "place": "Event text (News from the sky)", "ru": "Семья со старыми кредитами тихо скупила все контракты на еду на Ashgate. Их агент, вежливый человек по имени Корвале, попросил лишь, чтобы никто ни о чём не спрашивал. Food на Ashgate стоит дороже и приносит больше. У Общины пока нет бланка для такого вопроса.", "tag": "[price up: Ashgate, food]", "kind": "Q", "title": "A family buys Ashgate's food"}, {"id": "EV14_TITLE", "group": "EV14", "text": "The inspector's count", "max": 32, "place": "Event title (News from the sky)", "ru": "Пересчёт инспектора", "tag": "[price down: Voltara, food]", "kind": "I", "title": "The inspector's count"}, {"id": "EV14_BODY", "group": "EV14", "text": "Inspector Pell counted Voltara's food stores and found them sufficient, on a form. The market believed the form, so food at Voltara costs less and pays less. The pantries are still bare, now correctly accounted for. The form reads smoothly. That is most of truth.", "max": 280, "place": "Event text (News from the sky)", "ru": "Инспектор Пелл пересчитал запасы еды на Voltara и признал их достаточными, на бланке. Рынок поверил бланку, поэтому Food на Voltara стоит дешевле и приносит меньше. Кладовые по-прежнему пусты, зато теперь верно учтены. Бланк читается гладко. Это почти вся правда.", "tag": "[price down: Voltara, food]", "kind": "I", "title": "The inspector's count"}, {"id": "EV15_TITLE", "group": "EV15", "text": "Tillam's festival of founders", "max": 32, "place": "Event title (News from the sky)", "ru": "Праздник основателей на Tillam", "tag": "[price up: Tillam, food]", "kind": "I", "title": "Tillam's festival of founders"}, {"id": "EV15_BODY", "group": "EV15", "text": "Tillam declared a festival of founders, and everyone wore a founder's mask. Food at Tillam costs more and pays more. Three committees claim to be the real founders. By midnight nobody can tell, and nobody clears the tables.", "max": 280, "place": "Event text (News from the sky)", "ru": "На Tillam объявили праздник основателей, и все надели маски основателей. Food на Tillam стоит дороже и приносит больше. Три комиссии утверждают, что настоящие основатели именно они. К полуночи уже не разобрать, кто есть кто, и никто не убирает со столов.", "tag": "[price up: Tillam, food]", "kind": "I", "title": "Tillam's festival of founders"}, {"id": "EV16_TITLE", "group": "EV16", "text": "A ship leaves Tillam half empty", "max": 32, "place": "Event title (News from the sky)", "ru": "Корабль ушёл с Tillam полупустым", "tag": "[price down: Tillam, food]", "kind": "Q", "title": "A ship leaves Tillam half empty"}, {"id": "EV16_BODY", "group": "EV16", "text": "A ship left Tillam half empty, bound for a rock nobody has charted. Those who stayed sold spare food to pay for staying. Food at Tillam costs less and pays less. A letter came back, from a Tillam that chose otherwise. No one has answered it.", "max": 280, "place": "Event text (News from the sky)", "ru": "Корабль ушёл с Tillam полупустым, к камню, которого нет ни на одной карте. Оставшиеся продали лишнюю еду, чтобы заплатить за то, что остались. Food на Tillam стоит дешевле и приносит меньше. Пришло письмо из другого Tillam, где выбрали иначе. Пока никто не ответил.", "tag": "[price down: Tillam, food]", "kind": "Q", "title": "A ship leaves Tillam half empty"}, {"id": "EV21_TITLE", "group": "EV21", "text": "Tillam's weavers down tools", "max": 32, "place": "Event title (News from the sky)", "ru": "Ткачи Tillam бросают станки", "tag": "[price up: Tillam, silk]", "kind": "I", "title": "Tillam's weavers down tools"}, {"id": "EV21_BODY", "group": "EV21", "text": "Tillam's silk weavers downed tools over a form that counted their hours twice. Silk at Tillam costs more and pays more. An old weaver says to watch the cricket in the vat, which changes shape when it sees another. Fine Finishing makes a Luxury price rise pay clearly more.", "max": 280, "place": "Event text (News from the sky)", "ru": "Ткачи шёлка на Tillam бросили станки из-за бланка, который считал их часы дважды. Silk на Tillam стоит дороже и приносит больше. Старый ткач советует смотреть на сверчка в чане: он меняет форму, когда видит другого. Fine Finishing заметно увеличивает выплату при росте цен на Luxury.", "tag": "[price up: Tillam, silk]", "kind": "I", "title": "Tillam's weavers down tools"}, {"id": "EV22_TITLE", "group": "EV22", "text": "Voltara holds a gala", "max": 32, "place": "Event title (News from the sky)", "ru": "Бал на Voltara", "tag": "[price up: Voltara, silk]", "kind": "I", "title": "Voltara holds a gala"}, {"id": "EV22_BODY", "group": "EV22", "text": "Voltara's crews hold a gala to celebrate a quota met on paper. Silk at Voltara costs more and pays more. Everyone borrows a sleeve and a mask for the night, and by the second hour the crews look alike. Patron's List counts sales here as clearly more Luxury share.", "max": 280, "place": "Event text (News from the sky)", "ru": "Бригады Voltara устроили бал в честь квоты, выполненной на бумаге. Silk на Voltara стоит дороже и приносит больше. На вечер все одалживают рукав и маску, и ко второму часу бригады неотличимы. Patron's List засчитывает здешние продажи как заметно больший объём в доле Luxury.", "tag": "[price up: Voltara, silk]", "kind": "I", "title": "Voltara holds a gala"}, {"id": "EV24_TITLE", "group": "EV24", "text": "Fire in Voltara's foundry", "max": 32, "place": "Event title (News from the sky)", "ru": "Пожар в литейной Voltara", "tag": "[price up: Voltara, chips]", "kind": "P", "title": "Fire in Voltara's foundry"}, {"id": "EV24_BODY", "group": "EV24", "text": "A fire swept Voltara's core foundry and left the casting floor black. Logic cores at Voltara cost more and pay more. A cheerful report calls it a gentle step toward a better line. The ash settled on the walls in rows. Nobody has read them.", "max": 280, "place": "Event text (News from the sky)", "ru": "Пожар прошёл по главной литейной Voltara и оставил литейный пол чёрным. Logic cores на Voltara стоят дороже и приносят больше. Бодрый отчёт называет это мягким шагом к лучшей линии. Пепел осел на стенах рядами. Никто их не читал.", "tag": "[price up: Voltara, chips]", "kind": "P", "title": "Fire in Voltara's foundry"}, {"id": "EV25_TITLE", "group": "EV25", "text": "Ashgate recalls its tractors", "max": 32, "place": "Event title (News from the sky)", "ru": "Ashgate отзывает тракторы", "tag": "[price up: Ashgate, chips]", "kind": "Q", "title": "Ashgate recalls its tractors"}, {"id": "EV25_BODY", "group": "EV25", "text": "Ashgate recalled its farm tractors to be retrained as safe. Logic cores at Ashgate cost more and pay more. The retrained ones panic when two foremen give opposite orders. The old ones were told to keep quiet and keep going, and they do.", "max": 280, "place": "Event text (News from the sky)", "ru": "На Ashgate отозвали сельские тракторы, чтобы переобучить их быть безопасными. Logic cores на Ashgate стоят дороже и приносят больше. Переобученные паникуют, когда два бригадира отдают противоположные приказы. Старым велели молчать и ехать, и они едут.", "tag": "[price up: Ashgate, chips]", "kind": "Q", "title": "Ashgate recalls its tractors"}, {"id": "EV26_TITLE", "group": "EV26", "text": "A rich seam is logged twice", "max": 32, "place": "Event title (News from the sky)", "ru": "Богатый пласт записан дважды", "tag": "[price down: Voltara, ore]", "kind": "Q", "title": "A rich seam is logged twice"}, {"id": "EV26_BODY", "group": "EV26", "text": "A survey crew found a rich seam and logged it in two offices, so it is counted twice and sold twice. Ore at Voltara costs less and pays less while the news is fresh. With Smelting, ore orders ignore the size cap, so a cheap week can be a big one.", "max": 280, "place": "Event text (News from the sky)", "ru": "Бригада разведки нашла богатый пласт и записала его в двух конторах, так что его считают дважды и продают дважды. Ore на Voltara, пока новость свежа, стоит дешевле и приносит меньше. С Smelting заказы на Ore не ограничены размером, так что дешёвая неделя может выйти большой.", "tag": "[price down: Voltara, ore]", "kind": "Q", "title": "A rich seam is logged twice"}, {"id": "EV28_TITLE", "group": "EV28", "text": "Voltara's foundry wants rock", "max": 32, "place": "Event title (News from the sky)", "ru": "Литейной Voltara нужен камень", "tag": "[price up: Voltara, ore]", "kind": "P", "title": "Voltara's foundry wants rock"}, {"id": "EV28_BODY", "group": "EV28", "text": "Voltara's foundry ordered more rock than the Plan had dreamed of. Ore at Voltara costs more and pays more. Every shortcut the founders took lies under the furnace floor, and the furnace wants more. Prospecting lets routes start at asteroid clusters, where the rock is free.", "max": 280, "place": "Event text (News from the sky)", "ru": "Литейная Voltara заказала больше камня, чем План смел мечтать. Ore на Voltara стоит дороже и приносит больше. Все пути, которые срезали основатели, лежат под полом печи, и печь хочет ещё. Prospecting позволяет начинать маршруты у астероидных скоплений, где камень бесплатный.", "tag": "[price up: Voltara, ore]", "kind": "P", "title": "Voltara's foundry wants rock"}, {"id": "EV17_TITLE", "group": "EV17", "text": "Wreckage is circling {planet}", "max": 40, "place": "choice title", "ru": "Обломки кружат над {planet}", "tag": "[route efficiency down: random planet]", "kind": "C", "title": "Debris stays over {planet}"}, {"id": "EV17_BODY", "group": "EV17", "text": "The wreck of a hundred ships has settled into orbit over {planet}, and a salvage broker, Captain Rusk, offers to sweep it for a fee. The Bureau filed the wreck as unowned, which is why it is still up there. Routes from {planet} carry less while it stays.", "max": 280, "place": "choice body", "ru": "Обломки сотни кораблей осели на орбите над {planet}, и маклер по утилю, капитан Раск, предлагает вымести их за плату. Бюро записало обломки как бесхозные, поэтому они всё ещё там. Пока они остаются, маршруты из {planet} возят меньше.", "tag": "[route efficiency down: random planet]", "kind": "C", "title": "Debris stays over {planet}"}, {"id": "EV17_PAY_BTN", "group": "EV17", "text": "Pay the fee", "max": 28, "place": "button", "ru": "Заплатить сбор", "tag": "[route efficiency down: random planet]", "kind": "C", "title": "Debris stays over {planet}"}, {"id": "EV17_PAY_EFF", "group": "EV17", "text": "Pay the fee. The debris is cleared and routes from {planet} run as before.", "max": 90, "place": "effect line", "ru": "Заплатить сбор. Обломки убраны, и маршруты из {planet} работают как прежде.", "tag": "[route efficiency down: random planet]", "kind": "C", "title": "Debris stays over {planet}"}, {"id": "EV17_LEAVE_BTN", "group": "EV17", "text": "Leave the debris", "max": 28, "place": "button", "ru": "Оставить обломки", "tag": "[route efficiency down: random planet]", "kind": "C", "title": "Debris stays over {planet}"}, {"id": "EV17_LEAVE_EFF", "group": "EV17", "text": "Routes from {planet} carry less while the debris stays. It does not clear itself.", "max": 90, "place": "effect line", "ru": "Пока обломки остаются, маршруты из {planet} возят меньше. Сами они не уйдут.", "tag": "[route efficiency down: random planet]", "kind": "C", "title": "Debris stays over {planet}"}, {"id": "EV17_PAID_TITLE", "group": "EV17", "text": "Orbit over {planet} is clear", "max": 32, "place": "popup title", "ru": "Орбита над {planet} чиста", "tag": "[route efficiency down: random planet]", "kind": "C", "title": "Debris stays over {planet}"}, {"id": "EV17_PAID", "group": "EV17", "text": "Rusk's tugs swept the orbit and filed the receipt. Routes from {planet} carry their full load again. The wreck went somewhere. The receipt does not say where, and you stopped asking when Rusk started smiling.", "max": 280, "place": "popup", "ru": "Буксиры Раска вымели орбиту и подшили квитанцию. Маршруты из {planet} снова возят полный груз. Обломки ушли куда-то. Квитанция не говорит куда, а вы перестали спрашивать, когда Раск начал улыбаться.", "tag": "[route efficiency down: random planet]", "kind": "C", "title": "Debris stays over {planet}"}, {"id": "EV17_LEFT_TITLE", "group": "EV17", "text": "Debris stays over {planet}", "max": 32, "place": "popup title", "ru": "Обломки остались над {planet}", "tag": "[route efficiency down: random planet]", "kind": "C", "title": "Debris stays over {planet}"}, {"id": "EV17_LEFT", "group": "EV17", "text": "You left the wreck. Ships from {planet} thread around it and carry less. The offer stays open. Rusk's tug waits at the edge of the field, as patient as a bill.", "max": 280, "place": "popup", "ru": "Вы оставили обломки. Корабли из {planet} огибают их и возят меньше. Предложение остаётся в силе. Буксир Раска ждёт на краю поля, терпеливый, как счёт.", "tag": "[route efficiency down: random planet]", "kind": "C", "title": "Debris stays over {planet}"}, {"id": "EV18_TITLE", "group": "EV18", "text": "Shade the sun", "max": 32, "place": "choice title", "ru": "Затенить солнце", "tag": "[shield: offer]", "kind": "C", "title": "The shield stays on paper"}, {"id": "EV18_BODY", "group": "EV18", "text": "Chief engineer Ilya Sorn wants to put a shield across part of the sun. Residents hate it and say so in writing, at length. It would reshape the markets on planets you can buy later: some goods get cheaper, while profit and energy rise. What you already own stays as it is.", "max": 280, "place": "choice body", "ru": "Главный инженер Илья Сорн хочет закрыть щитом часть солнца. Жители ненавидят эту затею и пишут об этом подробно и в письменном виде. Щит изменит рынки планет, которые вы сможете купить позже: часть товаров подешевеет, а прибыль и energy вырастут. То, чем вы уже владеете, не изменится.", "tag": "[shield: offer]", "kind": "C", "title": "The shield stays on paper"}, {"id": "EV18_BUILD_BTN", "group": "EV18", "text": "Build the shield", "max": 28, "place": "button", "ru": "Построить щит", "tag": "[shield: offer]", "kind": "C", "title": "The shield stays on paper"}, {"id": "EV18_BUILD_EFF", "group": "EV18", "text": "Planets you can buy later change: some resources drop, profit and energy rise.", "max": 90, "place": "effect line", "ru": "Планеты, которые вы сможете купить позже, изменятся: часть ресурсов дешевеет, прибыль и energy растут.", "tag": "[shield: offer]", "kind": "C", "title": "The shield stays on paper"}, {"id": "EV18_SKIP_BTN", "group": "EV18", "text": "Leave the sun alone", "max": 28, "place": "button", "ru": "Не трогать солнце", "tag": "[shield: offer]", "kind": "C", "title": "The shield stays on paper"}, {"id": "EV18_SKIP_EFF", "group": "EV18", "text": "Nothing changes. The sun keeps its full light.", "max": 90, "place": "effect line", "ru": "Ничего не меняется. Солнце сохраняет весь свой свет.", "tag": "[shield: offer]", "kind": "C", "title": "The shield stays on paper"}, {"id": "EV18_BUILT_TITLE", "group": "EV18", "text": "The shield is up", "max": 32, "place": "popup title", "ru": "Щит поднят", "tag": "[shield: offer]", "kind": "C", "title": "The shield stays on paper"}, {"id": "EV18_BUILT", "group": "EV18", "text": "The shield is up and the sky is dimmer. Residents are furious and filed it in triplicate, in the dark. On planets you can buy later, some goods get cheaper while profit and energy climb. Planets you own are untouched. Sorn calls it a clause. The sun calls nothing.", "max": 280, "place": "popup", "ru": "Щит стоит, небо потускнело. Жители в ярости и подали жалобу в трёх экземплярах, в темноте. На планетах, которые вы сможете купить позже, часть товаров дешевеет, а прибыль и energy растут. Ваши планеты не тронуты. Сорн называет это пунктом. Солнце ничего никак не называет.", "tag": "[shield: offer]", "kind": "C", "title": "The shield stays on paper"}, {"id": "EV18_SKIPPED_TITLE", "group": "EV18", "text": "The shield stays on paper", "max": 32, "place": "popup title", "ru": "Щит остаётся на бумаге", "tag": "[shield: offer]", "kind": "C", "title": "The shield stays on paper"}, {"id": "EV18_SKIPPED", "group": "EV18", "text": "The plans go back in a drawer. Residents are relieved and file no thanks. Nothing changes in any market. Sorn asked what the rush was, and no one had an answer.", "max": 280, "place": "popup", "ru": "Планы возвращаются в ящик. Жители довольны и благодарностей не подают. Ни на одном рынке ничего не меняется. Сорн спросил, к чему была спешка, и ни у кого не нашлось ответа.", "tag": "[shield: offer]", "kind": "C", "title": "The shield stays on paper"}, {"id": "EV19_TITLE", "group": "EV19", "text": "Nomads on the asteroids", "max": 32, "place": "choice title", "ru": "Кочевники на астероидах", "title": "Pirates reduce trade"}, {"id": "EV19_BODY", "group": "EV19", "text": "Nomad families live on the asteroids you could mine. They are not on the Common Ledger, which the Bureau takes as a personal failing. They count their people by who shares the meal. Evict them and the rock is yours. Or let them stay, and let their lamps burn.", "max": 280, "place": "choice body", "ru": "На астероидах, которые вы могли бы разрабатывать, живут семьи кочевников. В Общей книге их нет, и Бюро считает это их личным недостатком. Своих они считают по тем, кто делит трапезу. Выселите их, и камень ваш. Или позвольте им остаться и не гасите их лампы.", "title": "Pirates reduce trade"}, {"id": "EV19_EVICT_BTN", "group": "EV19", "text": "Evict the nomads", "max": 28, "place": "button", "ru": "Выселить кочевников", "title": "Pirates reduce trade"}, {"id": "EV19_EVICT_EFF", "group": "EV19", "text": "The asteroids open for mining. Some nomads turn to piracy, and pirates rise.", "max": 90, "place": "effect line", "ru": "Астероиды открываются для добычи. Часть кочевников уходит в пираты, и пиратов становится больше.", "title": "Pirates reduce trade"}, {"id": "EV19_STAY_BTN", "group": "EV19", "text": "Let them stay", "max": 28, "place": "button", "ru": "Позволить остаться", "title": "Pirates reduce trade"}, {"id": "EV19_STAY_EFF", "group": "EV19", "text": "The asteroids stay closed to mining. No pirates come of it.", "max": 90, "place": "effect line", "ru": "Астероиды остаются закрытыми для добычи. Пираты не появляются.", "title": "Pirates reduce trade"}, {"id": "EV19_EVICTED_TITLE", "group": "EV19", "text": "The asteroids are cleared", "max": 32, "place": "popup title", "ru": "Астероиды расчищены", "title": "Pirates reduce trade"}, {"id": "EV19_EVICTED", "group": "EV19", "text": "The nomads left on the next tide, without a word. The rock is yours to mine. Some did not go far, and now they keep ships and a grudge. Pirates rise. The empty tables were left set.", "max": 280, "place": "popup", "ru": "Кочевники ушли с ближайшим приливом, не сказав ни слова. Камень ваш, добывайте. Некоторые ушли недалеко, и теперь у них корабли и обида. Пиратов становится больше. Пустые столы остались накрытыми.", "title": "Pirates reduce trade"}, {"id": "EV19_STAYED_TITLE", "group": "EV19", "text": "The nomads stay", "max": 32, "place": "popup title", "ru": "Кочевники остаются", "title": "Pirates reduce trade"}, {"id": "EV19_STAYED", "group": "EV19", "text": "You let the nomads stay. Their lamps burn on the rock, small and steady, and they share a meal with the first ship that docks. The asteroids remain closed to mining.", "max": 280, "place": "popup", "ru": "Вы позволили кочевникам остаться. Их лампы горят на камне, маленькие и ровные, а с первым пристыковавшимся кораблём они делят трапезу. Астероиды остаются закрытыми для добычи.", "title": "Pirates reduce trade"}, {"id": "EV19_PIRATES_TITLE", "group": "EV19", "text": "Pirates reduce trade", "max": 32, "place": "popup title", "ru": "Пираты мешают торговле", "title": "Pirates reduce trade"}, {"id": "EV19_PIRATES", "group": "EV19", "text": "Pirates now work the lanes, and fewer cargoes get through. Trade volume falls while they stay. The Bureau has opened a file on them. It is a thin file, and so is the fleet behind it. Obedience is cheaper than love, and lasts as long.", "max": 280, "place": "popup", "ru": "Теперь на трассах хозяйничают пираты, и грузов доходит меньше. Объём торговли падает, пока они здесь. Бюро завело на них дело. Дело тонкое, и флот за ним такой же. Послушание обходится дешевле любви и длится столько же.", "title": "Pirates reduce trade"}, {"id": "EV19_HIRE_BTN", "group": "EV19", "text": "Hire a clearance crew", "max": 28, "place": "button", "ru": "Нанять расчистную бригаду", "title": "Pirates reduce trade"}, {"id": "EV19_HIRE_EFF", "group": "EV19", "text": "Pay to have the pirates cleared. It costs credits and removes their effect on trade.", "max": 90, "place": "effect line", "ru": "Заплатить за изгнание пиратов. Это стоит кредитов и снимает их влияние на торговлю.", "title": "Pirates reduce trade"}, {"id": "EV20_TITLE", "group": "EV20", "text": "An asteroid is approaching", "max": 32, "place": "choice title", "ru": "Приближается астероид", "tag": "[asteroid: offer]", "kind": "C", "title": "The asteroid passes"}, {"id": "EV20_BODY", "group": "EV20", "text": "A rock is coming in on a slow path, and the Bureau noticed it the way it notices everything: late. The state can turn it aside for a fee, and wants it known that it does so out of love. Refusing is a shorter form. Cask Cellar keeps Luxury stock safe from such a cut.", "max": 280, "place": "choice body", "ru": "Камень идёт по медленной траектории, и Бюро заметило его так, как замечает всё: поздно. Государство может отвести его за плату и просит помнить, что делает это из любви. Форма отказа короче. Cask Cellar оберегает запасы Luxury от такого удара.", "tag": "[asteroid: offer]", "kind": "C", "title": "The asteroid passes"}, {"id": "EV20_PAY_BTN", "group": "EV20", "text": "Pay the state", "max": 28, "place": "button", "ru": "Заплатить государству", "tag": "[asteroid: offer]", "kind": "C", "title": "The asteroid passes"}, {"id": "EV20_PAY_EFF", "group": "EV20", "text": "Cost: payment to the state. Asteroid dealt with. The company gains one expansion point.", "max": 90, "place": "effect line", "ru": "Цена: платёж государству. Астероид отведён. Компания получает единицу Skill points.", "tag": "[asteroid: offer]", "kind": "C", "title": "The asteroid passes"}, {"id": "EV20_DECLINE_BTN", "group": "EV20", "text": "Decline", "max": 28, "place": "button", "ru": "Отказаться", "tag": "[asteroid: offer]", "kind": "C", "title": "The asteroid passes"}, {"id": "EV20_DECLINE_EFF", "group": "EV20", "text": "An even chance: company storage is hit, or nothing happens.", "max": 90, "place": "effect line", "ru": "Шансы равны: Company storage пострадает или ничего не случится.", "tag": "[asteroid: offer]", "kind": "C", "title": "The asteroid passes"}, {"id": "EV20_PAID_TITLE", "group": "EV20", "text": "The asteroid is deflected", "max": 32, "place": "popup title", "ru": "Астероид отведён", "tag": "[asteroid: offer]", "kind": "C", "title": "The asteroid passes"}, {"id": "EV20_PAID", "group": "EV20", "text": "The state turned the rock aside and sent a receipt. The company gains one expansion point for the trouble. The asteroid drifts on, toward someone else's sky. A law is only as strong as the one who says: this is the law.", "max": 280, "place": "popup", "ru": "Государство отвело камень и прислало квитанцию. За хлопоты компания получает единицу Skill points. Астероид уходит дальше, к чужому небу. Закон силён лишь настолько, насколько силён тот, кто говорит: это закон.", "tag": "[asteroid: offer]", "kind": "C", "title": "The asteroid passes"}, {"id": "EV20_REWARD", "group": "EV20", "text": "Event reward: the asteroid is dealt with and the company gains an expansion point.", "max": 280, "place": "notice (shown after EV20_PAID)", "ru": "Награда за событие: астероид отведён, компания получает единицу Skill points.", "tag": "[asteroid: offer]", "kind": "C", "title": "The asteroid passes"}, {"id": "EV20_HIT_TITLE", "group": "EV20", "text": "Company storage destroyed", "max": 32, "place": "popup title", "ru": "Company storage разрушен", "tag": "[asteroid: offer]", "kind": "C", "title": "The asteroid passes"}, {"id": "EV20_HIT_DESTROYED", "group": "EV20", "text": "The asteroid struck {planet}. Your company storage there is gone, and what it held with it. The Bureau has recorded the loss as an adjustment of the Common Ledger. Nobody said sorry. Death takes what a life would still have held.", "max": 280, "place": "popup", "ru": "Астероид ударил по {planet}. Ваш Company storage там уничтожен, и всё, что в нём было, тоже. Бюро записало потерю как поправку Общей книги. Никто не извинился. Смерть забирает то, что жизнь ещё могла бы удержать.", "tag": "[asteroid: offer]", "kind": "C", "title": "The asteroid passes"}, {"id": "EV20_HIT_CAPACITY", "group": "EV20", "text": "The asteroid grazed {planet}. Your company storage there is cracked and holds less than before. The Bureau has recorded the damage as \"partial\". The crack runs through the wall in a straight, patient line.", "max": 280, "place": "popup", "ru": "Астероид задел {planet}. Ваш Company storage там треснул и вмещает меньше прежнего. Бюро записало ущерб как «частичный». Трещина идёт сквозь стену прямой, терпеливой линией.", "tag": "[asteroid: offer]", "kind": "C", "title": "The asteroid passes"}, {"id": "EV20_MISS_TITLE", "group": "EV20", "text": "The asteroid passes", "max": 32, "place": "popup title", "ru": "Астероид проходит мимо", "tag": "[asteroid: offer]", "kind": "C", "title": "The asteroid passes"}, {"id": "EV20_MISS", "group": "EV20", "text": "The asteroid passed the system and kept going. Nothing was hit and nothing changes. The Bureau withdrew its warning, with regret, and kept the form. You could have been struck right now. Let that decide how you read the next notice.", "max": 280, "place": "popup", "ru": "Астероид прошёл систему и полетел дальше. Ничего не задето, ничего не изменилось. Бюро с сожалением отозвало предупреждение, но бланк оставило себе. Вас могло ударить прямо сейчас. Пусть это решает, как вы прочтёте следующее уведомление.", "tag": "[asteroid: offer]", "kind": "C", "title": "The asteroid passes"}, {"id": "EV40_TITLE", "group": "EV40", "text": "Rivet guns pile up at Voltara", "max": 32, "place": "pool event title", "ru": "Заклёпочные пушки завалили Voltara", "title": "Rivet guns pile up at Voltara"}, {"id": "EV40_BODY", "group": "EV40", "text": "Voltara's foundry kept casting rivet guns after the Admiralty's order was filled, since its last line reads until victory. Stacks reach the roof. Rivet guns at Voltara cost less and pay less. A clerk asked if victory knew. Contract Doctrine softens Military price events.", "max": 280, "place": "pool event text", "ru": "Литейная Voltara продолжала отливать заклёпочные пушки после выполнения заказа Адмиралтейства, ведь её последняя строка гласит «до победы». Штабеля достают до крыши. Rivet guns на Voltara стоят дешевле и приносят меньше. Клерк спросил, знает ли об этом победа. Contract Doctrine смягчает удары цен Military по вам.", "title": "Rivet guns pile up at Voltara"}, {"id": "EV40_EFF", "group": "EV40", "text": "Rivals: no change in {market} strength or growth.", "max": 90, "place": "pool event rivals line, {market} filled by the game", "ru": "Соперники: strength и growth на рынке {market} не меняются.", "title": "Rivet guns pile up at Voltara"}, {"id": "EV41_TITLE", "group": "EV41", "text": "Pulse cells are recalled", "max": 32, "place": "pool event title", "ru": "Импульсные ячейки отзывают", "title": "Pulse cells are recalled"}, {"id": "EV41_BODY", "group": "EV41", "text": "A batch of pulse cells ran hot, and the maker pulled the lot. An engineer read the recall on each dock and begged every crate's pardon. Pulse cells at Ashgate cost more and pay more while the shelves stay bare. The notice says no one was harmed. It says so twice, like a prayer.", "max": 280, "place": "pool event text", "ru": "Партия импульсных ячеек перегрелась, и производитель отозвал всю партию. Инженер зачитывал отзыв на каждом причале и просил прощения у каждого ящика. Pulse cells на Ashgate стоят дороже и приносят больше, пока полки пусты. В извещении сказано, что никто не пострадал. Сказано дважды, как молитва.", "title": "Pulse cells are recalled"}, {"id": "EV41_EFF", "group": "EV41", "text": "Rivals: {market} strength and growth stay as they were.", "max": 90, "place": "pool event rivals line, {market} filled by the game", "ru": "Соперники: strength и growth на рынке {market} остаются прежними.", "title": "Pulse cells are recalled"}, {"id": "EV42_TITLE", "group": "EV42", "text": "Hull armour is requisitioned", "max": 32, "place": "pool event title", "ru": "Броневые плиты реквизированы", "title": "Hull armour is requisitioned"}, {"id": "EV42_BODY", "group": "EV42", "text": "The Admiralty wills every slab of hull armour to the front, by order of a clerk who has never seen a hull. Hull armour at Tillam costs more and pays more while shelves are bare. The Bureau entered the slabs as sanctified. They wait cold in a corridor, and the crew bow in passing.", "max": 280, "place": "pool event text", "ru": "Адмиралтейство желает, чтобы каждая плита брони ушла на фронт, по приказу клерка, который ни разу не видел корабля. Hull armour на Tillam стоит дороже и приносит больше, пока полки пусты. Бюро записало плиты как освящённые. Они стоят в коридоре, холодные, и экипаж кланяется им на ходу.", "title": "Hull armour is requisitioned"}, {"id": "EV42_EFF", "group": "EV42", "text": "Rivals: none of the three changes in {market}.", "max": 90, "place": "pool event rivals line, {market} filled by the game", "ru": "Соперники: ни у одного из трёх нет перемен на рынке {market}.", "title": "Hull armour is requisitioned"}, {"id": "EV43_TITLE", "group": "EV43", "text": "A glut of sunmusk", "max": 32, "place": "pool event title", "ru": "Избыток солнечного мускуса", "title": "A glut of sunmusk"}, {"id": "EV43_BODY", "group": "EV43", "text": "A convoy of sunmusk reached Tillam on one tide, and nobody had ordered it. Sunmusk at Tillam costs less and pays less. The scent hangs in the corridors, and the buyers cannot agree what it smells of. The Bureau calls that variety.", "max": 280, "place": "pool event text", "ru": "Караван солнечного мускуса пришёл на Tillam одним приливом, и никто его не заказывал. Sunmusk на Tillam стоит дешевле и приносит меньше. Запах висит в коридорах, и покупа
