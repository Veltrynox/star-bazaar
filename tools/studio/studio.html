тели не могут договориться, чем пахнет. Бюро называет это разнообразием.", "title": "A glut of sunmusk"}, {"id": "EV43_EFF", "group": "EV43", "text": "Rivals: no change in {market} strength or growth.", "max": 90, "place": "pool event rivals line, {market} filled by the game", "ru": "Соперники: strength и growth на рынке {market} не меняются.", "title": "A glut of sunmusk"}, {"id": "EV44_TITLE", "group": "EV44", "text": "Gem cutters are booked solid", "max": 32, "place": "pool event title", "ru": "Огранщики расписаны наперёд", "title": "Gem cutters are booked solid"}, {"id": "EV44_BODY", "group": "EV44", "text": "Ashgate's gem cutters are booked solid after a wedding season, and the queue has a queue. Cut glimmers at Ashgate cost more and pay more while the cutters catch up. In one shop a stone hums very softly, and is not for sale. Fine Finishing makes this pay clearly more.", "max": 280, "place": "pool event text", "ru": "Огранщики Ashgate расписаны наперёд после свадебного сезона, и у очереди есть своя очередь. Cut glimmers на Ashgate стоят дороже и приносят больше, пока огранщики наверстывают. В одной лавке камень тихо гудит и не продаётся. Fine Finishing заметно увеличивает здесь выплату.", "title": "Gem cutters are booked solid"}, {"id": "EV44_EFF", "group": "EV44", "text": "Rivals: {market} strength and growth stay as they were.", "max": 90, "place": "pool event rivals line, {market} filled by the game", "ru": "Соперники: strength и growth на рынке {market} остаются прежними.", "title": "Gem cutters are booked solid"}, {"id": "EV45_TITLE", "group": "EV45", "text": "Cask stock overflows the cellars", "max": 32, "place": "pool event title", "ru": "Бочки переполнили погреба", "title": "Cask stock overflows the cellars"}, {"id": "EV45_BODY", "group": "EV45", "text": "Ashgate's cellars filled with a record vintage, and nobody has the room to drink it. Vintage casks at Ashgate cost less and pay less. The cellar master has begun to give the casks names. Cask Cellar keeps Luxury stock safe from asteroid cuts.", "max": 280, "place": "pool event text", "ru": "Погреба Ashgate заполнил рекордный урожай вина, и пить его негде. Vintage casks на Ashgate стоят дешевле и приносят меньше. Мастер погреба начал давать бочкам имена. Cask Cellar оберегает запасы Luxury от ударов астероидов.", "title": "Cask stock overflows the cellars"}, {"id": "EV45_EFF", "group": "EV45", "text": "Rivals: none of the three changes in {market}.", "max": 90, "place": "pool event rivals line, {market} filled by the game", "ru": "Соперники: ни у одного из трёх нет перемен на рынке {market}.", "title": "Cask stock overflows the cellars"}, {"id": "EV46_TITLE", "group": "EV46", "text": "The smelter goes cold", "max": 32, "place": "pool event title", "ru": "Плавильня остыла", "title": "The smelter goes cold"}, {"id": "EV46_BODY", "group": "EV46", "text": "Voltara's smelter lost its heat to a cracked line, and the casting stopped. Ingot at Voltara costs more and pays more until the furnace is lit again. The crew stand by the dead furnace. The metal inside still ticks as it shrinks.", "max": 280, "place": "pool event text", "ru": "Плавильня Voltara потеряла жар из-за треснувшей линии, и литьё встало. Ingot на Voltara стоит дороже и приносит больше, пока печь не зажгут снова. Бригада стоит у мёртвой печи. Металл внутри всё ещё тикает, сжимаясь.", "title": "The smelter goes cold"}, {"id": "EV46_EFF", "group": "EV46", "text": "Rivals: no change in {market} strength or growth.", "max": 90, "place": "pool event rivals line, {market} filled by the game", "ru": "Соперники: strength и growth на рынке {market} не меняются.", "title": "The smelter goes cold"}, {"id": "EV47_TITLE", "group": "EV47", "text": "Alloy rolls off the line early", "max": 32, "place": "pool event title", "ru": "Сплав сошёл с линии раньше срока", "title": "Alloy rolls off the line early"}, {"id": "EV47_BODY", "group": "EV47", "text": "Voltara's line turned out seam alloy a week early, before the builders had placed an order. Seam alloy at Voltara costs less and pays less. The bales are stacked to the lamps, and a clerk is counting them for the third time. The count has not improved.", "max": 280, "place": "pool event text", "ru": "Линия Voltara выдала шовный сплав на неделю раньше, чем строители успели сделать заказ. Seam alloy на Voltara стоит дешевле и приносит меньше. Тюки сложены до самых ламп, а клерк считает их в третий раз. Счёт не стал лучше.", "title": "Alloy rolls off the line early"}, {"id": "EV47_EFF", "group": "EV47", "text": "Rivals: {market} strength and growth stay as they were.", "max": 90, "place": "pool event rivals line, {market} filled by the game", "ru": "Соперники: strength и growth на рынке {market} остаются прежними.", "title": "Alloy rolls off the line early"}, {"id": "EV48_TITLE", "group": "EV48", "text": "Fabric plate runs short", "max": 32, "place": "pool event title", "ru": "Не хватает плит Fabric", "title": "Fabric plate runs short"}, {"id": "EV48_BODY", "group": "EV48", "text": "Ashgate's builders drew a new ring of homes in a single week, and every wall is asked for plate. Lattice plate at Ashgate costs more and pays more. The draughtsmen call the plan final. The plates on the dock ring faintly when the wind turns.", "max": 280, "place": "pool event text", "ru": "Строители Ashgate начертили новое кольцо жилищ за одну неделю, и на каждую стену требуется плита. Lattice plate на Ashgate стоит дороже и приносит больше. Чертёжники называют план окончательным. Плиты на причале тихо звенят, когда меняется ветер.", "title": "Fabric plate runs short"}, {"id": "EV48_EFF", "group": "EV48", "text": "Rivals: none of the three changes in {market}.", "max": 90, "place": "pool event rivals line, {market} filled by the game", "ru": "Соперники: ни у одного из трёх нет перемен на рынке {market}.", "title": "Fabric plate runs short"}, {"id": "EV49_TITLE", "group": "EV49", "text": "Quarantine at the culture lab", "max": 32, "place": "pool event title", "ru": "Карантин в лаборатории культур", "title": "Quarantine at the culture lab"}, {"id": "EV49_BODY", "group": "EV49", "text": "A culture in Ashgate's lab grew a colour it was not meant to, and the doctors sealed the port. Routes touching Ashgate are blocked for a while. The notice says contained. The night shift counts heads hourly. One is short. Hardy Strains reopens a closed planet a cycle sooner.", "max": 280, "place": "pool event text", "ru": "Культура в лаборатории Ashgate выросла цвета, которого от неё не ждали, и врачи закрыли порт. Маршруты через Ashgate заблокированы на какое-то время. В извещении сказано: локализовано. Ночная смена каждый час пересчитывает людей. Одного не хватает. Hardy Strains открывает закрытую планету на цикл раньше.", "title": "Quarantine at the culture lab"}, {"id": "EV49_EFF", "group": "EV49", "text": "Rivals: no change in {market} strength or growth.", "max": 90, "place": "pool event rivals line, {market} filled by the game", "ru": "Соперники: strength и growth на рынке {market} не меняются.", "title": "Quarantine at the culture lab"}, {"id": "EV50_TITLE", "group": "EV50", "text": "Spores come in cheap", "max": 32, "place": "pool event title", "ru": "Споры подешевели", "title": "Spores come in cheap"}, {"id": "EV50_BODY", "group": "EV50", "text": "A damp season at Tillam raised spore cultures in every crate, more than anyone could sell. Spore cultures at Tillam cost less and pay less. The manager says the crates are fine. The crates sweat in rows, and the ones in the corner have grown a lid of their own.", "max": 280, "place": "pool event text", "ru": "Сырой сезон на Tillam вырастил споры в каждом ящике, больше, чем кто-либо мог продать. Spore cultures на Tillam стоят дешевле и приносят меньше. Управляющий говорит, что с ящиками всё в порядке. Ящики потеют рядами, а те, что в углу, обзавелись собственной крышкой.", "title": "Spores come in cheap"}, {"id": "EV50_EFF", "group": "EV50", "text": "Rivals: {market} strength and growth stay as they were.", "max": 90, "place": "pool event rivals line, {market} filled by the game", "ru": "Соперники: strength и growth на рынке {market} остаются прежними.", "title": "Spores come in cheap"}, {"id": "EV51_TITLE", "group": "EV51", "text": "Seed stock is bought up", "max": 32, "place": "pool event title", "ru": "Семенной запас раскуплен", "title": "Seed stock is bought up"}, {"id": "EV51_BODY", "group": "EV51", "text": "Tillam's clinics bought every crate of gene seed after one failed batch. Gene seed at Tillam costs more and pays more. The ward manager wrote that the failed batch is fine, and moved the ward to another floor. Culture Banks grow stored Biotech stock.", "max": 280, "place": "pool event text", "ru": "Клиники Tillam скупили все ящики gene seed после одной неудачной партии. Gene seed на Tillam стоит дороже и приносит больше. Заведующий палатой написал, что с неудачной партией всё в порядке, и перевёл палату на другой этаж. Culture Banks увеличивают запасы Biotech на хранении.", "title": "Seed stock is bought up"}, {"id": "EV51_EFF", "group": "EV51", "text": "Rivals: none of the three changes in {market}.", "max": 90, "place": "pool event rivals line, {market} filled by the game", "ru": "Соперники: ни у одного из трёх нет перемен на рынке {market}.", "title": "Seed stock is bought up"}, {"id": "EV_PST01_TITLE", "group": "EV_PST01", "text": "A dock that keeps a book", "max": 32, "place": "pending event title", "ru": "Док с книгой посетителей", "title": "The book stays shut"}, {"id": "EV_PST01_BODY", "group": "EV_PST01", "text": "The dock at {planet} keeps a visitors' book, and the clerk wants your name in it before the first crate moves. The book is old, with a ring of cold on its cover. Nobody can say who opened it.", "max": 280, "place": "pending event text", "ru": "На причале {planet} ведут книгу посетителей, и клерк хочет видеть ваше имя в ней до первого ящика. Книга старая, на обложке кольцо холода. Кто её открыл, никто не скажет.", "title": "The book stays shut"}, {"id": "EV_PST01_SIGN_BTN", "group": "EV_PST01", "text": "Sign the book", "max": 28, "place": "button", "ru": "Расписаться в книге", "title": "The book stays shut"}, {"id": "EV_PST01_SIGN_EFF", "group": "EV_PST01", "text": "The next post you build costs less.", "max": 90, "place": "effect line", "ru": "Следующий пост обойдётся дешевле.", "title": "The book stays shut"}, {"id": "EV_PST01_SIGN_TITLE", "group": "EV_PST01", "text": "The book is signed", "max": 32, "place": "popup title", "ru": "Книга подписана", "title": "The book stays shut"}, {"id": "EV_PST01_SIGN", "group": "EV_PST01", "text": "The clerk blotted your name and nodded, as if it had always been there. The next post you build costs less. On the page beside yours, someone else's handwriting changed.", "max": 280, "place": "popup", "ru": "Клерк промокнул ваше имя и кивнул, будто оно всегда там стояло. Следующий пост обойдётся дешевле. На странице рядом чей-то почерк сменился.", "title": "The book stays shut"}, {"id": "EV_PST01_LEAVE_BTN", "group": "EV_PST01", "text": "Leave without signing", "max": 28, "place": "button", "ru": "Уйти без подписи", "title": "The book stays shut"}, {"id": "EV_PST01_LEAVE_EFF", "group": "EV_PST01", "text": "Nothing changes.", "max": 90, "place": "effect line", "ru": "Ничего не меняется.", "title": "The book stays shut"}, {"id": "EV_PST01_LEAVE_TITLE", "group": "EV_PST01", "text": "The book stays shut", "max": 32, "place": "popup title", "ru": "Книга остаётся закрытой", "title": "The book stays shut"}, {"id": "EV_PST01_LEAVE", "group": "EV_PST01", "text": "You left the clerk waiting with the pen raised. Nothing changes. The clerk wrote a short line anyway, in a hand that did not look like the clerk's.", "max": 280, "place": "popup", "ru": "Вы ушли, а клерк так и остался с поднятым пером. Ничего не меняется. Одну короткую строку он всё же вписал, и почерк был не его.", "title": "The book stays shut"}, {"id": "EV_PST02_TITLE", "group": "EV_PST02", "text": "The Port Warden's stamp", "max": 32, "place": "pending event title", "ru": "Печать начальницы порта", "title": "The stamp takes its time"}, {"id": "EV_PST02_BODY", "group": "EV_PST02", "text": "Warden Ilsa Dorne of {planet} must inspect the new post before she may stamp its lease. She inspects slowly and with open joy. A gift would hurry her. Waiting would also work, in time.", "max": 280, "place": "pending event text", "ru": "Начальница порта {planet}, Илса Дорн, обязана осмотреть новый пост, прежде чем поставит печать на аренде. Она осматривает медленно и с открытой радостью. Подарок её поторопит. Ожидание тоже поможет, со временем.", "title": "The stamp takes its time"}, {"id": "EV_PST02_GIFT_BTN", "group": "EV_PST02", "text": "Send a gift", "max": 28, "place": "button", "ru": "Отправить подарок", "title": "The stamp takes its time"}, {"id": "EV_PST02_GIFT_EFF", "group": "EV_PST02", "text": "Pay a small sum. The next post builds faster.", "max": 90, "place": "effect line", "ru": "Заплатить небольшую сумму. Следующий пост строится быстрее.", "title": "The stamp takes its time"}, {"id": "EV_PST02_GIFT_TITLE", "group": "EV_PST02", "text": "The Warden is hurried", "max": 32, "place": "popup title", "ru": "Начальницу поторопили", "title": "The stamp takes its time"}, {"id": "EV_PST02_GIFT", "group": "EV_PST02", "text": "The gift went up the stairs and the stamp came down them, still wet. You paid a small sum. The next post builds faster. The Warden was not smiling anymore, which you took for gratitude.", "max": 280, "place": "popup", "ru": "Подарок ушёл наверх, а печать пришла вниз, ещё влажная. Вы заплатили небольшую сумму. Следующий пост строится быстрее. Начальница больше не улыбалась, и вы сочли это благодарностью.", "title": "The stamp takes its time"}, {"id": "EV_PST02_WAIT_BTN", "group": "EV_PST02", "text": "Wait for the stamp", "max": 28, "place": "button", "ru": "Ждать печать", "title": "The stamp takes its time"}, {"id": "EV_PST02_WAIT_EFF", "group": "EV_PST02", "text": "Nothing is paid. Prices at {planet} move a little for a while.", "max": 90, "place": "effect line", "ru": "Ничего не платить. Цены на {planet} какое-то время слегка сдвинутся.", "title": "The stamp takes its time"}, {"id": "EV_PST02_WAIT_TITLE", "group": "EV_PST02", "text": "The stamp takes its time", "max": 32, "place": "popup title", "ru": "Печать не торопится", "title": "The stamp takes its time"}, {"id": "EV_PST02_WAIT", "group": "EV_PST02", "text": "You waited. The Warden inspected every rivet and then the shadows between them. Nothing was paid. Prices at {planet} move a little for a while, and the Warden will not say which way.", "max": 280, "place": "popup", "ru": "Вы ждали. Начальница осмотрела каждую заклёпку, затем тени между ними. Вы ничего не заплатили. Цены на {planet} какое-то время слегка сдвинутся, а в какую сторону, начальница не скажет.", "title": "The stamp takes its time"}, {"id": "EV_PST03_TITLE", "group": "EV_PST03", "text": "The beam will not hold", "max": 32, "place": "pending event title", "ru": "Луч не держится", "title": "The shift has an idea"}, {"id": "EV_PST03_BODY", "group": "EV_PST03", "text": "The survey beam at {planet} will not hold a line, and the foreman blames the weather, which is indoors. A part can be bought from a passing hauler. Or you can wait for the next shift to have an idea.", "max": 280, "place": "pending event text", "ru": "Съёмочный луч на {planet} не держит линию, и бригадир винит погоду, которая стоит в помещении. Деталь можно купить у проходящего грузовоза. Или дождаться, когда следующая смена придумает что-нибудь.", "title": "The shift has an idea"}, {"id": "EV_PST03_PART_BTN", "group": "EV_PST03", "text": "Buy the part", "max": 28, "place": "button", "ru": "Купить деталь", "title": "The shift has an idea"}, {"id": "EV_PST03_PART_EFF", "group": "EV_PST03", "text": "Pay a small sum. The next post builds faster.", "max": 90, "place": "effect line", "ru": "Заплатить небольшую сумму. Следующий пост строится быстрее.", "title": "The shift has an idea"}, {"id": "EV_PST03_PART_TITLE", "group": "EV_PST03", "text": "The part is fitted", "max": 32, "place": "popup title", "ru": "Деталь поставлена", "title": "The shift has an idea"}, {"id": "EV_PST03_PART", "group": "EV_PST03", "text": "The hauler's mate named a price and you paid a small sum. The beam held its line by evening. The next post builds faster, since the crew now knows where the weather comes from.", "max": 280, "place": "popup", "ru": "Помощник с грузовоза назвал цену, и вы заплатили небольшую сумму. К вечеру луч держал линию. Следующий пост строится быстрее: бригада теперь знает, откуда берётся погода.", "title": "The shift has an idea"}, {"id": "EV_PST03_SHIFT_BTN", "group": "EV_PST03", "text": "Wait for the next shift", "max": 28, "place": "button", "ru": "Ждать следующую смену", "title": "The shift has an idea"}, {"id": "EV_PST03_SHIFT_EFF", "group": "EV_PST03", "text": "Nothing changes.", "max": 90, "place": "effect line", "ru": "Ничего не меняется.", "title": "The shift has an idea"}, {"id": "EV_PST03_SHIFT_TITLE", "group": "EV_PST03", "text": "The shift has an idea", "max": 32, "place": "popup title", "ru": "У смены есть идея", "title": "The shift has an idea"}, {"id": "EV_PST03_SHIFT", "group": "EV_PST03", "text": "The next shift had an idea, and it was to wait for the one after. Nothing changes. The beam flickered, once, in a direction nobody had aimed it.", "max": 280, "place": "popup", "ru": "У следующей смены появилась идея: дождаться ещё одной. Ничего не меняется. Луч мигнул один раз в сторону, куда его никто не наводил.", "title": "The shift has an idea"}, {"id": "EV_PST04_TITLE", "group": "EV_PST04", "text": "A broker with spare fittings", "max": 32, "place": "pending event title", "ru": "Брокер с лишней фурнитурой", "title": "Pell packs his tray"}, {"id": "EV_PST04_BODY", "group": "EV_PST04", "text": "A broker named Odo Pell meets your ship at {planet} with a tray of seals and a lease. A neighbouring post closed, and its fittings are cheap. He talks as if the sale were already done. It might be.", "max": 280, "place": "pending event text", "ru": "Брокер Одо Пелл встречает ваш корабль на {planet} с подносом печатей и договором. Соседний пост закрылся, и его оснастка дёшева. Он говорит так, словно сделка уже совершена. Возможно, так и есть.", "title": "Pell packs his tray"}, {"id": "EV_PST04_BUY_BTN", "group": "EV_PST04", "text": "Buy the fittings", "max": 28, "place": "button", "ru": "Купить оснастку", "title": "Pell packs his tray"}, {"id": "EV_PST04_BUY_EFF", "group": "EV_PST04", "text": "Pay a small sum. The next post costs less.", "max": 90, "place": "effect line", "ru": "Заплатить небольшую сумму. Следующий пост обойдётся дешевле.", "title": "Pell packs his tray"}, {"id": "EV_PST04_BUY_TITLE", "group": "EV_PST04", "text": "The fittings change hands", "max": 32, "place": "popup title", "ru": "Оснастка меняет хозяина", "title": "Pell packs his tray"}, {"id": "EV_PST04_BUY", "group": "EV_PST04", "text": "Pell counted the seals twice and gave you one extra, as a courtesy. You paid a small sum. The next post costs less. The fittings are warm, as if someone had only just let go of them.", "max": 280, "place": "popup", "ru": "Пелл дважды пересчитал печати и из вежливости отдал лишнюю. Вы заплатили небольшую сумму. Следующий пост обойдётся дешевле. Оснастка тёплая, будто кто-то только что выпустил её из рук.", "title": "Pell packs his tray"}, {"id": "EV_PST04_PASS_BTN", "group": "EV_PST04", "text": "Pass on the offer", "max": 28, "place": "button", "ru": "Отказаться", "title": "Pell packs his tray"}, {"id": "EV_PST04_PASS_EFF", "group": "EV_PST04", "text": "Nothing changes.", "max": 90, "place": "effect line", "ru": "Ничего не меняется.", "title": "Pell packs his tray"}, {"id": "EV_PST04_PASS_TITLE", "group": "EV_PST04", "text": "Pell packs his tray", "max": 32, "place": "popup title", "ru": "Пелл собирает поднос", "title": "Pell packs his tray"}, {"id": "EV_PST04_PASS", "group": "EV_PST04", "text": "Pell shrugged and packed his tray. Nothing changes. He said the fittings would find a buyer, and looked at the sky as if the buyer were already on the way.", "max": 280, "place": "popup", "ru": "Пелл пожал плечами и собрал поднос. Ничего не меняется. Он сказал, что оснастка найдёт покупателя, и посмотрел в небо, будто покупатель уже летит.", "title": "Pell packs his tray"}, {"id": "EV_PST05_TITLE", "group": "EV_PST05", "text": "A desk already stands here", "max": 32, "place": "pending event title", "ru": "Стойка уже стоит", "title": "Two seals on one wall"}, {"id": "EV_PST05_BODY", "group": "EV_PST05", "text": "A desk with the seal of {bot3} already stands on the dock at {planet}. It has a kettle, a stool and a long record of waiting. The agent offers you the next stool. He does not offer to move.", "max": 280, "place": "pending event text", "ru": "На причале {planet} уже стоит стойка с печатью {bot3}. На ней чайник, табурет и длинная история ожидания. Агент предлагает вам следующий табурет. Подвинуться он не предлагает.", "title": "Two seals on one wall"}, {"id": "EV_PST05_SHARE_BTN", "group": "EV_PST05", "text": "Share the dock", "max": 28, "place": "button", "ru": "Делить причал", "title": "Two seals on one wall"}, {"id": "EV_PST05_SHARE_EFF", "group": "EV_PST05", "text": "Nothing is paid. Prices at {planet} move a little for a while.", "max": 90, "place": "effect line", "ru": "Ничего не платить. Цены на {planet} какое-то время слегка сдвинутся.", "title": "Two seals on one wall"}, {"id": "EV_PST05_SHARE_TITLE", "group": "EV_PST05", "text": "The dock is shared", "max": 32, "place": "popup title", "ru": "Причал поделен", "title": "Two seals on one wall"}, {"id": "EV_PST05_SHARE", "group": "EV_PST05", "text": "You took the next stool. The agent poured two cups and drank both. Nothing was paid. Prices at {planet} move a little for a while, and the agent keeps the direction to himself.", "max": 280, "place": "popup", "ru": "Вы заняли следующий табурет. Агент налил две чашки и выпил обе. Вы ничего не заплатили. Цены на {planet} какое-то время слегка сдвинутся, а куда, агент держит при себе.", "title": "Two seals on one wall"}, {"id": "EV_PST05_SEAL_BTN", "group": "EV_PST05", "text": "Hang your own seal", "max": 28, "place": "button", "ru": "Повесить свою печать", "title": "Two seals on one wall"}, {"id": "EV_PST05_SEAL_EFF", "group": "EV_PST05", "text": "Pay a small sum. Prices at {planet} move clearly for a while.", "max": 90, "place": "effect line", "ru": "Заплатить небольшую сумму. Цены на {planet} какое-то время заметно сдвинутся.", "title": "Two seals on one wall"}, {"id": "EV_PST05_SEAL_TITLE", "group": "EV_PST05", "text": "Two seals on one wall", "max": 32, "place": "popup title", "ru": "Две печати на одной стене", "title": "Two seals on one wall"}, {"id": "EV_PST05_SEAL", "group": "EV_PST05", "text": "You paid a small sum and hung your seal beside the other. The agent studied it as if it were a price. Prices at {planet} move clearly for a while. The kettle went cold between the seals.", "max": 280, "place": "popup", "ru": "Вы заплатили небольшую сумму и повесили печать рядом с чужой. Агент рассматривал её как цену. Цены на {planet} какое-то время заметно сдвинутся. Чайник остыл между печатями.", "title": "Two seals on one wall"}, {"id": "EV_PST06_TITLE", "group": "EV_PST06", "text": "Residents come to look", "max": 32, "place": "pending event title", "ru": "Жители приходят посмотреть", "title": "The rows thin out"}, {"id": "EV_PST06_BODY", "group": "EV_PST06", "text": "Residents of {planet} gather at the new post and stand in rows. A child asks whether it will stay. The clerk says that is a question for the Plan. Nobody leaves until someone says something.", "max": 280, "place": "pending event text", "ru": "Жители {planet} собираются у нового поста и стоят рядами. Ребёнок спрашивает, останется ли он. Клерк отвечает, что это вопрос к Плану. Никто не уходит, пока кто-нибудь не скажет хоть слово.", "title": "The rows thin out"}, {"id": "EV_PST06_OPEN_BTN", "group": "EV_PST06", "text": "Hold an open dock", "max": 28, "place": "button", "ru": "Открыть причал для всех", "title": "The rows thin out"}, {"id": "EV_PST06_OPEN_EFF", "group": "EV_PST06", "text": "Pay a small sum. The next post builds faster.", "max": 90, "place": "effect line", "ru": "Заплатить небольшую сумму. Следующий пост строится быстрее.", "title": "The rows thin out"}, {"id": "EV_PST06_OPEN_TITLE", "group": "EV_PST06", "text": "The dock stays open", "max": 32, "place": "popup title", "ru": "Причал открыт", "title": "The rows thin out"}, {"id": "EV_PST06_OPEN", "group": "EV_PST06", "text": "You set out chairs and a schedule, and the rows turned into a queue. You paid a small sum. The next post builds faster, since this crowd now knows the work. The child left with a bolt in her pocket.", "max": 280, "place": "popup", "ru": "Вы расставили стулья и вывесили расписание, и ряды стали очередью. Вы заплатили небольшую сумму. Следующий пост строится быстрее: эта толпа теперь знает работу. Девочка ушла с болтом в кармане.", "title": "The rows thin out"}, {"id": "EV_PST06_WORK_BTN", "group": "EV_PST06", "text": "Keep to the work", "max": 28, "place": "button", "ru": "Заняться делом", "title": "The rows thin out"}, {"id": "EV_PST06_WORK_EFF", "group": "EV_PST06", "text": "You gain a small sum from early trade.", "max": 90, "place": "effect line", "ru": "Вы получаете небольшую сумму от первой торговли.", "title": "The rows thin out"}, {"id": "EV_PST06_WORK_TITLE", "group": "EV_PST06", "text": "The rows thin out", "max": 32, "place": "popup title", "ru": "Ряды редеют", "title": "The rows thin out"}, {"id": "EV_PST06_WORK", "group": "EV_PST06", "text": "You kept to the work and the rows thinned by dusk. You gain a small sum from early trade. The child watched until the last crate was stamped, and then stamped nothing, politely.", "max": 280, "place": "popup", "ru": "Вы занялись делом, и к сумеркам ряды поредели. Вы получаете небольшую сумму от первой торговли. Девочка смотрела, пока не проштемпелевали последний ящик, а потом вежливо не проштемпелевала ничего.", "title": "The rows thin out"}, {"id": "EV_PLT01_TITLE", "group": "EV_PLT01", "text": "Who works the dark", "max": 32, "place": "pending event title", "ru": "Кто работает в темноте", "title": "The day crew stays"}, {"id": "EV_PLT01_BODY", "group": "EV_PLT01", "text": "A crew from the Bureau's labour desk reaches the new platform on {planet}. They came for the pay and stay for the quiet. The foreman asks what to call a shift that never ends. No one has a form for it.", "max": 280, "place": "pending event text", "ru": "Бригада из трудового отдела Бюро прибывает на новую платформу на {planet}. Они пришли за платой, а остаются ради тишины. Бригадир спрашивает, как назвать смену, которая не кончается. Бланка на этот случай нет.", "title": "The day crew stays"}, {"id": "EV_PLT01_NIGHT_BTN", "group": "EV_PLT01", "text": "Hire the night crew", "max": 28, "place": "button", "ru": "Нанять ночную бригаду", "title": "The day crew stays"}, {"id": "EV_PLT01_NIGHT_EFF", "group": "EV_PLT01", "text": "Pay a small sum. Some mined goods are added to your stock.", "max": 90, "place": "effect line", "ru": "Заплатить небольшую сумму. В ваши запасы добавится добытый груз.", "title": "The day crew stays"}, {"id": "EV_PLT01_NIGHT_TITLE", "group": "EV_PLT01", "text": "The night crew signs on", "max": 32, "place": "popup title", "ru": "Ночная бригада нанята", "title": "The day crew stays"}, {"id": "EV_PLT01_NIGHT", "group": "EV_PLT01", "text": "The night crew signed on without reading. You paid a small sum, and by morning some mined goods lay in your stock, stacked with great care. The foreman named the shift Always. It stuck.", "max": 280, "place": "popup", "ru": "Ночная бригада подписала бумаги не читая. Вы заплатили небольшую сумму, а к утру добытый груз лежал в запасах, уложенный с большой заботой. Бригадир назвал смену Всегда. Прижилось.", "title": "The day crew stays"}, {"id": "EV_PLT01_DAY_BTN", "group": "EV_PLT01", "text": "Keep the day crew", "max": 28, "place": "button", "ru": "Оставить дневную бригаду", "title": "The day crew stays"}, {"id": "EV_PLT01_DAY_EFF", "group": "EV_PLT01", "text": "Nothing changes.", "max": 90, "place": "effect line", "ru": "Ничего не меняется.", "title": "The day crew stays"}, {"id": "EV_PLT01_DAY_TITLE", "group": "EV_PLT01", "text": "The day crew stays", "max": 32, "place": "popup title", "ru": "Дневная бригада остаётся", "title": "The day crew stays"}, {"id": "EV_PLT01_DAY", "group": "EV_PLT01", "text": "You kept the day crew. Nothing changes. At change of shift the foreman counted the lamps going out and the lamps coming on, and got two different answers.", "max": 280, "place": "popup", "ru": "Вы оставили дневную бригаду. Ничего не меняется. На смене бригадир сосчитал гаснущие лампы и загорающиеся, и получил два разных ответа.", "title": "The day crew stays"}, {"id": "EV_PLT02_TITLE", "group": "EV_PLT02", "text": "The roof sings", "max": 32, "place": "pending event title", "ru": "Кровля поёт", "title": "The gallery is sealed"}, {"id": "EV_PLT02_BODY", "group": "EV_PLT02", "text": "A gallery at {planet} sings before it fails, a low note, held. The crew is out and the rock is still. Props cost credits. Sealing the gallery costs time. The note has not stopped.", "max": 280, "place": "pending event text", "ru": "Штрек на {planet} поёт перед тем, как рухнуть: низкая нота, ровная. Бригада вышла, камень стоит смирно. Крепь стоит кредитов. Закрыть штрек стоит времени. Нота не смолкает.", "title": "The gallery is sealed"}, {"id": "EV_PLT02_PROP_BTN", "group": "EV_PLT02", "text": "Pay for props", "max": 28, "place": "button", "ru": "Заплатить за крепь", "title": "The gallery is sealed"}, {"id": "EV_PLT02_PROP_EFF", "group": "EV_PLT02", "text": "Pay a small sum. Routes from {planet} keep running.", "max": 90, "place": "effect line", "ru": "Заплатить небольшую сумму. Маршруты с {planet} продолжают работать.", "title": "The gallery is sealed"}, {"id": "EV_PLT02_PROP_TITLE", "group": "EV_PLT02", "text": "The props go in", "max": 32, "place": "popup title", "ru": "Крепь поставлена", "title": "The gallery is sealed"}, {"id": "EV_PLT02_PROP", "group": "EV_PLT02", "text": "The props went in under the sound and the sound let them. You paid a small sum. Routes from {planet} keep running. The note dropped a step, the way a voice does when it has been understood.", "max": 280, "place": "popup", "ru": "Крепь встала под звук, и звук её пропустил. Вы заплатили небольшую сумму. Маршруты с {planet} продолжают работать. Нота опустилась на ступень, как голос, которого поняли.", "title": "The gallery is sealed"}, {"id": "EV_PLT02_SEAL_BTN", "group": "EV_PLT02", "text": "Seal the gallery", "max": 28, "place": "button", "ru": "Закрыть штрек", "title": "The gallery is sealed"}, {"id": "EV_PLT02_SEAL_EFF", "group": "EV_PLT02", "text": "Nothing is paid. Routes touching {planet} are blocked for a while.", "max": 90, "place": "effect line", "ru": "Ничего не платить. Маршруты через {planet} какое-то время заблокированы.", "title": "The gallery is sealed"}, {"id": "EV_PLT02_SEAL_TITLE", "group": "EV_PLT02", "text": "The gallery is sealed", "max": 32, "place": "popup title", "ru": "Штрек закрыт", "title": "The gallery is sealed"}, {"id": "EV_PLT02_SEAL", "group": "EV_PLT02", "text": "The crew sealed the gallery with slabs and tape. Nothing was paid. Routes touching {planet} are blocked for a while. Behind the slabs the note went on, patient, like a tenant.", "max": 280, "place": "popup", "ru": "Бригада закрыла штрек плитами и лентой. Вы ничего не заплатили. Маршруты через {planet} какое-то время заблокированы. За плитами нота шла дальше, терпеливо, как жилец.", "title": "The gallery is sealed"}, {"id": "EV_PLT03_TITLE", "group": "EV_PLT03", "text": "A seam no one logged", "max": 32, "place": "pending event title", "ru": "Жила, которой нет в списках", "title": "The find stays quiet"}, {"id": "EV_PLT03_BODY", "group": "EV_PLT03", "text": "The drill at {planet} broke into a seam the old surveys never entered, as if they had looked away. It is bright, cold and heavier than it should be. The Bureau has not been told yet.", "max": 280, "place": "pending event text", "ru": "Бур на {planet} пробил жилу, куда старые съёмки не заходили, будто отводили глаза. Она яркая, холодная и тяжелее, чем должна быть. Бюро пока не сообщили.", "title": "The find stays quiet"}, {"id": "EV_PLT03_LOG_BTN", "group": "EV_PLT03", "text": "Log the find", "max": 28, "place": "button", "ru": "Внести находку в реестр", "title": "The find stays quiet"}, {"id": "EV_PLT03_LOG_EFF", "group": "EV_PLT03", "text": "You gain a small sum as a finder's share.", "max": 90, "place": "effect line", "ru": "Вы получаете небольшую сумму как долю нашедшего.", "title": "The find stays quiet"}, {"id": "EV_PLT03_LOG_TITLE", "group": "EV_PLT03", "text": "The find is logged", "max": 32, "place": "popup title", "ru": "Находка внесена", "title": "The find stays quiet"}, {"id": "EV_PLT03_LOG", "group": "EV_PLT03", "text": "The Bureau stamped the find within the hour, which no one had ever seen. You gain a small sum as a finder's share. The seam now has a number, and the number, quietly, has a seam.", "max": 280, "place": "popup", "ru": "Бюро поставило печать на находку в течение часа, чего раньше не видел никто. Вы получаете небольшую сумму как долю нашедшего. У жилы теперь есть номер, а у номера, тихо, есть жила.", "title": "The find stays quiet"}, {"id": "EV_PLT03_HIDE_BTN", "group": "EV_PLT03", "text": "Keep it off the books", "max": 28, "place": "button", "ru": "Оставить вне книг", "title": "The find stays quiet"}, {"id": "EV_PLT03_HIDE_EFF", "group": "EV_PLT03", "text": "Some mined goods are added to your stock.", "max": 90, "place": "effect line", "ru": "В ваши запасы добавится добытый груз.", "title": "The find stays quiet"}, {"id": "EV_PLT03_HIDE_TITLE", "group": "EV_PLT03", "text": "The find stays quiet", "max": 32, "place": "popup title", "ru": "Находка остаётся тихой", "title": "The find stays quiet"}, {"id": "EV_PLT03_HIDE", "group": "EV_PLT03", "text": "The crew filled three carts before the shift bell and told no one. Some mined goods are added to your stock. The seam is still bright in the dark, and still cold on the hand.", "max": 280, "place": "popup", "ru": "Бригада наполнила три тележки до звонка смены и никому не сказала. В ваши запасы добавится добытый груз. Жила всё так же ярка в темноте и так же холодна на ощупь.", "title": "The find stays quiet"}, {"id": "EV_PLT04_TITLE", "group": "EV_PLT04", "text": "The hum under the floor", "max": 32, "place": "pending event title", "ru": "Гул под полом", "title": "The lamps stay lit"}, {"id": "EV_PLT04_BODY", "group": "EV_PLT04", "text": "The floor of the platform on {planet} hums while the crew sleeps. Engineers measure a steady note, the same each night. The shift lead asks to switch off the lamps. She does not say why.", "max": 280, "place": "pending event text", "ru": "Пол платформы на {planet} гудит, пока бригада спит. Инженеры измеряют ровную ноту, одну и ту же каждую ночь. Старшая смены просит погасить лампы. Почему, она не говорит.", "title": "The lamps stay lit"}, {"id": "EV_PLT04_DARK_BTN", "group": "EV_PLT04", "text": "Switch off the lamps", "max": 28, "place": "button", "ru": "Погасить лампы", "title": "The lamps stay lit"}, {"id": "EV_PLT04_DARK_EFF", "group": "EV_PLT04", "text": "Prices at {planet} move a little for a while.", "max": 90, "place": "effect line", "ru": "Цены на {planet} какое-то время слегка сдвинутся.", "title": "The lamps stay lit"}, {"id": "EV_PLT04_DARK_TITLE", "group": "EV_PLT04", "text": "The lamps go out", "max": 32, "place": "popup title", "ru": "Лампы погашены", "title": "The lamps stay lit"}, {"id": "EV_PLT04_DARK", "group": "EV_PLT04", "text": "The lamps went out and the hum thinned, then stopped, as if it only wanted company. Prices at {planet} move a little for a while, and the shift lead will not say which way. She slept well.", "max": 280, "place": "popup", "ru": "Лампы погасли, и гул стал тоньше, а потом смолк, будто хотел лишь компании. Цены на {planet} какое-то время слегка сдвинутся, а куда, старшая не скажет. Спала она хорошо.", "title": "The lamps stay lit"}, {"id": "EV_PLT04_LIGHT_BTN", "group": "EV_PLT04", "text": "Keep the lamps on", "max": 28, "place": "button", "ru": "Оставить лампы", "title": "The lamps stay lit"}, {"id": "EV_PLT04_LIGHT_EFF", "group": "EV_PLT04", "text": "Nothing changes.", "max": 90, "place": "effect line", "ru": "Ничего не меняется.", "title": "The lamps stay lit"}, {"id": "EV_PLT04_LIGHT_TITLE", "group": "EV_PLT04", "text": "The lamps stay lit", "max": 32, "place": "popup title", "ru": "Лампы горят", "title": "The lamps stay lit"}, {"id": "EV_PLT04_LIGHT", "group": "EV_PLT04", "text": "You kept the lamps on. Nothing changes. The hum went on all night. In the morning the engineers found it a little louder, and wrote down that it was not.", "max": 280, "place": "popup", "ru": "Вы оставили лампы. Ничего не меняется. Гул шёл всю ночь. Утром инженеры нашли его чуть громче и записали, что нет.", "title": "The lamps stay lit"}, {"id": "EV_FLT01_TITLE", "group": "EV_FLT01", "text": "A wreck on the lane", "max": 32, "place": "pending event title", "ru": "Обломок на трассе", "title": "The wreck falls behind"}, {"id": "EV_FLT01_BODY", "group": "EV_FLT01", "text": "A hull drifts across the lane, cold, its name scraped off. The Pathfinder's scanner counts no one aboard, then counts again. A tow would delay the flight. Salvage is salvage, if nobody comes to claim it.", "max": 280, "place": "pending event text", "ru": "Корпус дрейфует поперёк трассы, холодный, с содранным именем. Сканер Pathfinder насчитал на борту никого, потом пересчитал. Буксировка задержит полёт. Добыча есть добыча, если за ней никто не придёт.", "title": "The wreck falls behind"}, {"id": "EV_FLT01_TOW_BTN", "group": "EV_FLT01", "text": "Tow it clear", "max": 28, "place": "button", "ru": "Оттащить", "title": "The wreck falls behind"}, {"id": "EV_FLT01_TOW_EFF", "group": "EV_FLT01", "text": "The flight is delayed a little. You gain a small sum for the salvage.", "max": 90, "place": "effect line", "ru": "Полёт немного задержится. Вы получаете небольшую сумму за добычу.", "title": "The wreck falls behind"}, {"id": "EV_FLT01_TOW_TITLE", "group": "EV_FLT01", "text": "The wreck is cleared", "max": 32, "place": "popup title", "ru": "Обломок убран", "title": "The wreck falls behind"}, {"id": "EV_FLT01_TOW", "group": "EV_FLT01", "text": "The Pathfinder dragged the hull out of the lane and the flight lost a little time. You gain a small sum for the salvage. The scanner counted one aboard as the hull went. It did not count again.", "max": 280, "place": "popup", "ru": "Pathfinder вытащил корпус с трассы, и полёт потерял немного времени. Вы получаете небольшую сумму за добычу. Когда корпус уходил, сканер насчитал одного на борту. Пересчитывать не стал.", "title": "The wreck falls behind"}, {"id": "EV_FLT01_FLY_BTN", "group": "EV_FLT01", "text": "Fly on", "max": 28, "place": "button", "ru": "Лететь дальше", "title": "The wreck falls behind"}, {"id": "EV_FLT01_FLY_EFF", "group": "EV_FLT01", "text": "Nothing changes.", "max": 90, "place": "effect line", "ru": "Ничего не меняется.", "title": "The wreck falls behind"}, {"id": "EV_FLT01_FLY_TITLE", "group": "EV_FLT01", "text": "The wreck falls behind", "max": 32, "place": "popup title", "ru": "Обломок остаётся позади", "title": "The wreck falls behind"}, {"id": "EV_FLT01_FLY", "group": "EV_FLT01", "text": "The Pathfinder flew on. Nothing changes. In the rear glass the hull turned slowly, showing its scraped patch, then its other side.", "max": 280, "place": "popup", "ru": "Pathfinder полетел дальше. Ничего не меняется. В заднем стекле корпус медленно поворачивался, показывая содранное место, потом другой бок.", "title": "The wreck falls behind"}, {"id": "EV_FLT02_TITLE", "group": "EV_FLT02", "text": "A call on an old band", "max": 32, "place": "pending event title", "ru": "Вызов на старой частоте", "title": "The call fades"}, {"id": "EV_FLT02_BODY", "group": "EV_FLT02", "text": "A distress call comes in on an old band, the voice polite and unhurried. By the time the Pathfinder turns, the call has become a recipe. A relay fee would let you check it from here.", "max": 280, "place": "pending event text", "ru": "На старой частоте приходит сигнал бедствия, голос вежливый и неспешный. Пока Pathfinder разворачивается, сигнал превращается в рецепт. За плату ретранслятор проверит его отсюда.", "title": "The call fades"}, {"id": "EV_FLT02_RELAY_BTN", "group": "EV_FLT02", "text": "Pay the relay fee", "max": 28, "place": "button", "ru": "Заплатить за ретранслятор", "title": "The call fades"}, {"id": "EV_FLT02_RELAY_EFF", "group": "EV_FLT02", "text": "Pay a small sum. The flight is not delayed.", "max": 90, "place": "effect line", "ru": "Заплатить небольшую сумму. Полёт не задержится.", "title": "The call fades"}, {"id": "EV_FLT02_RELAY_TITLE", "group": "EV_FLT02", "text": "The relay answers", "max": 32, "place": "popup title", "ru": "Ретранслятор отвечает", "title": "The call fades"}, {"id": "EV_FLT02_RELAY", "group": "EV_FLT02", "text": "You paid a small sum, and the relay checked the band without a turn. The flight is not delayed. The relay reported a pot, a stove and a very long wait. It filed the call as cooked.", "max": 280, "place": "popup", "ru": "Вы заплатили небольшую сумму, и ретранслятор проверил частоту без разворота. Полёт не задержится. Ретранслятор доложил о кастрюле, плите и очень долгом ожидании. Вызов он занёс как приготовленный.", "title": "The call fades"}, {"id": "EV_FLT02_HOLD_BTN", "group": "EV_FLT02", "text": "Hold the course", "max": 28, "place": "button", "ru": "Держать курс", "title": "The call fades"}, {"id": "EV_FLT02_HOLD_EFF", "group": "EV_FLT02", "text": "Nothing changes.", "max": 90, "place": "effect line", "ru": "Ничего не меняется.", "title": "The call fades"}, {"id": "EV_FLT02_HOLD_TITLE", "group": "EV_FLT02", "text": "The call fades", "max": 32, "place": "popup title", "ru": "Вызов стихает", "title": "The call fades"}, {"id": "EV_FLT02_HOLD", "group": "EV_FLT02", "text": "You held the course. Nothing changes. The voice went on a while with the recipe, then said the last step twice, very slowly, and was gone.", "max": 280, "place": "popup", "ru": "Вы держали курс. Ничего не меняется. Голос ещё немного читал рецепт, потом дважды произнёс последний шаг, очень медленно, и пропал.", "title": "The call fades"}, {"id": "EV_FLT03_TITLE", "group": "EV_FLT03", "text": "A toll on the lane", "max": 32, "place": "pending event title", "ru": "Пошлина на трассе", "title": "The long way"}, {"id": "EV_FLT03_BODY", "group": "EV_FLT03", "text": "A patrol cutter hails the Pathfinder. It says the lane is private and has been since the cutter was painted. A toll is asked, politely. The cutter's gun looks at the toll, not at you.", "max": 280, "place": "pending event text", "ru": "Патрульный катер вызывает Pathfinder. Он сообщает, что трасса частная и была такой с тех пор, как катер покрасили. Пошлину просят вежливо. Пушка катера смотрит на пошлину, а не на вас.", "title": "The long way"}, {"id": "EV_FLT03_PAY_BTN", "group": "EV_FLT03", "text": "Pay the toll", "max": 28, "place": "button", "ru": "Заплатить пошлину", "title": "The long way"}, {"id": "EV_FLT03_PAY_EFF", "group": "EV_FLT03", "text": "Pay a small sum. The flight goes on.", "max": 90, "place": "effect line", "ru": "Заплатить небольшую сумму. Полёт продолжается.", "title": "The long way"}, {"id": "EV_FLT03_PAY_TITLE", "group": "EV_FLT03", "text": "The toll is paid", "max": 32, "place": "popup title", "ru": "Пошлина уплачена", "title": "The long way"}, {"id": "EV_FLT03_PAY", "group": "EV_FLT03", "text": "You paid a small sum and the cutter blinked twice, which is how it says thank you. The flight goes on. The gun turned away last, like someone leaving a room backwards.", "max": 280, "place": "popup", "ru": "Вы заплатили небольшую сумму, и катер дважды мигнул: так он говорит спасибо. Полёт продолжается. Пушка отвернулась последней, как тот, кто выходит из комнаты задом.", "title": "The long way"}, {"id": "EV_FLT03_AROUND_BTN", "group": "EV_FLT03", "text": "Take the long way round", "max": 28, "place": "button", "ru": "Обойти по дуге", "title": "The long way"}, {"id": "EV_FLT03_AROUND_EFF", "group": "EV_FLT03", "text": "The flight is delayed a little.", "max": 90, "place": "effect line", "ru": "Полёт немного задержится.", "title": "The long way"}, {"id": "EV_FLT03_AROUND_TITLE", "group": "EV_FLT03", "text": "The long way", "max": 32, "place": "popup title", "ru": "Дальний путь", "title": "The long way"}, {"id": "EV_FLT03_AROUND", "group": "EV_FLT03", "text": "The Pathfinder swung wide around a lane that was private by decree. The flight is delayed a little. The cutter followed for a while, to see that the sky was not borrowed.", "max": 280, "place": "popup", "ru": "Pathfinder широко обошёл трассу, частную по указу. Полёт немного задержится. Катер шёл следом какое-то время, чтобы убедиться, что небо не занято в долг.", "title": "The long way"}, {"id": "EV_FLT04_TITLE", "group": "EV_FLT04", "text": "Dust across the lane", "max": 32, "place": "pending event title", "ru": "Пыль на трассе", "title": "The hull takes the dust"}, {"id": "EV_FLT04_BODY", "group": "EV_FLT04", "text": "Fine dust crosses the lane and rattles on the hull like rain on a tin roof. The pilot slows, then asks if she may ask what rain is. Nobody on board is sure. The hull is sure only of the dust.", "max": 280, "place": "pending event text", "ru": "Мелкая пыль пересекает трассу и стучит по корпусу, как дождь по жестяной крыше. Пилот сбавляет ход, потом спрашивает, можно ли спросить, что такое дождь. На борту никто не уверен. Корпус уверен лишь в пыли.", "title": "The hull takes the dust"}, {"id": "EV_FLT04_SLOW_BTN", "group": "EV_FLT04", "text": "Slow down", "max": 28, "place": "button", "ru": "Сбавить ход", "title": "The hull takes the dust"}, {"id": "EV_FLT04_SLOW_EFF", "group": "EV_FLT04", "text": "The flight is delayed a little.", "max": 90, "place": "effect line", "ru": "Полёт немного задержится.", "title": "The hull takes the dust"}, {"id": "EV_FLT04_SLOW_TITLE", "group": "EV_FLT04", "text": "The dust passes", "max": 32, "place": "popup title", "ru": "Пыль проходит", "title": "The hull takes the dust"}, {"id": "EV_FLT04_SLOW", "group": "EV_FLT04", "text": "The Pathfinder slowed and the dust went over like a long shift change. The flight is delayed a little. The hull rang once, low, and then did not ring again.", "max": 280, "place": "popup", "ru": "Pathfinder сбавил ход, и пыль прошла, как долгая смена вахты. Полёт немного задержится. Корпус раз низко отозвался и больше не звенел.", "title": "The hull takes the dust"}, {"id": "EV_FLT04_PUSH_BTN", "group": "EV_FLT04", "text": "Push through", "max": 28, "place": "button", "ru": "Пройти напролом", "title": "The hull takes the dust"}, {"id": "EV_FLT04_PUSH_EFF", "group": "EV_FLT04", "text": "Pay a small sum for hull repairs at the next port.", "max": 90, "place": "effect line", "ru": "Заплатить небольшую сумму за ремонт корпуса в следующем порту.", "title": "The hull takes the dust"}, {"id": "EV_FLT04_PUSH_TITLE", "group": "EV_FLT04", "text": "The hull takes the dust", "max": 32, "place": "popup title", "ru": "Корпус принимает пыль", "title": "The hull takes the dust"}, {"id": "EV_FLT04_PUSH", "group": "EV_FLT04", "text": "The Pathfinder pushed through at speed. A small sum goes to hull repairs at the next port. The pilot stood the rest of the shift at the glass, trying to remember what rain was for.", "max": 280, "place": "popup", "ru": "Pathfinder прошёл напролом на скорости. Небольшая сумма уйдёт на ремонт корпуса в следующем порту. Остаток смены пилот простояла у стекла, пытаясь вспомнить, зачем нужен дождь.", "title": "The hull takes the dust"}]}</script>

const SRC_TASKS="<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Star Bazaar Task Board<\/title>\n<style>\n:root{--bg:#f6f6f4;--card:#fff;--ink:#1b1d21;--mute:#6b7078;--line:#dcdcd6;--acc:#2b5fd9;--ok:#1f8a4c;--warn:#b7791f;--bad:#c0392b}\n@media (prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1d2026;--ink:#e8e9ec;--mute:#9097a3;--line:#323741;--acc:#6b9bff;--ok:#4cc27f;--warn:#e0a84a;--bad:#ef6a5b}}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,sans-serif}\nheader{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}\nh1{font-size:16px;margin:0 8px 0 0}\nbutton,select,input,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 9px}\nbutton{cursor:pointer}button:hover{border-color:var(--acc)}\nbutton.primary{background:var(--acc);border-color:var(--acc);color:#fff}\nbutton.danger:hover{border-color:var(--bad);color:var(--bad)}\n#stat{color:var(--mute);margin-left:auto}\n#dirty{color:var(--warn);font-weight:600}\nmain{padding:12px 16px 60px;max-width:1100px;margin:0 auto}\n.task{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}\n.row{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}\n.id{font-weight:700;min-width:44px}\n.title{flex:1;min-width:200px;font-weight:600}\n.tag{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}\n.s-done{color:var(--ok);border-color:var(--ok)}.s-queued{color:var(--acc);border-color:var(--acc)}\n.s-partial,.s-blocked{color:var(--warn);border-color:var(--warn)}.s-stopped{color:var(--bad);border-color:var(--bad)}\n.meta{color:var(--mute);font-size:12px;margin-top:4px}\n.brief{margin-top:6px;white-space:pre-wrap;display:none;color:var(--mute);font-size:13px}\n.task.open .brief{display:block}\n.act{display:flex;gap:6px}\n.act button{padding:2px 8px;font-size:12px}\ndialog{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:min(720px,94vw);padding:16px}\ndialog::backdrop{background:#0008}\nlabel{display:block;font-size:12px;color:var(--mute);margin:8px 0 2px}\ndialog input,dialog select,dialog textarea{width:100%}\ntextarea{min-height:110px;resize:vertical}\n.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.empty{color:var(--mute);padding:30px;text-align:center}\n@media(max-width:600px){.two{grid-template-columns:1fr}}\n<\/style>\n<\/head>\n<body>\n<header>\n  <h1>Task board<\/h1>\n  <input type=\"file\" id=\"pick\" accept=\".json,application/json\" hidden><button id=\"open\">Open schedule.json<\/button>\n  <button id=\"save\" class=\"primary\" disabled>Save<\/button>\n  <button id=\"add\" disabled>+ New task<\/button>\n  <input id=\"q\" placeholder=\"Search\" size=\"16\">\n  <select id=\"fs\"><option value=\"\">All statuses<\/option><option value=\"active\">Not done<\/option><\/select>\n  <select id=\"fa\"><option value=\"\">All agents<\/option><\/select>\n  <span id=\"dirty\"><\/span><span id=\"stat\">No file loaded<\/span>\n<\/header>\n<main id=\"list\"><div class=\"empty\">Click \"Open schedule.json\" and pick the file from the project root.<br>Save writes back to that same file (Chrome, Edge or Arc). Other browsers download a copy.<\/div><\/main>\n\n<dialog id=\"dlg\">\n  <form method=\"dialog\" id=\"form\">\n    <div class=\"two\">\n      <div><label>Task id<\/label><input id=\"f_id\" required><\/div>\n      <div><label>Status<\/label><select id=\"f_status\"><\/select><\/div>\n    <\/div>\n    <label>Title<\/label><input id=\"f_title\" required>\n    <div class=\"two\">\n      <div><label>Owner agent<\/label><input id=\"f_agent\" list=\"agents\"><\/div>\n      <div><label>Turn cap<\/label><input id=\"f_cap\" type=\"number\" min=\"0\"><\/div>\n    <\/div>\n    <label>Depends on (comma separated ids)<\/label><input id=\"f_dep\">\n    <label>Window<\/label><input id=\"f_win\">\n    <label>Brief<\/label><textarea id=\"f_brief\"><\/textarea>\n    <label>Owner note<\/label><input id=\"f_note\">\n    <div class=\"row\" style=\"margin-top:12px;justify-content:flex-end\">\n      <button type=\"button\" id=\"cancel\">Cancel<\/button>\n      <button type=\"submit\" class=\"primary\" id=\"ok\">Apply<\/button>\n    <\/div>\n  <\/form>\n  <datalist id=\"agents\"><\/datalist>\n<\/dialog>\n\n<script>\nconst STATUSES=[\"queued\",\"partial\",\"blocked\",\"stopped\",\"done\"];\nlet data=null,handle=null,dirty=false,editing=null;\nconst $=id=>document.getElementById(id);\nconst esc=s=>String(s??\"\").replace(/[&<>\"]/g,c=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]));\n\nfunction setDirty(v){dirty=v;$(\"dirty\").textContent=v?\"Unsaved changes\":\"\";}\nfunction load(obj){\n  data=obj;data.done_task_ids=data.done_task_ids||[];\n  $(\"save\").disabled=false;$(\"add\").disabled=false;setDirty(false);\n  const ags=[...new Set(data.tasks.map(t=>t.owner_agent).filter(Boolean).concat(\"owner\"))].sort();\n  $(\"fa\").innerHTML='<option value=\"\">All agents<\/option>'+ags.map(a=>`<option>${esc(a)}<\/option>`).join(\"\");\n  $(\"agents\").innerHTML=ags.map(a=>`<option value=\"${esc(a)}\">`).join(\"\");\n  render();\n}\nfunction render(){\n  if(!data)return;\n  const q=$(\"q\").value.toLowerCase(),fs=$(\"fs\").value,fa=$(\"fa\").value;\n  const order={queued:0,partial:1,blocked:2,stopped:3,done:4};\n  const rows=data.tasks.filter(t=>{\n    if(fs===\"active\"&&t.status===\"done\")return false;\n    if(fs&&fs!==\"active\"&&t.status!==fs)return false;\n    if(fa&&t.owner_agent!==fa)return false;\n    if(q&&!JSON.stringify(t).toLowerCase().includes(q))return false;\n    return true;\n  }).sort((a,b)=>(order[a.status]??9)-(order[b.status]??9));\n  const c={};data.tasks.forEach(t=>c[t.status]=(c[t.status]||0)+1);\n  $(\"stat\").textContent=data.tasks.length+\" tasks \u00b7 \"+STATUSES.map(s=>(c[s]||0)+\" \"+s).join(\" \u00b7 \");\n  $(\"list\").innerHTML=rows.length?rows.map(t=>{\n    const i=data.tasks.indexOf(t);\n    return `<div class=\"task\" data-i=\"${i}\">\n      <div class=\"row\">\n        <span class=\"id\">${esc(t.task_id)}<\/span>\n        <span class=\"title\">${esc(t.title)}<\/span>\n        <span class=\"tag s-${esc(t.status)}\">${esc(t.status)}<\/span>\n        <span class=\"tag\">${esc(t.owner_agent)}<\/span>\n        <span class=\"act\">\n          ${t.status===\"done\"?`<button data-a=\"undone\">Reopen<\/button>`:`<button data-a=\"done\">Done<\/button>`}\n          <button data-a=\"edit\">Edit<\/button>\n          <button data-a=\"del\" class=\"danger\">Delete<\/button>\n        <\/span>\n      <\/div>\n      <div class=\"meta\">${(t.depends_on||[]).length?\"depends on \"+esc(t.depends_on.join(\", \"))+\" \u00b7 \":\"\"}cap ${esc(t.turn_cap??\"-\")}${t.window?\" \u00b7 \"+esc(t.window):\"\"}<\/div>\n      <div class=\"brief\">${esc(t.brief)}${t.owner_note?\"\\n\\nOwner note: \"+esc(t.owner_note):\"\"}<\/div>\n    <\/div>`}).join(\"\"):'<div class=\"empty\">No tasks match.<\/div>';\n}\nfunction markDone(t,on){\n  t.status=on?\"done\":\"queued\";\n  const s=new Set(data.done_task_ids);on?s.add(t.task_id):s.delete(t.task_id);data.done_task_ids=[...s];\n}\n$(\"list\").addEventListener(\"click\",e=>{\n  const card=e.target.closest(\".task\");if(!card)return;\n  const t=data.tasks[+card.dataset.i],a=e.target.dataset.a;\n  if(!a){card.classList.toggle(\"open\");return;}\n  if(a===\"done\")markDone(t,true);\n  else if(a===\"undone\")markDone(t,false);\n  else if(a===\"del\"){\n    const users=data.tasks.filter(x=>(x.depends_on||[]).includes(t.task_id)).map(x=>x.task_id);\n    if(!confirm(`Delete ${t.task_id} \"${t.title}\"?`+(users.length?`\\n\\nStill listed as a dependency of: ${users.join(\", \")}`:\"\")))return;\n    data.tasks.splice(+card.dataset.i,1);data.done_task_ids=data.done_task_ids.filter(x=>x!==t.task_id);\n  }else if(a===\"edit\"){openDlg(t);return;}\n  setDirty(true);render();\n});\n[\"q\",\"fs\",\"fa\"].forEach(id=>$(id).addEventListener(\"input\",render));\n\n$(\"f_status\").innerHTML=STATUSES.map(s=>`<option>${s}<\/option>`).join(\"\");\nfunction nextId(){\n  const n=data.tasks.map(t=>/^T(\\d+)/.exec(t.task_id)).filter(Boolean).map(m=>+m[1]);\n  return \"T\"+(Math.max(0,...n)+1);\n}\nfunction openDlg(t){\n  editing=t;const n=t||{task_id:nextId(),status:\"queued\",owner_agent:\"\",turn_cap:30,depends_on:[],window:\"\",brief:\"\",owner_note:\"\",title:\"\"};\n  $(\"f_id\").value=n.task_id;$(\"f_status\").value=n.status;$(\"f_title\").value=n.title;\n  $(\"f_agent\").value=n.owner_agent||\"\";$(\"f_cap\").value=n.turn_cap??\"\";\n  $(\"f_dep\").value=(n.depends_on||[]).join(\", \");$(\"f_win\").value=n.window||\"\";\n  $(\"f_brief\").value=n.brief||\"\";$(\"f_note\").value=n.owner_note||\"\";\n  $(\"dlg\").showModal();\n}\n$(\"add\").onclick=()=>openDlg(null);\n$(\"cancel\").onclick=()=>$(\"dlg\").close();\n$(\"form\").addEventListener(\"submit\",e=>{\n  e.preventDefault();\n  const id=$(\"f_id\").value.trim();\n  if(data.tasks.some(x=>x.task_id===id&&x!==editing)){alert(\"Id \"+id+\" already exists.\");return;}\n  const old=editing?editing.task_id:null;\n  const t=editing||{};\n  Object.assign(t,{task_id:id,title:$(\"f_title\").value.trim(),owner_agent:$(\"f_agent\").value.trim(),\n    depends_on:$(\"f_dep\").value.split(\",\").map(s=>s.trim()).filter(Boolean),status:$(\"f_status\").value,\n    turn_cap:$(\"f_cap\").value===\"\"?undefined:+$(\"f_cap\").value,window:$(\"f_win\").value,brief:$(\"f_brief\").value});\n  if($(\"f_note\").value)t.owner_note=$(\"f_note\").value;else delete t.owner_note;\n  if(t.turn_cap===undefined)delete t.turn_cap;\n  if(!editing)data.tasks.push(t);\n  if(old&&old!==id)data.tasks.forEach(x=>x.depends_on=(x.depends_on||[]).map(d=>d===old?id:d));\n  const s=new Set(data.done_task_ids);s.delete(old);t.status===\"done\"?s.add(id):s.delete(id);data.done_task_ids=[...s];\n  setDirty(true);load2();$(\"dlg\").close();\n});\nfunction load2(){const d=dirty;load(data);setDirty(d);}\n\nasync function loadFile(f){\n  try{load(JSON.parse(await f.text()));}\n  catch(e){alert(\"Could not read \"+(f.name||\"file\")+\": \"+e.message);}\n}\n$(\"pick\").addEventListener(\"change\",()=>{const f=$(\"pick\").files[0];handle=null;if(f)loadFile(f);$(\"pick\").value=\"\";});\n$(\"open\").onclick=async()=>{\n  if(window.showOpenFilePicker){\n    try{\n      [handle]=await showOpenFilePicker({types:[{description:\"JSON\",accept:{\"application/json\":[\".json\"]}}]});\n      await loadFile(await handle.getFile());return;\n    }catch(e){if(e.name===\"AbortError\")return;handle=null;}\n  }\n  $(\"pick\").click();\n};\ndocument.addEventListener(\"dragover\",e=>e.preventDefault());\ndocument.addEventListener(\"drop\",async e=>{\n  e.preventDefault();const it=e.dataTransfer.items[0];\n  handle=(it&&it.getAsFileSystemHandle)?await it.getAsFileSystemHandle().catch(()=>null):null;\n  const f=e.dataTransfer.files[0];if(f)loadFile(f);\n});\n$(\"save\").onclick=async()=>{\n  const text=JSON.stringify(data,null,2)+\"\\n\";\n  try{\n    if(handle){const w=await handle.createWritable();await w.write(text);await w.close();setDirty(false);}\n    else{const a=document.createElement(\"a\");a.href=URL.createObjectURL(new Blob([text],{type:\"application/json\"}));a.download=\"schedule.json\";a.click();setDirty(false);}\n  }catch(e){alert(\"Could not save: \"+e.message);}\n};\nwindow.addEventListener(\"beforeunload\",e=>{if(dirty){e.preventDefault();e.returnValue=\"\";}});\nload({\"schema_version\": 1, \"date\": \"2026-11-02\", \"tasks\": [{\"task_id\": \"T79\", \"title\": \"Tests: loader, ending selection, recording, choice screen (headless)\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [\"T78\", \"T93\"], \"status\": \"done\", \"turn_cap\": 30, \"window\": \"Gameplay lane, after T93 (T78 done)\", \"brief\": \"Scripts under tools/tests/ (not exported). Checks: (1) tools/build_story.py runs; every id the game asks for exists; every length is within max. (2) Ending selection: each Release and corporate ending is reached by a synthetic input; first match wins; the default is reached when nothing else matches. (3) Recording: one win adds exactly one count; reload does not double count; a corrupt file is moved aside and recreated; a loss adds exactly one LOSS count (T78 records side LOSS). (4) Choice screen has exactly two choices (Release, Stay as a Corporation). Run: godot --headless --path . --quit-after 300 and the test script. Fix only bugs the tests find in the feature code. (5) Tier count (T93) is recorded once per win. Handoff: handoffs/gameplay-programmer/<date>-T79.json with pass and fail counts. (4) Expansion points are awarded once per planet, pair and system (T82).\", \"owner_note\": \"Owner asked for tests as a separate item.\"}, {\"task_id\": \"T93\", \"title\": \"Ending tier in the stats record\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [\"T78\"], \"status\": \"done\", \"turn_cap\": 15, \"window\": \"Gameplay lane, small, before T79 (T78 done). DONE 2026-10-28: handoffs/gameplay-programmer/2026-10-28-T93.json.\", \"brief\": \"Owner decision 2026-10-27 (item 5). The win record stores the ending tier as an empty string (T78 handoff: no tier known at finish). Pass the tier from the ending picker (T77) to the recorder and store it in user://stats.json as tiers {tier: count}. Keep schema_version 1 unless a migration is needed; say so in the handoff. Do not change the picker table or ending texts. Losses stay as side LOSS (T78). Handoff: handoffs/gameplay-programmer/<date>-T93.json.\", \"owner_note\": \"Owner 2026-10-27: keep LOSS in the record and add the ending tier. Small task, before the tests in T79.\"}, {\"task_id\": \"T71\", \"title\": \"Skill tree screen, skill points top bar and game menu\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [\"T79\"], \"status\": \"done\", \"turn_cap\": 70, \"window\": \"Gameplay lane, right after T79 and before T69 and T70\", \"brief\": \"Owner restore 2026-10-27: runs as soon as possible, right after T79. Build the skill tree per gdd-skills.md sections 2, 6, 7 and 8. (1) Top bar shows 'Skill points' (main.skill_points, saved; label text from story/screens.md via story_text.gd). (2) Skills button (hotkey K) opens the screen with three branch columns: Logistics, Research, Expansion. (3) Skill names and descriptions use the SK_* ids in story/screens.md and skills.md; no hard-coded text; list any SK_* id with no screen. (4) Learning a skill spends skill points, sets learned_skills, and uses the per-skill cost from data/balance.json skill_cost_<id>; no new numbers. (5) has_skill hooks for the effect keys. (6) Game menu: Resume, Skills, Main menu, Quit, with reserved slots for Settings, Statistics, Help, Save and load. (7) Save and load learned_skills and skill points. Starting skills (storage and next-system licence) per gdd-skills.md. The Space Storage start skill waits for T85. If a skill_cost_<id> key or SK_* id is missing, stop that item and list it. Handoff: handoffs/gameplay-programmer/<date>-T71.json.\", \"owner_note\": \"Created 2026-10-27; restored by owner (was stopped) and run right after T79. T72 and T70 dependencies dropped for this run (owner order). Supersedes T60 (stopped). systems_reached is set by T85.\"}, {\"task_id\": \"T69\", \"title\": \"Show ship maintenance to the player (no hidden costs)\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [\"T79\"], \"status\": \"done\", \"turn_cap\": 40, \"window\": \"Gameplay lane, after T79; T69 and T70 together\", \"brief\": \"Owner direction 2026-10-27: maintenance used to be a hidden value; expose it so the player never sees less profit than expected. Show it wherever profit is shown: (1) on a route's connection entry in the planet panel: revenue, goods cost, ship maintenance and trip cost as separate lines, then net per cycle; (2) in the ship panel: each ship's maintenance per cycle and the total; (3) in the cash forecast: maintenance as its own line, not folded into route net; (4) in the end-of-cycle summary or notice: gross profit, maintenance paid, net, in one line. Use plain labels such as 'Ship upkeep'. If an old tooltip or hint calls the number profit when it is net of upkeep, relabel it. No balance values change. Handoff: handoffs/gameplay-programmer/<date>-T69.json. ADDED 2026-10-27: in the cash forecast dropdown (game/cash_forecast.gd, opened by clicking the money UI) the red section is headed 'Outcome:' (owner calls it Outflow). Rename the heading to 'Expenses:' and list ship upkeep there, one line per ship or one total (programmer's choice, whichever fits), so the cash after the cycle adds up: income minus expenses. The income lines then show gross, not net of upkeep, if the engine can supply it; if not, report. Update the comments in that file that say maintenance is netted inside each route.\", \"owner_note\": \"Owner 2026-10-27. Also tell the T62 agent (general-purpose; no doc-manager agent exists) to document that upkeep is visible.\"}, {\"task_id\": \"T70\", \"title\": \"Routes wait when the destination has outflow; block only when there is none\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [\"T79\"], \"status\": \"done\", \"turn_cap\": 30, \"window\": \"Gameplay lane, after T79; with T69\", \"brief\": \"Owner direction 2026-10-27. A route must not break just because supply exceeds demand (for example the route delivers 10 and the destination sells 5). Rule: when the destination storage is full or has less room than the load, a route that has OUTFLOW at the destination for that commodity WAITS: it moves only what fits this cycle (partial load, no all-or-nothing), never turns red and raises no notification; status text 'Waiting for room.' in a neutral colour. Outflow = an enabled local Sell order for that commodity at the destination, or an outgoing route from that storage for that commodity. Only when the destination is full and there is NO outflow does the route become BLOCKED (red, one notification, stops) because nothing will ever make room; it resumes by itself when an outflow appears or the storage drains. An empty source still stalls. Update the cash forecast so a waiting route shows the reduced amount it really moves. Handoff: handoffs/gameplay-programmer/<date>-T70.json.\", \"owner_note\": \"Owner 2026-10-27.\"}, {\"task_id\": \"T87\", \"title\": \"Multi-ship lanes (several ships on one identical lane)\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [\"T70\", \"T81\"], \"status\": \"done\", \"turn_cap\": 40, \"window\": \"Gameplay lane, after T70, before T58\", \"brief\": \"Owner decision 2026-10-27 (ship option A): several ships may share one identical lane (same source, destination and commodity). Today game/route_engine.gd find_same rejects a second route with the same source, destination and commodity. (1) Allow adding a ship to an existing lane: either 'Send to...' again on the same pair, or an explicit add-ship control on the lane. Pick one and state it in the handoff. (2) Ships on one lane share the planet and commodity standing order pool; that pool, not a ship count, caps useful ships. Add no new ship cap; the natural limit from T81 applies. (3) UI text comes from story ids in data/story_text.json. If a needed id is missing, do not invent text: list the id, its meaning and max length in the handoff for the story-designer. (4) Verify against the marginal-per-ship numbers in handoffs/economy-designer/2026-10-27-ship-cap-and-system2.json: report in-game profit for ships 1 to N on one lane and where it differs from the sim. Change no values. Handoff: handoffs/gameplay-programmer/<date>-T87.json.\", \"owner_note\": \"Owner decision 2026-10-27, item 1. Followed by T88 (economy re-check) and T91 (GDD reconcile).\"}, {\"task_id\": \"T58\", \"title\": \"Ship types: small and large, names, purchase and maintenance\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [\"T70\", \"T87\"], \"status\": \"done\", \"turn_cap\": 30, \"window\": \"Gameplay lane, after T87 (ship numbers from T81, done)\", \"brief\": \"Two ship types in data/ (abstract numbers): small and large (higher capacity, higher purchase and maintenance, abstract speed). Working names, owner to confirm: small = Skerrit, large = Voruun Hauler (alien-sounding, no franchise references). Auto-assignment picks a suitable free ship; buying a ship happens from the ship panel. Ships are for hauling only. Handoff: handoffs/gameplay-programmer/<date>-T58.json.\", \"owner_note\": \"Names are a proposal; owner may change them.\"}, {\"task_id\": \"T12\", \"title\": \"Events as price modifiers\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [\"T87\"], \"status\": \"done\", \"turn_cap\": 50, \"window\": \"Gameplay lane, after T58\", \"brief\": \"Owner request 2026-10-27 (b). Runtime effects per tools/event_effects.md: price up or down 20% for 3 cycles on one planet's commodity; planet closed for 3 cycles (routes touching it blocked, nothing paid or charged); one-off cash and stock effects as tagged. Texts and titles come from data/events.json (built by T76 from story/events.md); do not hard-code. Each event is a paused notification with Continue, or two to three choice buttons for choice events (8 to 10 of 16); picking applies that choice's effect and unpauses. The notice shows the plain effect line with NOT_EVENT_PREFIX. Add an event feed in the panel listing this run's events. Events fire every event_interval cycles. Add a debug trigger for any event by id (stripped from release). Magnitudes and durations may be numbers in data/balance.json or data/events.json. If you change a choice's effect, list it under details so the main session can send it to the story-designer. Do not rewrite story text. Handoff: handoffs/gameplay-programmer/<date>-T12.json.\", \"owner_note\": \"Producer 2026-10-27: owner request (b). Event texts already built by T76 and choice events written by T74. Owner topic to discuss later (2026-10-27): skill B3 (display only until price moves exist). Not part of this task. 2026-10-27 owner: no longer waits for T58 (ship types optional).\"}, {\"task_id\": \"T83\", \"title\": \"Wire remaining story texts: untriggered notices, skill texts, preface skip, main menu\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [\"T12\", \"T84\"], \"status\": \"done\", \"turn_cap\": 40, \"window\": \"Gameplay lane, after T12\", \"brief\": \"Owner request 2026-10-27 (c). Load every text by id through game/story_text.gd from data/story_text.json; do not hard-code. (1) Give triggers to the notices with none yet: route stalled, ship bought, saved, paused (ids in the T76 handoff and any new ones from T84). (2) Skill points notice (NOT_SKILL_POINT): wire the trigger only. SK_* texts and the Skill points top bar belong to T71; do not wire the skill screen here. (3) Preface skip button. (4) Main menu, owner defaults 2026-10-27: New game replaces the saved game after the confirm dialog (MENU_CONFIRM_NEW). Continue with no save is disabled and shows MENU_HINT_CONTINUE_OFF (\\\"Continue needs a saved game.\\\"). Drop NOT_NO_SAVE and NOT_RESUMED: do not wire them. Continue is hard-coded in game/main_menu.gd today; wire the ids there. Any other missing id: skip it and list it. Do not invent or rewrite text. Handoff: handoffs/gameplay-programmer/<date>-T83.json.\", \"owner_note\": \"Producer 2026-10-27: owner request (c). Owner 2026-10-27: menu defaults and the T71 split are in the brief. Story ids come from T84 (done).\"}, {\"task_id\": \"T15\", \"title\": \"Tutorial for the first 4 cycles (route version)\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [\"T83\"], \"status\": \"done\", \"turn_cap\": 60, \"window\": \ Add to the glossary in story/voice.md, in the file's format: Hollin Reach (system 1); Dunmere Reach (system 2); Brannock, Cindrel, Mossfell and Quillon (system 2 planets, as listed in the T86 handoff). Glossary entries only. Run tools/build_story.py only if voice.md feeds it. Handoff: handoffs/story-designer/<date>-T92.json.\", \"owner_note\": \"Owner decision 2026-10-27, item 4. Names approved.\"}, {\"task_id\": \"T53\", \"title\": \"QA bot rewrite: strategies act through routes\", \"owner_agent\": \"qa-analyst\", \"depends_on\": [], \"status\": \"done\", \"turn_cap\": 25, \"window\": \"QA lane, alone or with T47 or T80 (max 4 per window)\", \"brief\": \"Rewrite the bot strategies in qa/bots/ to act through planet standing Buy and Sell orders (local, enabled per row), 'Send to...' routes between company storages, and route removal. Keep the four strategy names (always_expand, never_expand, sloppy, decent), the fast-forward batch and the timer option. Do not change game code or balance. Handoff: handoffs/qa-analyst/<date>-T53.json.\", \"owner_note\": \"owner C2 new task for qa-analyst; prerequisite of T47. REDESIGN 2026-10-27: bots act through planet Buy/Sell orders and route removal; rewrite after T56.\"}, {\"task_id\": \"T80\", \"title\": \"QA run, system 1: both branches, endings reached, recording and reload\", \"owner_agent\": \"qa-analyst\", \"depends_on\": [\"T79\", \"T53\", \"T12\", \"T83\", \"T93\"], \"status\": \"done\", \"turn_cap\": 40, \"window\": \"QA lane, after T79, T12 and T85 (max 4 per window)\", \"brief\": \"Use the T78 force-goal control. Run both branches on seeds 1 to 5 (fast-forward; timer where practical). For each run record choice, ending id, cycle and cash. Check: the choice screen appears once at the goal; the recording adds one count per answered win; reload does not double count; a loss adds exactly one LOSS count; no softlock at the choice or ending screen; every END_CORP_* and every Release ending is reached at least once (list any unreached id and why). Also one natural run per strategy: report whether the goal is reached (expected no, T54 on hold). Do not change code, data or balance. Handoff: handoffs/qa-analyst/<date>-T80.json. Owner 2026-10-27: also cover events (T12: price and closure last 3 cycles; choice effects apply) and system 2 (T85: permit purchase, Space Storage post per system, transfer, support of a broken route). Report each as its own section.\", \"owner_note\": \"Owner asked for a QA bot run on both branches and the recording. 2026-10-27 owner: split; system 2 part moved to T94.\"}, {\"task_id\": \"T47\", \"title\": \"QA re-run on the route build (system 1 only)\", \"owner_agent\": \"qa-analyst\", \"depends_on\": [\"T53\", \"T82\"], \"status\": \"done\", \"turn_cap\": 30, \"window\": \"QA lane, after T53 and T82; with T80 if ready\", \"brief\": \"Re-run the four strategies with fast-forward and timer runs, seeds 1 to 5, on the route build with permits absent. Report final_cash, cycle_reached and outcome per strategy, win-boundary probes, softlocks, dominant strategy, timer vs fast-forward gap, and pacing against balance targets. Flag crashes. Handoff: handoffs/qa-analyst/<date>-T47.json.\", \"owner_note\": \"Replaces T09 as the real check. First real read of the system-1 win path (see state.md). REDESIGN 2026-10-27: runs on the click-to-route build, after T57.\"}, {\"task_id\": \"T91\", \"title\": \"GDD reconcile after multi-ship lanes\", \"owner_agent\": \"general-purpose\", \"depends_on\": [\"T87\"], \"status\": \"done\", \"turn_cap\": 30, \"window\": \"Doc lane, after T87; no game code\", \"brief\": \"Owner decision 2026-10-27 (item 10). Update gdd.md, gdd-process.md and gdd-log.md: (1) remove the old round-trip route and saturation text; describe one-way routes, planet storage, standing orders and the rating; (2) system-1 win path text: match the current rule (cash goal, 30 cycles, final choice); (3) remove stale 'success story' wording; (4) gdd-process.md agent roster: no doc-manager agent; general-purpose does doc work; story-designer exists; (5) saved-games note: local user:// saves and the stats file (T78). Read only the gdd sections each edit cites. Change no numbers. Log every edit in gdd-log.md. Handoff: handoffs/general-purpose/<date>-T91.json.\", \"owner_note\": \"Owner decision 2026-10-27, item 10. No doc-manager agent exists.\"}, {\"task_id\": \"T05\", \"title\": \"Galaxy background (basic 3D star field), next steps\", \"owner_agent\": \"galaxy-builder\", \"depends_on\": [\"T15\"], \"status\": \"partial\", \"turn_cap\": 40, \"window\": \"W9 galaxy window (solo), after T15\", \"brief\": \"Visual element, not gameplay. Build the galaxy generator per GDD section 5: scatter points, bake a low-res density grid, pick suns, propagate light once at scene generation. Keep within a macOS frame budget and report frame_time_ms.\", \"owner_note\": \"Owner decided T05 comes after the tutorial. Basic star field done (T05b). Still open: density grid and sun propagation.\"}, {\"task_id\": \"T13\", \"title\": \"Debug and Game Control menus (tuning only)\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [\"T12\", \"T15\", \"T85\"], \"status\": \"done\", \"turn_cap\": 50, \"window\": \"Gameplay lane, last, after T85\", \"brief\": \"Game Control menu reads and writes data/balance.json (values and targets), plus event control (frequency, list, trigger, multiplier from T12), plus route level and route keys (ship_cap, saturation, orders fields). Stripped from release builds. One menu only: extend the T33 debug menu.\", \"owner_note\": \"Owner placed after the tutorial (T15). Needs the T12 event controls. Route level and orders are hooks from T07.\"}, {\"task_id\": \"T89\", \"title\": \"Skill A3 hauler effects\", \"owner_agent\": \"gameplay-programmer\", \"depends_on\": [\"T71\", \"T58\"], \"status\": \"done\", \"turn_cap\": 30, \"window\": \"Gameplay lane, low priority, last\", \"brief\": \"Owner decision 2026-10-27 (item 7). Skill A3
