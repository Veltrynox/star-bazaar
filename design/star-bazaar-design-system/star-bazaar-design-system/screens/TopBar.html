<html data-theme="dark"><head><style>/* Star Bazaar UI — component styles. Every colour, gap and radius is a token from tokens.json. */
@import url("https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap");

html, body { margin: 0; background: var(--void-100); color: var(--ink); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
.ds-pad { padding: var(--space-5); }

.ds-mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.ds-space { position: relative; overflow: hidden; background:
  radial-gradient(ellipse 40% 30% at 30% 62%, #5a46362e, transparent 70%),

  radial-gradient(ellipse 120% 90% at 50% 50%, var(--void-100), var(--void-000)); }

.ds-goal .track { height: 3px; border-radius: var(--radius-full); background: var(--line-100); overflow: hidden; }

.ds-runstate { display: flex; align-items: center; gap: var(--space-3); height: 56px; padding: 0 var(--space-4) 0 var(--space-3); border-radius: var(--radius-lg); cursor: pointer; }

  color: var(--signal-warn); font: 400 13px/18px var(--font-sans); letter-spacing: .03em; backdrop-filter: blur(var(--blur-glass)); }

.ds-maplabel .yields span { display: inline-flex; align-items: center; gap: 3px; }
.ds-maplabel .yields .ds-icon { width: 12px; height: 12px; }
.ds-maplabel.dim { color: var(--ink-muted); }
.ds-maplabel.locked { color: var(--ink-subtle); }
.ds-sysname { font: 300 15px/20px var(--font-sans); letter-spacing: .3em; color: var(--ink-muted); text-transform: uppercase; }
.ds-routetag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: var(--radius-full); background: var(--panel-100); border: 1px solid var(--line-100);

.ds-conn .route .ds-icon { width: 14px; height: 14px; }

.ds-keys span { display: inline-flex; align-items: center; gap: 6px; }

.ds-choice .ds-btn { width: 100%; justify-content: center; }
.ds-choice .eff { font: 400 12px/16px var(--font-sans); color: var(--ink-muted); text-align: center; margin-top: 6px; }
